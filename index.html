// 簽名圖處理成「貼在勞報單簽章欄」的樣子：只留筆跡範圍（裁掉空白、留一點邊距）、背景透明、
// 縮到適合簽章欄的大小（最寬 640、最高 220，等比例），這樣貼上去不會太小、也不會超出欄位。
// 簽名板一律是橫向的畫布（直拿手機時畫面會旋轉成橫向，座標已經轉正），所以這裡不用再旋轉。
function buildSignatureForSlip(canvas){
  const ctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  let minX=w, minY=h, maxX=0, maxY=0, found=false;
  const data = ctx.getImageData(0,0,w,h).data;
  const step = 2; // 抽樣掃描加快速度，簽名筆畫夠粗不會因此漏掉範圍
  for(let y=0; y<h; y+=step){
    for(let x=0; x<w; x+=step){
      if(data[(y*w+x)*4+3] > 10){
        found = true;
        if(x<minX) minX=x; if(x>maxX) maxX=x;
        if(y<minY) minY=y; if(y>maxY) maxY=y;
      }
    }
  }
  if(!found) return canvas.toDataURL('image/png');
  const pad = 14;
  minX = Math.max(0, minX-pad); minY = Math.max(0, minY-pad);
  maxX = Math.min(w, maxX+pad); maxY = Math.min(h, maxY+pad);
  const cropW = maxX-minX, cropH = maxY-minY;
  const scale = Math.min(1, 640/cropW, 220/cropH);
  const out = document.createElement('canvas');
  out.width = Math.max(1, Math.round(cropW*scale));
  out.height = Math.max(1, Math.round(cropH*scale));
  out.getContext('2d').drawImage(canvas, minX, minY, cropW, cropH, 0, 0, out.width, out.height);
  return out.toDataURL('image/png');
}
// 滿版橫式簽名視窗：點「已確認報酬並簽名」才開，蓋滿整個螢幕、鎖住背景捲動。
// 手機如果是直的，簽名板會旋轉 90 度（請把手機橫過來握著簽；握反了按「翻轉」），手機本身已經是橫向就直接用；
// 筆跡座標一律換算回橫向畫布，所以存出來的簽名一定是正的橫式。簽完先預覽貼在勞報單簽章欄的樣子，再按「確認送出」。
function openSignatureModal(record){
  const host = document.getElementById('sigModalHost');
  const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent);
  let flip = false, drawing = false, hasSignature = false;
  const prevOverflow = document.body.style.overflow;
  document.body.style.overflow = 'hidden';
  host.innerHTML = `
    <div class="sig-full" id="sigFull">
      <div id="sigStage">
        <canvas id="sigPad"></canvas>
        <div class="sig-watermark">請簽名</div>
        <div id="sigHint" class="sig-hint"></div>
        <div class="sig-bar">
          <div class="sig-side">
            <button class="sig-clear-link" id="sigClear">清除重簽</button>
            <button class="sig-clear-link" id="sigFlip" style="display:none;">翻轉方向</button>
          </div>
          <div class="sig-side">
            <button class="sig-icon-btn cancel" id="sigCancel" title="取消">❌</button>
            <button class="sig-icon-btn confirm" id="sigConfirm" title="完成簽名">☑️</button>
          </div>
        </div>
      </div>
    </div>`;
  const full = document.getElementById('sigFull');
  const stage = document.getElementById('sigStage');
  const canvas = document.getElementById('sigPad');
  const ctx = canvas.getContext('2d');
  const hint = document.getElementById('sigHint');
  const flipBtn = document.getElementById('sigFlip');
  const DPR = 2;
  full.addEventListener('touchmove', e=>e.preventDefault(), { passive:false });
  // Android 可以真的全螢幕＋鎖橫向（iPhone 不支援，靠旋轉簽名板）；失敗就算了，不影響簽名。
  if(!isIOS){
    try{ const r = document.documentElement.requestFullscreen && document.documentElement.requestFullscreen(); if(r && r.then) r.then(()=>{ try{ screen.orientation.lock('landscape').catch(()=>{}); }catch(e){} }).catch(()=>{}); }catch(e){}
  }
  function layout(){
    const W = window.innerWidth, H = window.innerHeight;
    const rotated = H > W;
    const lw = rotated ? H : W, lh = rotated ? W : H; // 簽名板自己的（橫向）寬高
    stage.style.width = lw+'px'; stage.style.height = lh+'px';
    if(!rotated){ stage.style.left = '0px'; stage.style.top = '0px'; stage.style.transform = 'none'; }
    else if(!flip){ stage.style.left = W+'px'; stage.style.top = '0px'; stage.style.transform = 'rotate(90deg)'; }
    else { stage.style.left = '0px'; stage.style.top = H+'px'; stage.style.transform = 'rotate(-90deg)'; }
    flipBtn.style.display = rotated ? '' : 'none';
    hint.textContent = rotated ? '請把手機橫過來握著簽名（字是倒的就按「翻轉方向」）' : '';
    const prev = (canvas.width && hasSignature) ? canvas.toDataURL('image/png') : null;
    canvas.width = lw*DPR; canvas.height = lh*DPR;
    ctx.lineWidth = 5; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#1B2129';
    if(prev){ const img = new Image(); img.onload = ()=> ctx.drawImage(img,0,0,canvas.width,canvas.height); img.src = prev; }
  }
  // 螢幕座標 → 簽名板（橫向）座標
  function pos(e){
    const W = window.innerWidth, H = window.innerHeight;
    let lx, ly;
    if(H <= W){ lx = e.clientX; ly = e.clientY; }
    else if(!flip){ lx = e.clientY; ly = W - e.clientX; }
    else { lx = H - e.clientY; ly = e.clientX; }
    return { x: lx*DPR, y: ly*DPR };
  }
  layout();
  window.addEventListener('resize', layout);
  window.addEventListener('orientationchange', layout);
  canvas.addEventListener('pointerdown', e=>{ drawing=true; hasSignature=true; const p=pos(e); ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(p.x+0.01,p.y); ctx.stroke(); });
  canvas.addEventListener('pointermove', e=>{ if(!drawing) return; const p=pos(e); ctx.lineTo(p.x,p.y); ctx.stroke(); });
  window.addEventListener('pointerup', onUp);
  function onUp(){ drawing=false; }
  function close(){
    window.removeEventListener('resize', layout); window.removeEventListener('orientationchange', layout); window.removeEventListener('pointerup', onUp);
    document.body.style.overflow = prevOverflow;
    try{ if(document.fullscreenElement) document.exitFullscreen(); screen.orientation.unlock(); }catch(e){}
    host.innerHTML = '';
  }
  document.getElementById('sigClear').onclick = ()=>{ ctx.clearRect(0,0,canvas.width,canvas.height); hasSignature=false; };
  flipBtn.onclick = ()=>{ flip = !flip; layout(); };
  document.getElementById('sigCancel').onclick = close;
  document.getElementById('sigConfirm').onclick = ()=>{
    if(!hasSignature){ alert('請先簽名再送出'); return; }
    const sigUrl = buildSignatureForSlip(canvas);
    close();
    showSignaturePreview(record, sigUrl);
  };
}
// 簽完先預覽「貼在勞報單簽章欄」的樣子（跟勞報單用同樣的欄位與圖片大小限制），確認才送出，不滿意回去重簽。
function showSignaturePreview(record, sigUrl){
  const host = document.getElementById('sigModalHost');
  const payDate = record.payDate || (()=>{ const [y,m] = record.month.split('-').map(Number); const d = new Date(y, m, 1); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-15`; })();
  const prevOverflow = document.body.style.overflow;

  host.innerHTML = `
    <div class="sig-full" style="display:flex; align-items:center; justify-content:center; padding:16px; overflow:auto;">
      <div style="background:#fff; border-radius:12px; padding:16px; width:100%; max-width:560px; color:#1B2129;">
        <div style="font-weight:700; margin-bottom:6px;">請確認簽名（勞報單上的樣子）</div>
        <div style="font-size:12.5px; color:#5B6470; margin-bottom:8px;">${statementLabel(record)}　報酬總額 $${money(record.net)}　實領金額 $${money(record.actualNet)}</div>
        <table style="width:100%; border-collapse:collapse; font-size:12.5px;">
          <tr style="border-top:1px solid #D8DADF; border-bottom:1px solid #D8DADF;">
            <td style="width:22%; padding:8px 6px;">所得人簽章</td>
            <td style="width:38%; padding:8px 6px; height:72px;"><img src="${sigUrl}" style="max-height:56px; max-width:100%;" loading="lazy"></td>
            <td style="width:18%; padding:8px 6px;">給付日期</td>
            <td style="padding:8px 6px;">${payDate}</td>
          </tr>
        </table>
        <div style="display:flex; gap:10px; margin-top:14px;">
          <button class="btn ghost" id="sigRedo" style="flex:1;">重簽</button>
          <button class="btn amber" id="sigSend" style="flex:2;">確認送出</button>
        </div>
        <button class="btn ghost" id="sigAbort" style="width:100%; margin-top:8px;">取消</button>
      </div>
    </div>`;
  const end = ()=>{ document.body.style.overflow = prevOverflow; host.innerHTML = ''; };
  document.getElementById('sigRedo').onclick = ()=>{ end(); openSignatureModal(record); };
  document.getElementById('sigAbort').onclick = end;
  document.getElementById('sigSend').onclick = async ()=>{
    const btn = document.getElementById('sigSend'); btn.disabled = true;
    try{ await signStatement(record.id, sigUrl); end(); renderContent(); }
    catch(err){ alert(err.message); btn.disabled = false; }
  };
}
function renderMyStatement(c){
  const dId = state.activeDriverId;
  const now = new Date(); let prevY=now.getFullYear(), prevM=now.getMonth();
  if(prevM===0){ prevM=12; prevY--; }
  const defaultMonth = `${prevY}-${pad(prevM)}`;
  const monthStr = state._myStatementMonth || defaultMonth;
  // 區間勞報單（主控依實際付款期間開的）：每一份獨立列出，點開簽名；月結勞報單照舊用月份選。
  const periodStmts = state.data.statements.filter(s=>s.driverId===dId && s.periodStart)
    .sort((a,b)=> b.periodEnd.localeCompare(a.periodEnd));
  const waiting = periodStmts.filter(s=>s.status==='awaiting_signature').length;
  c.innerHTML = `
    <h2 class="section-title">對帳單 / 勞報單</h2>
    <div class="panel no-print" style="position:sticky; top:0; z-index:20; box-shadow:0 2px 6px rgba(27,33,41,.12);"><div class="field" style="max-width:200px; margin-bottom:0;"><label>月份（月結勞報單）</label><input id="smMonth" type="month" value="${monthStr}"></div></div>
    ${periodStmts.length ? `<div class="panel">
      <h3 style="margin:0 0 6px;">每次付款的勞報單${waiting?`　<span class="badge progress">${waiting} 份待簽名</span>`:''}</h3>
      <table><thead><tr><th>期間</th><th>給付日期</th><th>實領金額</th><th>狀態</th><th></th></tr></thead>
      <tbody>${periodStmts.map(x=>`<tr><td>${statementLabel(x)}</td><td>${x.payDate||'—'}</td><td class="amount">$${money(x.actualNet)}</td><td>${x.status==='awaiting_signature'?'<span class="badge progress">待簽名</span>':x.status==='signed'?'<span class="badge signed">已簽（未鎖定）</span>':'<span class="badge signed">已鎖定</span>'}</td><td><button class="btn ${x.status==='awaiting_signature'?'amber':'ghost'}" data-openstmt="${x.id}">查看</button></td></tr>`).join('')}</tbody></table>
    </div>` : ''}
    <div id="statementBox"></div>`;
  let currentPeriodId = state._myStatementPeriodId || null;
  async function refresh(){
    const m = document.getElementById('smMonth').value;
    state._myStatementMonth = m;
    const periodRecord = currentPeriodId ? state.data.statements.find(s=>s.id===currentPeriodId && s.driverId===dId) : null;
    const record = periodRecord || state.data.statements.find(s=>s.driverId===dId && !s.periodStart && s.month===m);
    const box = document.getElementById('statementBox');

    if(!record){
      box.innerHTML = `<div class="panel"><div class="empty">${m} 尚未由主控端完成月結確認，結算完成後才能在這裡看到並回簽勞報單。</div></div>`;
      return;
    }
    const driver = state.data.drivers.find(d=>d.id===dId);
    const label = statementLabel(record);
    // 勞報單上的「共完成N趟」要以整個期間為準：state.data.assignments 預設只載入最近14天，
    // 所以跟報酬結算、我的報酬一樣，直接跟資料庫要這段期間的任務。
    box.innerHTML = '<div class="empty">載入中...</div>';
    let monthAssignments;
    const [rangeStart, rangeEnd] = statementRange(record);
    try{
      monthAssignments = await fetchAssignmentsInRange(rangeStart, rangeEnd);
      await ensureAdjustmentsRange(rangeStart); await ensureFuelClaimsRange(rangeStart);
    }
    catch(err){ box.innerHTML = `<div class="panel"><div class="empty">載入失敗：${err.message}</div></div>`; return; }
    if(document.getElementById('smMonth')?.value!==m) return; // 使用者可能已經改選別的月份
    if((state._myStatementPeriodId||null)!==currentPeriodId) return;
    const { slipHtml, attHtml } = buildSlipHtmls(driver, record, monthAssignments);
    const fileTag = `${driverName(dId)}_${label}_勞報單`;
    const backBtn = periodRecord ? `<div class="no-print" style="margin-bottom:8px;"><button class="btn ghost" id="backMonthly">← 回月結勞報單</button></div>` : '';
    const wireBack = ()=>{ const b=document.getElementById('backMonthly'); if(b) b.onclick=()=>{ currentPeriodId=null; state._myStatementPeriodId=null; refresh(); }; };
    if(record.status==='awaiting_signature'){
      box.innerHTML = `
        ${backBtn}
        <div id="payrollSlipArea">${slipHtml}${attHtml}</div>
        <div class="panel no-print">
          <button class="btn amber" id="ackPayBtn" style="width:100%;">已確認報酬並簽名</button>
        </div>
        <div id="sigModalHost"></div>`;
      wireBack();
      document.getElementById('ackPayBtn').onclick = ()=> openSignatureModal(record);
    } else if(record.status==='signed'){
      // 簽了名但還沒按「確認簽名」鎖定前，夥伴可以隨時重新簽名改掉。
      box.innerHTML = `
        ${backBtn}
        <div id="payrollSlipArea">${slipHtml}${attHtml}</div>
        <div class="note">請確認簽名清楚無誤。按下方「確認簽名」後就會鎖定，不能再修改（如果需要修改，要請主控端退回才能重簽）。</div>
        <div class="no-print" style="margin-top:10px; display:flex; gap:8px; flex-wrap:wrap;">
          <button class="btn ghost" id="printMy">列印/另存PDF</button>
          <button class="btn ghost" id="resignBtn">重新簽名</button>
          <button class="btn amber" id="confirmSignBtn">確認簽名（鎖定，不可再改）</button>
        </div>
        <div id="sigModalHost"></div>`;
      wireBack();
      document.getElementById('printMy').onclick = ()=> exportPayrollPortraitPdf([slipHtml, attHtml].filter(Boolean), fileTag);
      document.getElementById('resignBtn').onclick = ()=> openSignatureModal(record);
      document.getElementById('confirmSignBtn').onclick = async ()=>{
        if(!confirm('確認簽名後就不能再修改，需要主控退回才能重簽，確定要鎖定嗎？')) return;
        try{ await confirmSignature(record.id); renderContent(); }
        catch(err){ alert(err.message); }
      };
    } else if(record.status==='confirmed'){
      // 已鎖定，只能列印，不能再重新簽名。
      box.innerHTML = `
        ${backBtn}
        <div id="payrollSlipArea">${slipHtml}${attHtml}</div>
        <div class="no-print" style="margin-top:10px;">
          <button class="btn ghost" id="printMy">列印/另存PDF</button>
        </div>`;
      wireBack();
      document.getElementById('printMy').onclick = ()=> exportPayrollPortraitPdf([slipHtml, attHtml].filter(Boolean), fileTag);
    }
  }
  c.querySelectorAll('[data-openstmt]').forEach(btn=>{
    btn.onclick = ()=>{ currentPeriodId = btn.dataset.openstmt; state._myStatementPeriodId = currentPeriodId; refresh(); window.scrollTo({top:0}); };
  });
  document.getElementById('smMonth').onchange = ()=>{ currentPeriodId=null; state._myStatementPeriodId=null; refresh(); };
  refresh();
}

  if(state.role==='driver' && !state.adminViewDriver) maybeShowNhiReminder();

  if(state.role==='admin') (window.requestIdleCallback || (f=>setTimeout(f, 2500)))(()=>{ loadPdfLibs().catch(()=>{}); });
}
// renderLoginGate() 的正式版實作在 js/auth.js（呼叫 /api/auth-driver、/api/auth-admin，
// 不再直接比對 state.data 裡的明文PIN/代碼；此時 state.data 根本還沒載入）。
document.getElementById('logoutBtn').onclick = ()=>{
  if(state.adminViewDriver){
    state.adminViewDriver = null; state.activeDriverId = null; state.tab = 'home';
    updateHeaderBar(); updateTitle(); renderNav(); renderContent();
    return;
  }
  stopRealtimeSync();
  clearAuth(); state.role=null; state.activeDriverId=null; state.tab=null;
  renderLoginGate();
};

// cleanupOldPhotos()（每次開系統時把超過30天的照片從記憶體裡清掉）已經沒有對應實作。
// 正式版的照片存在 Supabase Storage，「清除30天前照片」需要一支獨立的排程工作
// （例如 Supabase pg_cron + Edge Function，定期找出 assignment_drop_points 裡
// completed_at 超過30天且 photo_cleared=false 的資料列，刪除 Storage 物件後
// 把 photo_url 設回 null、photo_cleared 設成 true）。這個排程job還沒有建立，
// 是目前已知、故意先擱置的缺口，上線前請評估是否要先做這個，或先接受
// 舊照片會持續留在 Storage 裡（多花一點儲存空間，但不影響功能正確性）。

// 「加入主畫面」的網頁App在不少手機上會被系統背景凍結、放很久都沒有
// 真正重新載入過（不是瀏覽器分頁那種無痕快取問題，是整個JS執行環境
// 一直沒有重啟），導致上線的新功能、跟即時性的資料（今日尚未完成
// 等）長時間卡住不動、看起來「無法同步」。這裡用兩個機制補救：
// 1. 切回前景/每隔幾分鐘，比對目前執行中的頁面內容跟伺服器上最新的
//    是否不同，不同就跳出一條提示，讓使用者自己決定要不要點擊重新
//    整理（不強制自動reload，避免打斷正在填寫的表單）。
// 2. 切回前景時，如果人在「首頁」（這個分頁沒有任何表單欄位，不會有
//    填到一半被清掉的風險），就悄悄重新抓一次資料並重繪，讓「今日
//    尚未配送完成」這類即時面板自動跟上最新狀態；其他分頁刻意不自動
//    重繪，使用者切換分頁時自然就會拿到最新資料。
let __bootPageSignature = null;
// 判斷「現在這份頁面」跟「伺服器上最新的」是不是同一份：改用 HEAD 請求比對 ETag，
// 不用像以前那樣每次都把整份 index.html（600KB+）抓下來才能算雜湊——每 5 分鐘、
// 每次切回分頁都要做這個檢查，開著不關的手機／戰情室螢幕累積起來流量很可觀，
// 改成 HEAD 之後這個檢查幾乎不耗流量。極少數環境可能拿不到 ETag（例如被中間的代理
// 伺服器濾掉），退回舊的整頁比對方式，不影響「有新版時提醒重新整理」這個功能本身。
async function computePageSignature(){
  try{
    const res = await fetch(location.pathname || '/', { method:'HEAD', cache:'no-store' });
    if(!res.ok) return null;
    const etag = res.headers.get('etag');
    if(etag) return etag;
    const res2 = await fetch(location.pathname || '/', { cache: 'no-store' });
    if(!res2.ok) return null;
    const text = await res2.text();
    let hash = 0;
    for(let i=0;i<text.length;i++){ hash = (hash*31 + text.charCodeAt(i)) | 0; }
    return hash;
  }catch(e){ return null; }
}
function showUpdateBanner(){
  if(document.getElementById('updateBanner')) return;
  const bar = document.createElement('div');
  bar.id = 'updateBanner';
  bar.style.cssText = 'position:fixed; top:0; left:0; right:0; background:var(--amber); color:#fff; padding:10px 14px; text-align:center; font-size:13px; z-index:99999; cursor:pointer; box-shadow:0 2px 6px rgba(0,0,0,.2);';
  bar.textContent = '📢 系統已推出新版本，點此重新整理套用最新功能 ↻';
  bar.onclick = ()=> location.reload();
  document.body.appendChild(bar);
}
async function checkForUpdate(){
  const sig = await computePageSignature();
  if(sig===null) return;
  if(__bootPageSignature===null){ __bootPageSignature = sig; return; }
  if(sig !== __bootPageSignature) showUpdateBanner();
}
// 首頁即時更新主要靠 Realtime 推播（見 startRealtimeSync，任務/店點一有
// 異動，debounce一下就會呼叫這支函式刷新），不用再每25秒硬去問一次資料庫。
// 這裡的定時輪詢改成保險用的備援（例如WebSocket連線中途斷掉、或Realtime
// 訂閱失敗退回純輪詢的情況），間隔放寬到3分鐘即可，平常都是Realtime先
// 觸發。分頁切到背景時暫停，不做沒人看的無意義請求；另外記錄「上次更新
// 時間」讓畫面上看得到資料新鮮度，面板也保留手動「重新整理」按鈕。
let lastHomeRefreshAt = null;
// ---------- 即時同步 ----------
// 資料庫一有異動（任務、店點、勞報單簽名、調整項、代墊申報），Realtime 就推播過來：
// 只抓「有變的那幾筆」合併進記憶體，然後讓「目前這一頁」立刻跟著更新（不再只有首頁會更新）。
// 使用者正在輸入、或開著明細／簽名視窗時，不硬重畫（以免打到一半的字被洗掉），改成稍後安全時再更新。
const LIVE_TABS = {
  assignments: ['home','schedule','today','history','my-earnings','warroom'],
  statements: ['home','slips','my-statement'],
  adjustments: ['home','payroll','my-earnings'],
  fuel_claims: ['home','payroll','my-earnings']
};
let liveQ = { assignments:new Set(), assignmentsDel:new Set(), statements:new Set(), statementsDel:new Set(), adjustments:new Set(), adjustmentsDel:new Set(), fuel_claims:new Set(), fuel_claimsDel:new Set() };
let liveTimer = null, livePendingTabs = null;
function handleLiveEvent(ev){
  if(ev.table==='war_room_marks'){ wrApplyMarkEvent(ev); return; }
  const id = ev.new.id || ev.old.id;
  const del = ev.eventType==='DELETE';
  if(ev.table==='assignment_drop_points'){
    const aid = ev.new.assignment_id;
    if(aid) liveQ.assignments.add(aid);
  } else if(liveQ[ev.table]){
    if(del && id) liveQ[ev.table+'Del'].add(id); else if(id) liveQ[ev.table].add(id);
  }
  clearTimeout(liveTimer);
  liveTimer = setTimeout(flushLive, 350);
}
async function flushLive(){
  const q = liveQ;
  liveQ = { assignments:new Set(), assignmentsDel:new Set(), statements:new Set(), statementsDel:new Set(), adjustments:new Set(), adjustmentsDel:new Set(), fuel_claims:new Set(), fuel_claimsDel:new Set() };
  if(!state.data) return;
  const touched = new Set();
  const upsert = (arr, item)=>{ const i = arr.findIndex(x=>x.id===item.id); if(i>=0) arr[i]=item; else arr.push(item); };
  try{
    const supabase = getSupabase();
    // 任務（含店點明細與照片連結）：一筆一筆抓，抓不到（刪除、或已不在權限範圍，例如被取消發佈）就從記憶體移除。
    await Promise.all([...q.assignments].map(async id=>{
      try{ const a = await fetchAssignment(id); upsert(state.data.assignments, a); }
      catch(e){ if(/0 rows|no rows/i.test(e.message)) state.data.assignments = state.data.assignments.filter(x=>x.id!==id); else throw e; }
    }));
    if(q.assignments.size) state.data.assignments.sort((a,b)=>a.date.localeCompare(b.date));
    if(q.assignmentsDel.size){ state.data.assignments = state.data.assignments.filter(x=>!q.assignmentsDel.has(x.id)); }
    if(state.role==='driver' && !state.adminViewDriver && q.assignments.size) await syncSupportStops();
    if(q.assignments.size || q.assignmentsDel.size) touched.add('assignments');
    if(q.statements.size){
      const { data } = await supabase.from('statements').select('*').in('id', [...q.statements]);
      const rows = (data||[]).map(mapStatement);
      await resolveSignatureUrls(rows);
      rows.forEach(r=> upsert(state.data.statements, r));
      touched.add('statements');
    }
    if(q.statementsDel.size){ state.data.statements = state.data.statements.filter(x=>!q.statementsDel.has(x.id)); touched.add('statements'); }
    if(q.adjustments.size){
      const { data } = await supabase.from('adjustments').select('*').in('id', [...q.adjustments]);
      (data||[]).map(mapAdjustment).forEach(r=> upsert(state.data.adjustments, r));
      touched.add('adjustments');
    }
    if(q.adjustmentsDel.size){ state.data.adjustments = state.data.adjustments.filter(x=>!q.adjustmentsDel.has(x.id)); touched.add('adjustments'); }
    if(q.fuel_claims.size){
      const { data } = await supabase.from('fuel_claims').select('*').in('id', [...q.fuel_claims]);
      state.data.fuelClaims = state.data.fuelClaims || [];
      (data||[]).map(mapFuelClaim).forEach(r=> upsert(state.data.fuelClaims, r));
      touched.add('fuel_claims');
    }
    if(q.fuel_claimsDel.size){ state.data.fuelClaims = (state.data.fuelClaims||[]).filter(x=>!q.fuel_claimsDel.has(x.id)); touched.add('fuel_claims'); }
  }catch(e){ console.error('即時同步失敗，改用備援刷新', e); refreshHomeDataIfIdle(); return; }
  if(!touched.size) return;
  lastHomeRefreshAt = new Date();
  const need = [...touched].some(t=> (LIVE_TABS[t]||[]).includes(state.tab));
  if(!need) return;
  tryLiveRender();
}
// 使用者正在輸入、或開著會被重畫洗掉的視窗／明細時，不重畫，稍後再試。
function liveRenderBlocked(){
  if(document.hidden) return true;
  const ae = document.activeElement;
  if(ae && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)) return true;
  if(document.querySelector('.modal-backdrop, .sig-full')) return true;
  if(document.querySelector('.assign-detail-row')) return true;
  if(state._bulk && state._bulk.on && state._bulk.sel.size) return true; // 批量選取到一半不要被即時更新洗掉
  const sheet = document.getElementById('assignDetail'); if(sheet && sheet.innerHTML.trim()) return true;
  const weekModal = document.getElementById('weekTripModal'); if(weekModal && weekModal.innerHTML.trim()) return true;
  return false;
}
function tryLiveRender(){
  if(state._wrExternal) return; // 外部連結不連資料庫，資料靠自己定時輪詢
  if(liveRenderBlocked()){ livePendingTabs = true; return; }
  livePendingTabs = null;
  try{ renderNav(); renderContent(); }catch(e){ console.error('即時更新畫面失敗', e); }
}
setInterval(()=>{ if(livePendingTabs && !liveRenderBlocked()) tryLiveRender(); }, 2500);
// 過了午夜 12 點：畫面開著沒關的話，自動換成新的一天（完成畫面、今日任務、今日總覽都重新算）。
(function scheduleMidnightRefresh(){
  const now = new Date(), next = new Date(now); next.setHours(24, 0, 5, 0);
  setTimeout(()=>{ try{ if(state.data) tryLiveRender(); }catch(e){} scheduleMidnightRefresh(); }, next - now);
  // 手機把網頁放背景、計時器被暫停的情況：回到前景時如果日期已經變了，也立刻換成新的一天
  let day = todayStr();
  document.addEventListener('visibilitychange', ()=>{ if(!document.hidden && todayStr()!==day){ day = todayStr(); try{ if(state.data) tryLiveRender(); }catch(e){} } });
})();

async function refreshHomeDataIfIdle(){
  if(state._wrExternal) return;
  if(state.data && state.tab==='warroom' && !document.hidden){ wrBackupRefresh(); return; }
  if(!state.data || state.tab!=='home' || document.hidden) return;
  try{
    // 只重抓首頁真的需要跟上即時狀態的任務資料，不呼叫整支 loadAllData()——
    // 夥伴/通路/路線這些目錄資料幾乎不會變動，100人同時在線時每25秒讓每個人
    // 都重抓一次是不必要的資料庫負擔（見 refreshAssignmentsRange 說明）。
    // 主控要看到「本月至今」的即時利潤，夥伴首頁只需要「今天」的行程數字。
    const today = todayStr();
    if(state.role==='admin'){ await refreshAssignmentsRange(today.slice(0,7)+'-01', today); await refreshFuelClaims(); }
    else { await refreshAssignmentsRange(today, today); await syncSupportStops(); }
    // 夥伴首頁的「同任務起點今日出發狀況」是另外呼叫loadDepotOverview()
    // 查的（夥伴身份是走RPC，不在loadAllData()裡），有自己的一層快取
    // （depotOverviewCache），這裡一起清掉，讓renderContent()重新渲染時
    // 順便重新抓一次，不然這個面板不會跟著這裡的25秒一起變新。
    depotOverviewCache = { key:null, rows:null };
    lastHomeRefreshAt = new Date();
    renderNav();
    renderContent();
  }catch(e){ console.error('背景重新整理資料失敗', e); }
}
// iOS Safari 要有 touchstart 監聽，:active（按下去的視覺回饋）才會在手機上即時生效。
document.addEventListener('touchstart', ()=>{}, { passive:true });
document.addEventListener('visibilitychange', ()=>{
  if(!document.hidden){ checkForUpdate(); refreshHomeDataIfIdle(); }
});
window.addEventListener('focus', ()=>{ checkForUpdate(); refreshHomeDataIfIdle(); });
// 手機把分頁丟到背景一陣子後，WebSocket 可能已經休眠、錯過中間的推播：回到前景時（離開超過 30 秒）
// 主動補抓一次目前會看到的任務範圍，補完再更新畫面。
let hiddenAtTs = null;
document.addEventListener('visibilitychange', ()=>{
  if(document.hidden){ hiddenAtTs = Date.now(); return; }
  if(hiddenAtTs && Date.now()-hiddenAtTs > 30000){ hiddenAtTs = null; catchUpAfterResume(); }
});
async function catchUpAfterResume(){
  if(!state.data || !state.role || state._wrExternal) return;
  try{
    const today = todayStr();
    if(state.role==='admin'){ await refreshAssignmentsRange(getWeekDates(0)[0], getWeekDates(1)[6]); await refreshFuelClaims(); }
    else { await refreshAssignmentsRange(today, ymd(addDays(today, 14))); await syncSupportStops(); }
    tryLiveRender();
  }catch(e){ console.error('回到前景補抓資料失敗', e); }
}
setInterval(checkForUpdate, 5*60*1000);
setInterval(refreshHomeDataIfIdle, 180*1000);

async function bootApp(){
  const auth = getStoredAuth();
  if(!auth){ renderLoginGate(); return; }
  state.role = auth.role;
  if(auth.role==='driver') state.activeDriverId = auth.driver.id;
  try{
    state.data = await loadAllData();
  }catch(e){
    // 登入憑證過期（主控12小時、夥伴30天）是正常的工作流程，不是系統壞掉，
    // 跳出一堆技術性錯誤訊息（JWT expired之類）只會讓人誤以為系統出問題。
    // 只有這個情況顯示單純的「請重新登入」；其他真的意料之外的錯誤（網路、
    // 伺服器異常等）還是把完整錯誤訊息顯示出來，方便回報問題時能看出到底
    // 是哪裡壞了。
    const isExpired = /jwt expired/i.test(e.message || '');
    alert(isExpired ? '登入已過期，請重新登入。' : ('讀取資料失敗，請重新登入：' + e.message));
    clearAuth(); renderLoginGate();
    return;
  }
  if(auth.role==='driver'){
    const me = state.data.drivers.find(d=>d.id===auth.driver.id);
    if(!me || me.status!=='active'){ clearAuth(); renderLoginGate('此帳號已停用，請聯絡主控。'); return; }
    if(me.forceCodeReset){ renderForceCodeResetGate(me.id, me.name); return; }
    await syncSupportStops();   // 臨時交給我支援的店點（沒有就是空的）
  }
  showApp();
}

function hideBootSplash(){ const el = document.getElementById('bootSplash'); if(el) el.remove(); }
// defer 的 4 支外部 script（supabase SDK／supabase-client.js／data-layer.js／auth.js／push.js）
// 保證會在 DOMContentLoaded 之前就全部執行完畢；這支 inline script 本身不是 defer（defer 對
// 沒有 src 的 inline script 沒有效果），所以用這個事件確保真正呼叫 bootApp() 之前，auth.js 的
// getStoredAuth 這些函式都已經就緒，不會出現「用到還沒載入的函式」的錯誤。
function whenDomReady(fn){
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', fn, { once:true });
  else fn();
}
whenDomReady(async function init(){
  try{
    const wrPath = location.pathname.match(/^\/wr\/([A-Za-z0-9_-]{16,128})\/?$/);
    const wrTok = (wrPath && wrPath[1]) || new URLSearchParams(location.search).get('wr');
    if(wrTok){ await bootWarRoomExternal(wrTok); return; }
    computePageSignature().then(sig=>{ if(__bootPageSignature===null) __bootPageSignature = sig; });
    await bootApp();
  } finally { hideBootSplash(); } // 不管成功、失敗（例如 bootApp 內部真的意料之外出錯），開機畫面一定要拿掉，不能卡住變成另一種「看起來像當機」
});
</script>

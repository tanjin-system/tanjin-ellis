// 簽名畫布記錄下來的圖片形狀，跟簽名當下手機實際橫拿還是直拿有關（尤其
// iOS Safari 在簽名視窗開著時轉方向，畫布尺寸不一定會正確跟著重算），存進
// 勞報單「所得人簽章」欄位時，欄位是固定高度、盡量佔滿寬度顯示——如果存的
// 圖片是「直的」（窄高），欄位就只能把它壓成一條極窄的直線，看起來像轉了
// 90度或整個消失。這裡在送出前統一處理：先掃描找出真正有畫到墨水的範圍
// （裁掉四周空白，讓簽名盡量佔滿欄位），裁完如果還是「高度大於寬度」就整張
// 轉90度──保證不管簽名當下手機怎麼拿，存起來的圖一定是橫式、能撐滿欄位。
function normalizeSignatureDataUrl(canvas){
  const ctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  let minX=w, minY=h, maxX=0, maxY=0, found=false;
  const data = ctx.getImageData(0,0,w,h).data;
  const step = 2; // 抽樣掃描加快速度，簽名筆畫夠粗不會因此漏掉範圍
  for(let y=0; y<h; y+=step){
    for(let x=0; x<w; x+=step){
      if(data[(y*w+x)*4+3] > 10){
        found = true;
        if(x<minX) minX=x; if(x>maxX) maxX=x;
        if(y<minY) minY=y; if(y>maxY) maxY=y;
      }
    }
  }
  if(!found) return canvas.toDataURL('image/png');
  const pad = 20;
  minX = Math.max(0, minX-pad); minY = Math.max(0, minY-pad);
  maxX = Math.min(w, maxX+pad); maxY = Math.min(h, maxY+pad);
  const cropW = maxX-minX, cropH = maxY-minY;
  const landscape = cropW >= cropH;
  const out = document.createElement('canvas');
  out.width = landscape ? cropW : cropH;
  out.height = landscape ? cropH : cropW;
  const octx = out.getContext('2d');
  octx.fillStyle = '#fff'; octx.fillRect(0,0,out.width,out.height);
  if(landscape){
    octx.drawImage(canvas, minX, minY, cropW, cropH, 0, 0, cropW, cropH);
  } else {
    octx.translate(out.width, 0);
    octx.rotate(Math.PI/2);
    octx.drawImage(canvas, minX, minY, cropW, cropH, 0, 0, cropW, cropH);
  }
  return out.toDataURL('image/png');
}
// 全畫面簽名視窗：點「已確認報酬」才跳出來簽，簽完按☑️送出、按❌取消不送出。
// 簽名框固定顯示成橫式（見下方 applyBoxSize()），不依賴偵測手機當下是橫放
// 還是直放——先前試過「跟著裝置方向調整」跟「CSS強制轉90度模擬橫向」兩種
// 做法，都會在部分手機瀏覽器上出狀況（尤其簽名視窗開著時轉方向，畫布不一
// 定會正確跟著重算尺寸），改成固定寬高比的框最可靠。
function openSignatureModal(record){
  const host = document.getElementById('sigModalHost');
  host.innerHTML = `
    <div class="sig-modal-backdrop" id="sigBackdrop">
      <div id="sigInner" style="display:flex; flex-direction:column; align-items:stretch;">
        <div class="sig-modal-canvas-wrap">
          <div class="sig-watermark">請簽名</div>
          <canvas id="sigPad"></canvas>
        </div>
        <div class="sig-modal-actions">
          <div class="sig-side"><button class="sig-clear-link" id="sigClear">清除重簽</button></div>
          <div class="sig-side">
            <button class="sig-icon-btn cancel" id="sigCancel" title="取消">❌</button>
            <button class="sig-icon-btn confirm" id="sigConfirm" title="確認送出">☑️</button>
          </div>
        </div>
      </div>
    </div>`;
  const canvas = document.getElementById('sigPad');
  const wrapEl = canvas.parentElement;
  const innerEl = document.getElementById('sigInner');
  const ctx = canvas.getContext('2d');
  // 簽名框「不論手機當下橫拿還是直拿，一律強制顯示成寬扁的橫式方框」——
  // 不依賴偵測裝置目前是橫向還是直向（部分手機瀏覽器在簽名視窗開著時轉
  // 方向，畫布尺寸並不會正確跟著重算，靠偵測方向來決定畫布形狀並不可靠）。
  // 固定寬高比（寬是高的1.8倍），依畫面剩餘空間算出能放的最大尺寸，這樣
  // 使用者永遠是對著一個橫式的框簽名，簽出來的筆畫天生就是橫式。
  const ASPECT = 1.8;
  function applyBoxSize(){
    const vw = window.innerWidth, vh = window.innerHeight;
    const actionsH = 70, gap = 16, sidePad = 24;
    const maxW = vw - sidePad*2;
    const maxH = vh - actionsH - gap - sidePad*2;
    let w = maxW, h = w/ASPECT;
    if(h > maxH){ h = maxH; w = h*ASPECT; }
    innerEl.style.width = w+'px';
    wrapEl.style.width = w+'px';
    wrapEl.style.height = h+'px';
  }
  function resizeCanvas(){
    applyBoxSize();
    const rect = wrapEl.getBoundingClientRect();
    const prev = canvas.width ? canvas.toDataURL('image/png') : null;
    canvas.width = rect.width * 2; canvas.height = rect.height * 2;
    ctx.lineWidth = 5; ctx.lineCap = 'round'; ctx.strokeStyle = '#1B2129';
    if(prev){ const img = new Image(); img.onload = ()=> ctx.drawImage(img,0,0,canvas.width,canvas.height); img.src = prev; }
  }
  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);
  window.addEventListener('orientationchange', resizeCanvas);
  let drawing = false, hasSignature = false;
  function pos(e){
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width/rect.width, scaleY = canvas.height/rect.height;
    return { x:(e.clientX-rect.left)*scaleX, y:(e.clientY-rect.top)*scaleY };
  }
  canvas.addEventListener('pointerdown', e=>{ drawing=true; hasSignature=true; const p=pos(e); ctx.beginPath(); ctx.moveTo(p.x,p.y); });
  canvas.addEventListener('pointermove', e=>{ if(!drawing) return; const p=pos(e); ctx.lineTo(p.x,p.y); ctx.stroke(); });
  window.addEventListener('pointerup', ()=>{ drawing=false; });
  document.getElementById('sigClear').onclick = ()=>{ ctx.clearRect(0,0,canvas.width,canvas.height); hasSignature=false; };
  document.getElementById('sigCancel').onclick = ()=>{ window.removeEventListener('resize', resizeCanvas); window.removeEventListener('orientationchange', resizeCanvas); host.innerHTML=''; };
  document.getElementById('sigConfirm').onclick = async ()=>{
    if(!hasSignature){ alert('請先簽名再送出'); return; }
    try{
      await signStatement(record.id, normalizeSignatureDataUrl(canvas));
      window.removeEventListener('resize', resizeCanvas); window.removeEventListener('orientationchange', resizeCanvas);
      host.innerHTML='';
      renderContent();
    }catch(err){ alert(err.message); }
  };
}
function renderMyStatement(c){
  const dId = state.activeDriverId;
  const now = new Date(); let prevY=now.getFullYear(), prevM=now.getMonth();
  if(prevM===0){ prevM=12; prevY--; }
  const defaultMonth = `${prevY}-${pad(prevM)}`;
  const monthStr = state._myStatementMonth || defaultMonth;
  c.innerHTML = `
    <h2 class="section-title">對帳單 / 勞報單</h2>
    <div class="panel"><div class="field" style="max-width:200px;"><label>月份</label><input id="smMonth" type="month" value="${monthStr}"></div></div>
    <div id="statementBox"></div>`;
  function refresh(){
    const m = document.getElementById('smMonth').value;
    state._myStatementMonth = m;
    const record = state.data.statements.find(s=>s.driverId===dId && s.month===m);
    const box = document.getElementById('statementBox');

    if(!record){
      box.innerHTML = `<div class="panel"><div class="empty">${m} 尚未由主控端完成月結確認，結算完成後才能在這裡看到並回簽勞報單。</div></div>`;
      return;
    }
    const driver = state.data.drivers.find(d=>d.id===dId);
    const r = driverMonthly(dId, m);
    const merged = { ...r, tripTotal:record.tripTotal, adjTotal:record.adjTotal, net:record.net };
    const ded = { incomeType:record.incomeType, withholdTax:record.withholdTax, taxRate:record.taxRate, taxAmount:record.taxAmount, withholdNhi:record.withholdNhi, nhiRate:record.nhiRate, nhiAmount:record.nhiAmount, actualNet:record.actualNet };
    const slipHtml = payrollSlipHtml(driver, m, merged, ded, {
      signatureDataUrl: (record.status==='signed'||record.status==='confirmed') ? record.signatureDataUrl : null
    });
    if(record.status==='awaiting_signature'){
      box.innerHTML = `
        <div id="payrollSlipArea">${slipHtml}</div>
        <div class="panel no-print">
          <button class="btn amber" id="ackPayBtn" style="width:100%;">已確認報酬並簽名</button>
        </div>
        <div id="sigModalHost"></div>`;
      document.getElementById('ackPayBtn').onclick = ()=> openSignatureModal(record);
    } else if(record.status==='signed'){
      // 簽了名但還沒按「確認簽名」鎖定前，司機可以隨時重新簽名改掉。
      box.innerHTML = `
        <div id="payrollSlipArea">${slipHtml}</div>
        <div class="note">請確認簽名清楚無誤。按下方「確認簽名」後就會鎖定，不能再修改（如果需要修改，要請主控端退回才能重簽）。</div>
        <div class="no-print" style="margin-top:10px; display:flex; gap:8px; flex-wrap:wrap;">
          <button class="btn ghost" id="printMy">列印/另存PDF</button>
          <button class="btn ghost" id="resignBtn">重新簽名</button>
          <button class="btn amber" id="confirmSignBtn">確認簽名（鎖定，不可再改）</button>
        </div>
        <div id="sigModalHost"></div>`;
      document.getElementById('printMy').onclick = ()=> exportPayrollPortraitPdf([slipHtml], `${driverName(dId)}_${m}_勞報單`);
      document.getElementById('resignBtn').onclick = ()=> openSignatureModal(record);
      document.getElementById('confirmSignBtn').onclick = async ()=>{
        if(!confirm('確認簽名後就不能再修改，需要主控退回才能重簽，確定要鎖定嗎？')) return;
        try{ await confirmSignature(record.id); refresh(); }
        catch(err){ alert(err.message); }
      };
    } else if(record.status==='confirmed'){
      // 已鎖定，只能列印，不能再重新簽名。
      box.innerHTML = `
        <div id="payrollSlipArea">${slipHtml}</div>
        <div class="no-print" style="margin-top:10px;">
          <button class="btn ghost" id="printMy">列印/另存PDF</button>
        </div>`;
      document.getElementById('printMy').onclick = ()=> exportPayrollPortraitPdf([slipHtml], `${driverName(dId)}_${m}_勞報單`);
    }
  }
  document.getElementById('smMonth').onchange = refresh;
  refresh();
}

// 原本的 loadSession/saveSession/clearSession（只記「我剛剛通過代碼檢查」，
// 沒有真正的驗證）與 renderLoginGate（直接比對 state.data 裡的明文PIN/代碼）
// 已經整個由 js/auth.js 取代：改成呼叫 Vercel Serverless Function 驗證、拿到簽過名的

function updateTitle(){

function updateHeaderBar(){

// renderLoginGate() 的正式版實作在 js/auth.js（呼叫 /api/auth-driver、/api/auth-admin，
// 不再直接比對 state.data 裡的明文PIN/代碼；此時 state.data 根本還沒載入）。
document.getElementById('logoutBtn').onclick = ()=>{

    state.adminViewDriver = null; state.activeDriverId = null; state.tab = 'home';
    updateHeaderBar(); updateTitle(); renderNav(); renderContent();

  clearAuth(); state.role=null; state.activeDriverId=null; state.tab=null;

};

// cleanupOldPhotos()（每次開系統時把超過30天的照片從記憶體裡清掉）已經沒有對應實作。
// 正式版的照片存在 Supabase Storage，「清除30天前照片」需要一支獨立的排程工作
// （例如 Supabase pg_cron + Edge Function，定期找出 assignment_drop_points 裡
// completed_at 超過30天且 photo_cleared=false 的資料列，刪除 Storage 物件後
// 把 photo_url 設回 null、photo_cleared 設成 true）。這個排程job還沒有建立，
// 是目前已知、故意先擱置的缺口，上線前請評估是否要先做這個，或先接受
// 舊照片會持續留在 Storage 裡（多花一點儲存空間，但不影響功能正確性）。

// 「加入主畫面」的網頁App在不少手機上會被系統背景凍結、放很久都沒有
// 真正重新載入過（不是瀏覽器分頁那種無痕快取問題，是整個JS執行環境
// 一直沒有重啟），導致上線的新功能、跟即時性的資料（今日尚未配送完成、
// 最新動態等）長時間卡住不動、看起來「無法同步」。這裡用兩個機制補救：
// 1. 切回前景/每隔幾分鐘，比對目前執行中的頁面內容跟伺服器上最新的
//    是否不同，不同就跳出一條提示，讓使用者自己決定要不要點擊重新
//    整理（不強制自動reload，避免打斷正在填寫的表單）。
// 2. 切回前景時，如果人在「首頁」（這個分頁沒有任何表單欄位，不會有
//    填到一半被清掉的風險），就悄悄重新抓一次資料並重繪，讓「今日
//    尚未配送完成」「最新動態」這類即時面板自動跟上最新狀態；其他
//    分頁刻意不自動重繪，使用者切換分頁時自然就會拿到最新資料。
let __bootPageSignature = null;
async function computePageSignature(){
  try{
    const res = await fetch(location.pathname || '/', { cache: 'no-store' });
    if(!res.ok) return null;
    const text = await res.text();
    let hash = 0;
    for(let i=0;i<text.length;i++){ hash = (hash*31 + text.charCodeAt(i)) | 0; }
    return hash;
  }catch(e){ return null; }
}
function showUpdateBanner(){
  if(document.getElementById('updateBanner')) return;
  const bar = document.createElement('div');
  bar.id = 'updateBanner';
  bar.style.cssText = 'position:fixed; top:0; left:0; right:0; background:var(--amber); color:#fff; padding:10px 14px; text-align:center; font-size:13px; z-index:99999; cursor:pointer; box-shadow:0 2px 6px rgba(0,0,0,.2);';
  bar.textContent = '📢 系統已推出新版本，點此重新整理套用最新功能 ↻';
  bar.onclick = ()=> location.reload();
  document.body.appendChild(bar);
}
async function checkForUpdate(){
  const sig = await computePageSignature();
  if(sig===null) return;
  if(__bootPageSignature===null){ __bootPageSignature = sig; return; }
  if(sig !== __bootPageSignature) showUpdateBanner();
}
async function refreshHomeDataIfIdle(){
  if(!state.data || state.tab!=='home') return;
  try{
    state.data = await loadAllData();
    renderNav();
    renderContent();
  }catch(e){ console.error('背景重新整理資料失敗', e); }
}
document.addEventListener('visibilitychange', ()=>{
  if(!document.hidden){ checkForUpdate(); refreshHomeDataIfIdle(); }
});
window.addEventListener('focus', ()=>{ checkForUpdate(); refreshHomeDataIfIdle(); });
setInterval(checkForUpdate, 5*60*1000);
setInterval(refreshHomeDataIfIdle, 3*60*1000);

async function bootApp(){
  const auth = getStoredAuth();
  if(!auth){ renderLoginGate(); return; }
  state.role = auth.role;
  if(auth.role==='driver') state.activeDriverId = auth.driver.id;
  try{
    state.data = await loadAllData();
  }catch(e){
    alert('讀取資料失敗，請重新登入：' + e.message);
    clearAuth(); renderLoginGate();
    return;
  }
  if(auth.role==='driver'){
    const me = state.data.drivers.find(d=>d.id===auth.driver.id);
    if(!me || me.status!=='active'){ clearAuth(); renderLoginGate('此帳號已停用，請聯絡主控。'); return; }
    if(me.forceCodeReset){ renderForceCodeResetGate(me.id, me.name); return; }
  }
  showApp();
}

(async function init(){
  computePageSignature().then(sig=>{ if(__bootPageSignature===null) __bootPageSignature = sig; });
  await bootApp();
})();

<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>碳金車隊調度系統</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+TC:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap');
  :root{
    --navy:#1B2A41; --navy-dim:#2A3B54; --amber:#E0902E; --teal:#3F6E6C;
    --paper:#F5F5F2; --panel:#FFFFFF; --border:#D9DCE1; --ink:#1B2129; --ink-soft:#5B6472;
    --danger:#B5493A; --radius:3px;
  }
  *{box-sizing:border-box;}
  body{ margin:0; background:var(--paper); color:var(--ink); font-family:'IBM Plex Sans TC',-apple-system,sans-serif; font-size:14px; line-height:1.55; }
  .mono{ font-family:'IBM Plex Mono',monospace; }
  header{ background:var(--navy); color:#fff; padding:14px 20px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; }
  header h1{ font-size:17px; font-weight:600; margin:0; }
  header h1 span{ color:var(--amber); font-family:'IBM Plex Mono'; }
  .role-switch{ display:flex; gap:6px; align-items:center; font-size:13px; }
  .role-switch select{ background:var(--navy-dim); color:#fff; border:1px solid #445067; border-radius:var(--radius); padding:6px 8px; font-family:inherit; font-size:13px; }
  .layout{ display:flex; min-height:calc(100vh - 54px); }
  nav.tabs{ width:150px; background:#fff; border-right:1px solid var(--border); padding:14px 0; flex-shrink:0; }
  nav.tabs button{ display:block; width:100%; text-align:left; padding:9px 16px; background:none; border:none; border-left:3px solid transparent; cursor:pointer; font-family:inherit; font-size:13px; color:var(--ink-soft); }
  nav.tabs button.active{ border-left-color:var(--amber); color:var(--ink); font-weight:600; background:#FAF7F1; }
  main{ flex:1; padding:20px; max-width:1000px; }
  h2.section-title{ font-size:16px; font-weight:600; margin:0 0 4px; }
  p.section-sub{ color:var(--ink-soft); font-size:12.5px; margin:0 0 16px; }
  .panel{ background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); padding:16px; margin-bottom:16px; }
  table{ width:100%; border-collapse:collapse; font-size:13px; }
  th,td{ padding:7px 9px; border-bottom:1px solid var(--border); text-align:left; vertical-align:top; }
  th{ color:var(--ink-soft); font-weight:600; font-size:11.5px; }
  tr:last-child td{ border-bottom:none; }
  input,select,textarea{ width:100%; padding:7px 9px; border:1px solid var(--border); border-radius:var(--radius); font-family:inherit; font-size:13px; background:#fff; color:var(--ink); }
  label{ display:block; font-size:12px; color:var(--ink-soft); margin-bottom:3px; }
  .field{ margin-bottom:10px; }
  .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .grid3{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; }
  .grid4{ display:grid; grid-template-columns:1fr 1fr 1fr 1fr; gap:10px; }
  @media (max-width:640px){ .grid2,.grid3,.grid4{ grid-template-columns:1fr; } .layout{flex-direction:column;} nav.tabs{width:100%; display:flex; overflow-x:auto; padding:6px;} nav.tabs button{border-left:none; border-bottom:3px solid transparent; white-space:nowrap;} nav.tabs button.active{border-bottom-color:var(--amber);} }
  button.btn{ background:var(--navy); color:#fff; border:none; padding:8px 14px; border-radius:var(--radius); cursor:pointer; font-family:inherit; font-size:13px; font-weight:500; }
  button.btn.amber{ background:var(--amber); color:#1B2129; }
  button.btn.ghost{ background:none; border:1px solid var(--border); color:var(--ink); }
  button.btn.danger{ background:none; border:1px solid var(--danger); color:var(--danger); }
  button.btn:hover{ opacity:.88; }
  button.btn[disabled]{ opacity:.4; cursor:not-allowed; }
  .badge{ display:inline-block; padding:2px 8px; border-radius:20px; font-size:11px; font-weight:600; }
  .badge.pending{ background:#F2E4D0; color:#8A5A17; }
  .badge.completed{ background:#DCEBE0; color:#2C6B44; }
  .badge.signed{ background:#DCEBE0; color:#2C6B44; }
  .badge.locked{ background:#E7E9EC; color:var(--ink-soft); }
  .badge.progress{ background:#DCE7F2; color:#2C5F8A; }
  .amount{ font-family:'IBM Plex Mono'; font-weight:600; }
  .drop-point{ border:1px dashed var(--border); border-radius:var(--radius); padding:9px; margin-top:7px; font-size:12.5px; }
  .drop-point img{ max-width:70px; border-radius:2px; margin-top:6px; }
  .week-nav{ display:flex; align-items:center; gap:10px; margin-bottom:14px; }
  .schedule-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:8px; overflow-x:auto; }
  .day-card{ background:#FAF9F7; border:1px solid var(--border); border-radius:var(--radius); padding:8px; min-height:110px; }
  .day-card .day-label{ font-size:11.5px; color:var(--ink-soft); margin-bottom:6px; font-weight:600; }
  .trip-chip{ background:#fff; border:1px solid var(--border); border-left:3px solid var(--teal); border-radius:2px; padding:5px 7px; margin-bottom:5px; font-size:11px; cursor:pointer; }
  .trip-chip.locked{ border-left-color:#9AA3AF; opacity:.75; }
  .empty{ color:var(--ink-soft); font-size:12.5px; padding:20px; text-align:center; border:1px dashed var(--border); border-radius:var(--radius); }
  a.link{ color:var(--teal); text-decoration:none; font-weight:600; font-size:12.5px; }
  .toolbar{ display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; margin-bottom:12px; }
  .note{ font-size:12px; color:var(--ink-soft); background:#FAF7F1; border:1px solid var(--border); border-radius:var(--radius); padding:10px 12px; margin-bottom:14px; }
  .tag-list span{ display:inline-block; background:#EFEEE9; border-radius:2px; padding:2px 6px; margin:2px 3px 0 0; font-size:11.5px; }
  .modal-backdrop{ position:fixed; inset:0; background:rgba(27,33,41,.55); display:flex; align-items:flex-start; justify-content:center; padding:30px 16px; z-index:100; overflow-y:auto; }
  .modal-box{ background:var(--panel); border-radius:var(--radius); max-width:960px; width:100%; padding:20px; max-height:calc(100vh - 60px); overflow-y:auto; }
  .modal-box .toolbar{ margin-bottom:10px; }
  .sig-modal-backdrop{ position:fixed; inset:0; background:#15181D; z-index:300; display:flex; flex-direction:column; }
  .sig-modal-backdrop.sig-force-landscape{ inset:auto; top:50%; left:50%; width:100vh; height:100vw; transform:translate(-50%,-50%) rotate(90deg); transform-origin:center center; }
  .sig-modal-canvas-wrap{ flex:1; position:relative; background:#fff; margin:16px; border-radius:8px; overflow:hidden; min-height:0; }
  .sig-modal-canvas-wrap canvas{ width:100%; height:100%; touch-action:none; display:block; }
  .sig-watermark{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:13vw; color:rgba(0,0,0,.06); font-weight:700; pointer-events:none; letter-spacing:2vw; white-space:nowrap; }
  .sig-modal-actions{ display:flex; justify-content:space-between; align-items:center; padding:10px 20px 20px; flex-shrink:0; }
  .sig-modal-actions .sig-side{ display:flex; gap:10px; align-items:center; }
  .sig-icon-btn{ font-size:30px; background:none; border:none; cursor:pointer; padding:8px 16px; border-radius:10px; line-height:1; }
  .sig-icon-btn.confirm{ background:#2C6B44; }
  .sig-icon-btn.cancel{ background:#B5493A; }
  .form-tabs{ display:flex; gap:14px; margin-bottom:14px; border-bottom:1px solid var(--border); }
  .form-tab-btn{ background:none; border:none; padding:8px 2px; font-size:13px; font-weight:600; color:var(--ink-soft); cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-1px; }
  .form-tab-btn.active{ color:var(--ink); border-bottom-color:var(--amber); }
  .driver-card{ border:1px solid var(--border); border-radius:var(--radius); padding:14px; margin-bottom:10px; background:var(--panel); }
  .driver-card-head{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; flex-wrap:wrap; }
  .driver-card-name{ font-weight:600; font-size:14.5px; }
  .driver-card-sub{ font-size:12px; color:var(--ink-soft); margin-top:4px; line-height:1.7; }
  .driver-card-actions{ display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; border-top:1px solid var(--border); padding-top:10px; }
  .sig-clear-link{ color:#fff; font-size:13px; background:rgba(255,255,255,.15); border:none; border-radius:6px; padding:8px 14px; cursor:pointer; }
  .version-block{ border:1px solid var(--border); border-radius:var(--radius); padding:10px; margin-bottom:8px; }
  .version-block.open{ border-color:var(--amber); }
  .tile-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px; }
  .tile{ background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); padding:22px 14px; text-align:center; cursor:pointer; font-weight:600; font-size:13.5px; transition:border-color .15s; }
  .tile:hover{ border-color:var(--amber); }
  .tile .tile-sub{ display:block; font-weight:400; font-size:11.5px; color:var(--ink-soft); margin-top:5px; }
  table.route-grid{ table-layout:auto; }
  table.route-grid th, table.route-grid td{ text-align:center; padding:7px 10px; font-size:13px; border:1px solid #B9BEC6; white-space:nowrap; min-width:52px; }
  table.route-grid td.grid-cell{ font-weight:700; font-size:13.5px; }
  table.route-grid th.weekend, table.route-grid td.weekend-head{ color:var(--amber); }
  table.route-grid td.grid-black{ background:#15181D; }
  table.route-grid td.grid-cell{ cursor:pointer; background:#fff; }
  table.route-grid td.grid-cell:hover{ background:#FAF2E3; }
  table.route-grid td.row-label{ background:#E7E9EC; font-weight:600; text-align:left; padding-left:8px; }
  .origin-title{ background:#EFEEE9; font-weight:600; padding:8px 10px; margin:14px 0 6px; border-radius:var(--radius); }
  table.overview-grid th, table.overview-grid td{ text-align:center; padding:10px 12px; font-size:15px; border:1px solid #B9BEC6; white-space:nowrap; }
  table.overview-grid td.grid-cell{ font-weight:700; font-size:16px; }
  table.overview-grid th.weekend{ color:var(--amber); }
  table.overview-grid td.grid-black{ background:#15181D; }
  table.overview-grid td.row-label{ background:#E7E9EC; font-weight:700; text-align:left; padding-left:10px; font-size:14px; }
  @media print{ nav.tabs,header,.no-print{ display:none !important; } main{ max-width:100%; padding:0; } body{ background:#fff; } }
</style>

<body>
<header>
  <h1 id="appTitle">碳金車隊調度系統</h1>
  <div class="role-switch">
    <span id="whoAmI" style="font-size:12.5px;"></span>
    <button class="btn ghost" id="logoutBtn" style="display:none; padding:5px 10px; font-size:12px;">登出／切換身份</button>
  </div>
</header>
<div id="loginGate" class="panel" style="max-width:360px; margin:40px auto;"></div>
<div class="layout" id="appLayout" style="display:none;">
  <nav class="tabs" id="tabsNav"></nav>
  <main id="content"></main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/data-layer.js"></script>
<script src="js/auth.js"></script>
<script>
let state = { role:'admin', activeDriverId:null, tab:null, weekOffset:0, data:null };

function uid(p){ return p+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function todayStr(){ return ymd(new Date()); }
function money(n){ return (Number(n)||0).toLocaleString('zh-Hant-TW'); }
function pad(n){ return String(n).padStart(2,'0'); }
function ymd(d){ return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function addDays(dateStr, days){ const d=new Date(dateStr+'T00:00:00'); d.setDate(d.getDate()+days); return d; }
// 安全性修補：司機端可自由輸入的文字（目前是 issueNote 異常備註）在塞進 innerHTML 前
// 一定要先跳脫，否則司機可以在備註裡放 <img onerror=...> 之類的內容，主控端打開該筆
// 車趟時就會在主控瀏覽器執行，偷走主控的登入token（有全庫存取權）。
function escapeHtml(s){
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ---------- 通用查找 ----------
function driverName(id){ const d=state.data.drivers.find(x=>x.id===id); return d?d.name:'未指派'; }
function driverVehicle(id){ const d=state.data.drivers.find(x=>x.id===id); return d && d.vehicle ? d.vehicle.plate : '—'; }
function channelName(id){ const c=state.data.channels.find(x=>x.id===id); return c?c.name:'—'; }
function routeName(id){ const r=state.data.routes.find(x=>x.id===id); return r?r.name:'—'; }
function mapLink(addr){ return 'https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(addr); }
function lineShareLink(text){ return 'https://line.me/R/msg/text/?'+encodeURIComponent(text); }
// pushNotification()（純記憶體 unshift）已由 js/data-layer.js 的 createNotification()
// 取代——正式版通知要讓其他人（主控／司機）在別的裝置上也看得到，必須真的寫進資料庫，
// 不能只是塞進當下這個瀏覽器分頁的記憶體陣列。
function compressImageFile(file, maxDim=1000, quality=0.6){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        let width = img.width, height = img.height;
        if(width > height){ if(width > maxDim){ height = Math.round(height*maxDim/width); width = maxDim; } }
        else { if(height > maxDim){ width = Math.round(width*maxDim/height); height = maxDim; } }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        try{ resolve(canvas.toDataURL('image/jpeg', quality)); }
        catch(e){ reject(e); }
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
// 直接產生真正的PDF檔案（不再是HTML檔案要求使用者自己用瀏覽器列印另存），
// 用 html2pdf.js（內部是 html2canvas 把畫面截成圖＋jsPDF 排版成PDF）。
// PDF 實際做好是非同步的（要等畫面渲染成圖片），很多瀏覽器（尤其手機版）會擋掉
// 「非同步觸發的檔案下載」或根本沒反應，所以改成：點擊當下先同步開一個空白分頁
// （這個動作跟使用者點擊是同一時間，不會被瀏覽器當成不明來源的彈出視窗擋掉），
// PDF做好後把內容放進那個分頁，用瀏覽器內建的PDF檢視器開啟，使用者自己用瀏覽器
// 的分享／下載功能存檔即可，比強制觸發下載在各平台上都穩定。
function exportPrintable(title, bodyHtml){
  const previewWin = window.open('', '_blank');
  if(previewWin){
    previewWin.document.write('<title>PDF 產生中...</title><body style="font-family:-apple-system,sans-serif;padding:60px;text-align:center;color:#666;">PDF 產生中，請稍候…</body>');
  }
  // 注意：wrap 不能用 position:fixed/absolute——實測html2canvas對這個函式庫版本
  // 的離版面定位元素會量到高度0，截出全空白PDF。維持一般文件流（直接接在body
  // 最後面），但給明確寬度，避免受周圍版面影響；html2canvas是用getBoundingClientRect
  // 抓元素位置，不受目前捲動位置影響，所以就算頁面很長也不會截錯。
  const wrap = document.createElement('div');
  wrap.style.cssText = 'width:1050px; font-family:-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif; padding:16px; color:#1B2129; background:#fff;';
  wrap.innerHTML = `
    <style>
      @page { size: A4 landscape; margin: 10mm; }
      table{ width:100%; border-collapse:collapse; font-size:13px; margin-top:10px; }
      th,td{ padding:7px 9px; border:1px solid #999; text-align:left; }
      h1,h3{ margin:0 0 10px; }
      .amount{ font-family:monospace; font-weight:700; }
      /* 防斷頁：表格列、面板區塊、標題都不允許被硬切成兩半 */
      table, tr, thead, tbody, .panel, .version-block, .date-group{ break-inside: avoid; page-break-inside: avoid; }
      h1, h2, h3, h4{ break-after: avoid; page-break-after: avoid; }
    </style>
    <h1>${title}</h1>
    ${bodyHtml}
  `;
  document.body.appendChild(wrap);
  const filename = title.replace(/[\\/:*?"<>|]/g,'_') + '.pdf';
  html2pdf().set({
    margin: 10,
    filename,
    html2canvas: { scale: 2, useCORS: true },
    jsPDF: { unit: 'mm', format: 'a4', orientation: 'landscape' }
  }).from(wrap).outputPdf('blob').then(blob=>{
    document.body.removeChild(wrap);
    const url = URL.createObjectURL(blob);
    if(previewWin && !previewWin.closed){
      previewWin.location.href = url;
    } else {
      const a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
    }
    setTimeout(()=> URL.revokeObjectURL(url), 60000);
  }).catch(err=>{
    document.body.removeChild(wrap);
    if(previewWin && !previewWin.closed) previewWin.close();
    alert('產生PDF失敗：' + err.message);
  });
}
function exportPanelPrint(panelEl, title){
  if(!panelEl){ alert('找不到可列印的內容'); return; }
  const clone = panelEl.cloneNode(true);
  clone.querySelectorAll('.no-print').forEach(el=>el.remove());
  exportPrintable(title, clone.innerHTML);
}

// 請款單上不需要標註星期幾（例如同一車次因為停靠站不同分成「星期一」跟
// 「週二到週五」兩條路線，對客戶來說都叫同一個車次名稱）。這裡只是把
// 路線名稱最後面的「（...）」拿掉做顯示用，不影響實際金額計算。
function stripWeekdayLabel(name){
  return (name||'').replace(/[（(][^）)]*[）)]/g, '').replace(/\s+/g, ' ').trim();
}
function getActiveVersion(route, dateStr){
  return (route.versions||[]).find(v=> dateStr>=v.start && (!v.end || dateStr<=v.end));
}
// saveRouteVersion()/recomputeRouteVersionEnds() 的實作已搬到 js/data-layer.js
// （原本是純記憶體物件操作，現在要寫回 Supabase，簽名也改成
// saveRouteVersion(routeId, newStart, dropPointIds) 並回傳 Promise）。

function tripBilling(dropPoints, distanceKm, channelsList){
  const channels = channelsList || (state.data && state.data.channels) || [];
  const points = dropPoints||[];
  const countByChannel = {};
  points.forEach(p=>{ countByChannel[p.channelId] = (countByChannel[p.channelId]||0) + 1; });
  const byChannel = {};
  let totalAmount = 0;

  // 共配拆分：所有「依里程+下貨點數」公式的通路，共用同一套里程/點數費率，
  // 先算出整趟共同總額，再依各通路下貨點數比例分攤（同一車趟共配多個通路時使用）。
  const pooledIds = Object.keys(countByChannel).filter(chId=>{
    const ch = channels.find(c=>c.id===chId);
    return ch && ch.formulaType !== 'flat_per_trip';
  });
  const poolPoints = pooledIds.reduce((s,chId)=> s+countByChannel[chId], 0);
  if(poolPoints > 0){
    const rateChannel = channels.find(c=>c.id===pooledIds[0]);
    const rateKm = rateChannel ? Number(rateChannel.rateKm)||0 : 35;
    const ratePoint = rateChannel ? Number(rateChannel.ratePoint)||0 : 50;
    const poolTotal = Math.round((Number(distanceKm)||0)*rateKm + poolPoints*ratePoint);
    const base = Math.floor(poolTotal/poolPoints);
    const remainder = poolTotal - base*poolPoints;
    let seen = 0;
    pooledIds.forEach(chId=>{
      const cnt = countByChannel[chId];
      let amt = base*cnt;
      for(let i=0;i<cnt;i++){ if(seen<remainder) amt+=1; seen++; }
      byChannel[chId] = amt;
      totalAmount += amt;
    });
  }

  // 整趟固定金額的通路（例如牧穀）不參與共配分攤，各自獨立計算
  Object.keys(countByChannel).forEach(chId=>{
    const ch = channels.find(c=>c.id===chId);
    if(ch && ch.formulaType==='flat_per_trip'){
      const amt = Math.round(Number(ch.flatAmount)||0);
      byChannel[chId] = amt;
      totalAmount += amt;
    }
  });

  return {totalAmount, totalPoints: points.length, byChannel};
}
function defaultPeriod(channel, monthStr){
  const [y,m] = monthStr.split('-').map(Number);
  if(channel.periodType==='calendar_month'){
    return { start:`${y}-${pad(m)}-01`, end: ymd(new Date(y,m,0)) };
  } else if(channel.periodType==='custom'){
    let py=y, pm=m-1; if(pm===0){pm=12; py=y-1;}
    return { start:`${py}-${pad(pm)}-${pad(channel.startDay)}`, end:`${y}-${pad(m)}-${pad(channel.endDay)}` };
  }
  return { start:`${y}-${pad(m)}-01`, end: ymd(new Date(y,m,0)) };
}
// 同一個出發點／車次／班次如果因為停靠站不同拆成好幾條路線（例如「第八車
// （週二到週五）」是給司機跑的實際版本，「第八車(星期一)」是對客戶報價的
// 版本），這裡把它們視為同一家族：找出家族裡標「星期一／週一」的那條路線。
function findRouteFamily(route){
  const baseSeq = stripWeekdayLabel(route.seq);
  return state.data.routes.filter(r=> r.originAddr===route.originAddr && r.shift===route.shift && stripWeekdayLabel(r.seq)===baseSeq);
}
function findMondayQuoteRoute(route){
  return findRouteFamily(route).find(r=> /星期一|週一/.test(r.seq)) || null;
}
// 對客戶的請款金額：如果這趟車的路線有一個「星期一」報價版本，不管實際是哪一天、
// 用哪個版本跑的，請款一律套用星期一版本「當天生效」的拆賬金額（司機薪資
// 不受影響，司機費用永遠是自己那趟車實際的 a.fare，只有客戶請款這裡套用）。
function effectiveByChannelForAssignment(a){
  let byChannel = (a.billingSnapshot && a.billingSnapshot.byChannel) || tripBilling(a.dropPoints, a.distanceKm).byChannel;
  const route = state.data.routes.find(r=>r.id===a.routeId);
  if(route){
    const mondayRoute = findMondayQuoteRoute(route);
    if(mondayRoute && mondayRoute.id!==route.id){
      const mv = getActiveVersion(mondayRoute, a.date) || [...(mondayRoute.versions||[])].sort((x,y)=>x.start.localeCompare(y.start)).pop();
      if(mv && mv.billingByChannel && Object.keys(mv.billingByChannel).length) byChannel = mv.billingByChannel;
    }
  }
  return byChannel;
}
function channelBillingTotal(channelId, start, end){
  let total=0; const contributing=[];
  state.data.assignments.forEach(a=>{
    if(a.status==='completed' && a.date>=start && a.date<=end){
      const byChannel = effectiveByChannelForAssignment(a);
      if(byChannel[channelId]){ total+=byChannel[channelId]; contributing.push({a, amount:byChannel[channelId]}); }
    }
  });
  return {total, contributing};
}
// 哪些路線曾經送過這個通路（不限日期區間，用來找版本異動日期切區間，
// 以及列出這個通路底下有哪些供應商／出發點）。
function routesForChannel(channelId){
  return state.data.routes.filter(r=> (r.versions||[]).some(v=>
    (v.dropPointIds||[]).some(id=>{
      const dp = state.data.dropPoints.find(x=>x.id===id);
      return dp && dp.channelId === channelId;
    })
  ));
}
// 請款區間如果剛好橫跨路線版本異動的日期，自動切成好幾段小區間（對應
// 舊人工Excel「0727-0731」「0803-0809」這種分段方式），不用手動輸入。
function splitPeriodByVersionChanges(channelId, start, end){
  const routes = routesForChannel(channelId);
  const boundarySet = new Set([start]);
  routes.forEach(r=>{
    (r.versions||[]).forEach(v=>{ if(v.start > start && v.start <= end) boundarySet.add(v.start); });
  });
  const boundaries = Array.from(boundarySet).sort();
  return boundaries.map((segStart,i)=>{
    let segEnd = end;
    if(i+1 < boundaries.length){
      const d = new Date(boundaries[i+1]+'T00:00:00'); d.setDate(d.getDate()-1);
      segEnd = ymd(d);
    }
    return { start: segStart, end: segEnd };
  });
}
// 通路請款總額依「供應商（出發點）」拆開顯示（對應舊Excel「各區費用總覽」）。
function channelOriginBreakdown(channelId, start, end){
  const { contributing } = channelBillingTotal(channelId, start, end);
  const byOrigin = {};
  contributing.forEach(x=>{
    const route = state.data.routes.find(r=>r.id===x.a.routeId);
    const addr = route ? route.originAddr : '';
    if(!byOrigin[addr]) byOrigin[addr] = { originAddr: addr, tripCount:0, storeCount:0, amount:0 };
    byOrigin[addr].tripCount += 1;
    byOrigin[addr].storeCount += (x.a.dropPoints||[]).filter(dp=>dp.channelId===channelId).length;
    byOrigin[addr].amount += x.amount;
  });
  return Object.values(byOrigin).sort((a,b)=> b.amount - a.amount);
}
// 未稅/含稅：依通路自己設定的稅別反推（未稅通路加5%營業稅、含稅通路反算內含稅額）。
function untaxWithTax(amount, taxInclusive){
  let untaxed, withTax;
  if(taxInclusive){ withTax = Math.round(amount); untaxed = Math.round(amount/1.05); }
  else { untaxed = Math.round(amount); withTax = Math.round(amount*1.05); }
  return { untaxed, withTax, tax: withTax-untaxed };
}
function driverMonthly(driverId, monthStr){
  const trips = state.data.assignments.filter(a=> a.driverId===driverId && a.date.startsWith(monthStr) && a.status==='completed');
  const tripTotal = trips.reduce((s,a)=> s+(Number(a.payrollFareSnapshot ?? a.fare)||0), 0);
  const adjustments = state.data.adjustments.filter(a=> a.driverId===driverId && a.month===monthStr);
  const adjTotal = adjustments.reduce((s,a)=> s+(a.type==='add'?Number(a.amount):-Math.abs(Number(a.amount))), 0);
  return { trips, tripTotal, adjustments, adjTotal, net: tripTotal+adjTotal };
}
function computeProfitSnapshot(){
  const monthStr = todayStr().slice(0,7);
  const today = todayStr();
  const perChannel = state.data.channels.filter(ch=>ch.status!=='inactive').map(ch=>{
    const period = defaultPeriod(ch, monthStr);
    const end = period.end > today ? today : period.end;
    const { total } = channelBillingTotal(ch.id, period.start, end);
    return { channel: ch, total, period: { start: period.start, end } };
  });
  const revenueTotal = perChannel.reduce((s,x)=>s+x.total, 0);
  let expenseTotal = 0;
  state.data.drivers.forEach(d=>{
    const r = driverMonthly(d.id, monthStr);
    expenseTotal += r.net;
  });
  return { perChannel, revenueTotal, expenseTotal, profit: revenueTotal-expenseTotal, monthStr };
}
function getWeekDates(offset){
  const now=new Date(); const day=now.getDay(); const mondayDelta = day===0?-6:1-day;
  const monday=new Date(now); monday.setDate(now.getDate()+mondayDelta+offset*7);
  const dates=[]; for(let i=0;i<7;i++){ const d=new Date(monday); d.setDate(monday.getDate()+i); dates.push(ymd(d)); }
  return dates;
}

function renderDpListBody(){
  const wrap = document.getElementById('dpListBody');
  const keyword = (document.getElementById('dpSearch').value||'').trim().toLowerCase();
  const chOpts = state.data.channels.filter(ch=>ch.status!=='inactive').map(ch=>`<option value="${ch.id}">${ch.name}</option>`).join('');
  wrap.innerHTML = state.data.channels.map(ch=>{
    let rows = state.data.dropPoints.filter(dp=>dp.channelId===ch.id);
    if(keyword){ rows = rows.filter(dp=> dp.address.toLowerCase().includes(keyword) || (dp.code||'').toLowerCase().includes(keyword)); }
    if(keyword && !rows.length) return '';
    const collapsed = dpCollapsedChannels.has(ch.id) && !keyword;
    return `<div class="panel">
      <h3 data-dptoggle="${ch.id}" style="margin-top:0; cursor:pointer; display:flex; justify-content:space-between; align-items:center;">
        <span>${ch.name}（${rows.length}）</span><span style="color:var(--ink-soft); font-size:12px;">${collapsed?'展開 ▸':'收合 ▾'}</span>
      </h3>
      <div style="${collapsed?'display:none;':''}">
      <table>
        <thead><tr><th>代號</th><th>地址</th><th>狀態</th><th></th></tr></thead>
        <tbody>
          ${rows.map(dp=>{
            if(editingDpId === dp.id){
              return `<tr><td colspan="4">
                <div class="grid3">
                  <div class="field"><label>地址</label><input id="edpAddr" value="${dp.address}"></div>
                  <div class="field"><label>所屬通路</label><select id="edpChannel">${chOpts.replace(`value="${dp.channelId}"`, `value="${dp.channelId}" selected`)}</select></div>
                  <div class="field"><label>代號</label><input id="edpCode" value="${dp.code||''}"></div>
                </div>
                <button class="btn amber" data-savedp="${dp.id}">儲存</button>
                <button class="btn ghost" data-canceldp="${dp.id}">取消</button>
              </td></tr>`;
            }
            return `<tr><td class="mono">${dp.code||'—'}</td><td>${dp.address}</td><td><span class="badge ${dp.status==='inactive'?'pending':'completed'}">${dp.status==='inactive'?'已停用':'使用中'}</span></td>
            <td><button class="btn ghost" data-editdp="${dp.id}">編輯</button> ${dp.status!=='inactive'?`<button class="btn danger" data-del="${dp.id}">刪除</button>`:''}</td></tr>`;
          }).join('') || `<tr><td colspan="4"><div class="empty">此通路尚無下貨點</div></td></tr>`}
        </tbody>
      </table>
      </div>
    </div>`;
  }).join('');
  wrap.querySelectorAll('[data-dptoggle]').forEach(h=>{
    h.onclick = ()=>{
      const id = h.dataset.dptoggle;
      if(dpCollapsedChannels.has(id)) dpCollapsedChannels.delete(id); else dpCollapsedChannels.add(id);
      renderDpListBody();
    };
  });
  wrap.querySelectorAll('[data-editdp]').forEach(btn=>{ btn.onclick = ()=>{ editingDpId = btn.dataset.editdp; renderDpListBody(); }; });
  wrap.querySelectorAll('[data-canceldp]').forEach(btn=>{ btn.onclick = ()=>{ editingDpId = null; renderDpListBody(); }; });
  wrap.querySelectorAll('[data-savedp]').forEach(btn=>{
    btn.onclick = async ()=>{
      const dp = state.data.dropPoints.find(x=>x.id===btn.dataset.savedp);
      const newAddr = document.getElementById('edpAddr').value.trim() || dp.address;
      try{
        await updateDropPoint(dp.id, { address: newAddr, channelId: document.getElementById('edpChannel').value, code: document.getElementById('edpCode').value.trim() });
        editingDpId = null;
        renderContent();
      }catch(err){ alert(err.message); }
    };
  });
  wrap.querySelectorAll('[data-del]').forEach(btn=>{
    btn.onclick = async ()=>{
      try{
        const result = await deleteOrDeactivateDropPoint(btn.dataset.del);
        if(result==='deactivated') alert('這個下貨點已被路線版本或歷史車趟使用，無法直接刪除，已改為「已停用」，新路線將不會再顯示它。');
        renderContent();
      }catch(err){ alert(err.message); }
    };
  });
}

let routeListSearch = '';
function ensureDraft(route){
  if(!routeDraft[route.id]){
    const open = (route.versions||[]).find(v=>!v.end);
    routeDraft[route.id] = {
      order: open ? [...open.dropPointIds] : [], dpSearch: '',
      distanceKm: open?.distanceKm ?? '', driverFare: open?.driverFare ?? '', billingTotal: open?.billingTotal ?? '',
      billingByChannel: open?.billingByChannel ? {...open.billingByChannel} : null,
      splitManuallyEdited: false

}

const WEEKDAY_ZH = ['一','二','三','四','五','六','日'];
// 車次排序用：從「第X車...」抓出中文數字X換算成阿拉伯數字，抓不到的排到最後面
// （維持原本相對順序，不會亂跳）。支援到「第十九車」，車隊規模通常用不到更多。
function seqSortKey(seq){
  const m = /^第([一二三四五六七八九十]+)車/.exec((seq||'').trim());
  if(!m) return 9999;
  const digit = { 一:1,二:2,三:3,四:4,五:5,六:6,七:7,八:8,九:9 };
  const s = m[1];
  if(s === '十') return 10;
  if(s.length === 1) return digit[s] || 9999;
  if(s[0] === '十') return 10 + (digit[s[1]] || 0);
  if(s[1] === '十') return (digit[s[0]] || 0) * 10 + (s[2] ? (digit[s[2]] || 0) : 0);
  return 9999;
}

    let cursor = start;
    try{
      while(cursor <= end){
        const jsWeekday = new Date(cursor+'T00:00:00').getDay();
        const isoWeekday = jsWeekday===0 ? 6 : jsWeekday-1;
        if(weekdays.includes(isoWeekday)){
          const already = state.data.assignments.some(a=>a.date===cursor && a.routeId===routeId);
          if(already){ skippedExisting++; }
          else if(hasDriverConflict(driverId, cursor, route.shift)){ skippedConflict++; }
          else {
            const version = getActiveVersion(route, cursor);
            if(!version){ skippedNoVersion++; }
            else {
              await createAssignment({ date:cursor, routeId, driverId });
              created++;
            }
          }
        }
        cursor = ymd(addDays(cursor,1));
      }
    }catch(err){ alert(err.message); }
    alert(`已建立 ${created} 筆車趟。${skippedNoVersion? `\n${skippedNoVersion} 天因路線當日無生效版本而略過。`:''}${skippedExisting? `\n${skippedExisting} 天該車次已有指派而略過。`:''}${skippedConflict? `\n${skippedConflict} 天因司機當天已有相同班次而略過。`:''}`);
    renderContent();
  };
  renderWeekGrid('gridWeek1', week1);
}
function renderWeekGrid(containerId, dates){
  const wrap = document.getElementById(containerId);
  const originFilterVal = document.getElementById('originFilter').value;
  const origins = originFilterVal ? state.data.origins.filter(og=>og.address===originFilterVal) : state.data.origins;

  function cellHtml(route, date){
    if(!route) return `<td class="grid-black"></td>`;
    const a = state.data.assignments.find(x=>x.routeId===route.id && x.date===date);
    if(!a) return `<td class="grid-cell" data-quickcreate="${route.id}|${date}">　</td>`;
    const issue = a.hasIssue ? ' ⚠️' : '';
    const tag = a.status==='completed' ? ' 🔒' : a.status==='in_progress' ? ' ▶' : '';
    const feeLine = (a.fare || a.distanceKm) ? `<br><span style="font-weight:400; font-size:10.5px; color:var(--ink-soft);">$${money(a.fare)}・${a.distanceKm||0}km</span>` : '';
    return `<td class="grid-cell" data-viewassign="${a.id}">${driverName(a.driverId)}${tag}${issue}${feeLine}</td>`;
  }
  function headerHtml(){
    const dateRow = dates.map(d=>{
      const wd = new Date(d+'T00:00:00').getDay();
      const isWeekend = wd===0||wd===6;
      return `<th colspan="2" class="${isWeekend?'weekend':''}">${d.slice(5)}（星期${WEEKDAY_ZH[wd===0?6:wd-1]}）</th>`;
    }).join('');
    const shiftRow = dates.map(d=>{
      const wd = new Date(d+'T00:00:00').getDay();
      const isWeekend = wd===0||wd===6;
      return `<th class="${isWeekend?'weekend':''}">上午</th><th class="${isWeekend?'weekend':''}">下午</th>`;
    }).join('');
    return `<thead><tr><th></th>${dateRow}</tr><tr><th>車次</th>${shiftRow}</tr></thead>`;
  }
  const blocks = origins.map(og=>{
    const routesHere = state.data.routes.filter(r=>r.originAddr===og.address);
    if(!routesHere.length) return '';
    const seqs = [...new Set(routesHere.map(r=>r.seq))].sort((a,b)=>seqSortKey(a)-seqSortKey(b));
    const rows = seqs.map(seq=>{
      const amRoute = routesHere.find(r=>r.seq===seq && r.shift==='AM');
      const pmRoute = routesHere.find(r=>r.seq===seq && r.shift==='PM');
      const cells = dates.map(d=> cellHtml(amRoute,d) + cellHtml(pmRoute,d)).join('');
      return `<tr><td class="row-label">${seq}</td>${cells}</tr>`;
    }).join('');
    return `<div class="origin-title">${og.label||og.address}</div>
      <div class="panel" style="overflow-x:auto; padding:8px;">
        <table class="route-grid">${headerHtml()}<tbody>${rows}</tbody></table>
      </div>`;
  }).join('');
  wrap.innerHTML = blocks || '<div class="empty">此出發點尚無路線，請先到「路線管理」建立</div>';
  wrap.querySelectorAll('[data-viewassign]').forEach(td=>{ td.onclick = ()=> renderAssignmentDetail(td.dataset.viewassign); });
  wrap.querySelectorAll('[data-quickcreate]').forEach(td=>{
    td.onclick = ()=>{
      const [routeId, date] = td.dataset.quickcreate.split('|');
      renderQuickCreate(routeId, date);
    };
  });
}

function hasDriverConflict(driverId, date, shift, excludeId=null){

    a.id!==excludeId && a.driverId===driverId && a.date===date && a.status!=='cancelled' &&
    (state.data.routes.find(r=>r.id===a.routeId)||{}).shift === shift

}

// ---------- 請款結算 ----------
// 依「通路」（例如7-11、康達盛通）結算一整份請款單：先依路線版本異動日期自動切成
// 好幾段小區間，各區間內再依供應商（出發點）拆開顯示，最後附上每一趟車的明細
// （跟其他通路共配時，會一併列出各通路的店數/佔比/請款金額方便對照）。
function originLabel(addr){
  const og = state.data.origins.find(o=>o.address===addr);
  return og ? (og.label||og.address) : (addr || '（未知出發點）');
}
function buildChannelRunRows(channelId, start, end){
  const rows = state.data.assignments.filter(a=> a.status==='completed' && a.date>=start && a.date<=end);
  const byOrigin = {};
  rows.forEach(a=>{
    const route = state.data.routes.find(r=>r.id===a.routeId);
    if(!route) return;
    const byChannel = effectiveByChannelForAssignment(a);
    if(!byChannel[channelId]) return;
    const addr = route.originAddr || '';
    if(!byOrigin[addr]) byOrigin[addr] = [];
    byOrigin[addr].push({ a, route, byChannel });
  });
  Object.values(byOrigin).forEach(list=> list.sort((x,y)=>
    x.a.date.localeCompare(y.a.date) || (x.route.shift||'').localeCompare(y.route.shift||'') || seqSortKey(x.route.seq)-seqSortKey(y.route.seq)
  ));
  return byOrigin;
}
function renderRunDetailTables(channelId, start, end){
  const byOrigin = buildChannelRunRows(channelId, start, end);
  const originAddrs = Object.keys(byOrigin);
  if(!originAddrs.length) return '<div class="empty">此區間無相關車趟</div>';
  return originAddrs.map(addr=>{
    const list = byOrigin[addr];
    const channelIds = [...new Set(list.flatMap(x=>Object.keys(x.byChannel)))].sort((a,b)=> a===channelId?-1: b===channelId?1:0);
    const bodyRows = list.map(({a,route,byChannel})=>{
      const totalAmt = Object.values(byChannel).reduce((s,v)=>s+v,0);
      const storeCells = channelIds.map(cid=>`<td>${(a.dropPoints||[]).filter(dp=>dp.channelId===cid).length}</td>`).join('');
      const pctCells = channelIds.map(cid=>`<td>${totalAmt? ((byChannel[cid]||0)/totalAmt*100).toFixed(1):'0.0'}%</td>`).join('');
      const amtCells = channelIds.map(cid=>`<td class="amount">$${money(Math.round(byChannel[cid]||0))}</td>`).join('');
      return `<tr>
        <td>${a.date}</td><td>${route.shift==='AM'?'上午':'下午'}</td><td>${stripWeekdayLabel(route.seq)}</td>
        <td>${(a.dropPoints||[]).map(dpLabel).join('➔')||'—'}</td>
        ${storeCells}<td>${a.distanceKm??'—'}</td><td class="amount">$${money(Math.round(totalAmt))}</td>
        ${pctCells}${amtCells}
      </tr>`;
    }).join('');
    return `<h4 style="margin:14px 0 6px;">${originLabel(addr)}｜配送明細</h4>
      <table>
        <thead><tr><th>日期</th><th>時段</th><th>車次</th><th>配送路線</th>${channelIds.map(cid=>`<th>${channelName(cid)}店數</th>`).join('')}<th>公里</th><th>總金額</th>${channelIds.map(cid=>`<th>${channelName(cid)}佔比</th>`).join('')}${channelIds.map(cid=>`<th>${channelName(cid)}請款</th>`).join('')}</tr></thead>
        <tbody>${bodyRows}</tbody>
      </table>`;
  }).join('');
}
function renderBilling(c){
  const chOpts = state.data.channels.map(ch=>`<option value="${ch.id}">${ch.name}</option>`).join('');
  const month = state._billingMonth || todayStr().slice(0,7);
  c.innerHTML = `
    <h2 class="section-title">請款結算</h2>
    <p class="section-sub">依通路結算請款單。系統會依「路線版本異動的日期」自動把請款區間切成好幾段小區間分開計算；每段區間內再依供應商（出發點）拆開顯示。每趟車的金額跟著路線管理裡設定的版本走；有星期一報價版本的路線，一律套用星期一版本的拆賬金額。路線名稱如果有標註星期，請款單上會自動省略不顯示。</p>
    <div class="panel">
      <div class="grid3">
        <div class="field"><label>通路</label><select id="bChannel">${chOpts}</select></div>
        <div class="field"><label>對應月份</label><input id="bMonth" type="month" value="${month}"></div>
      </div>
      <div class="grid2">
        <div class="field"><label>區間起（可調整）</label><input id="bStart" type="date"></div>
        <div class="field"><label>區間迄（可調整）</label><input id="bEnd" type="date"></div>
      </div>
    </div>
    <div class="panel">
      <h3 style="margin-top:0;">例外調整（人工加註的備註與金額，會併入本張請款單總額）</h3>
      <div class="grid3">
        <div class="field" style="grid-column:span 2;"><label>備註</label><input id="baNote" placeholder="例如：7/28久陽一車未出車"></div>
        <div class="field"><label>金額（可為負數）</label><input id="baAmount" type="number"></div>
      </div>
      <button class="btn ghost" id="addBillingAdj">新增調整項</button>
      <div id="billingAdjList" style="margin-top:8px;"></div>
    </div>
    <div id="billingResult"></div>`;
  function currentPeriod(){
    return { channelId: document.getElementById('bChannel').value, start: document.getElementById('bStart').value, end: document.getElementById('bEnd').value };
  }
  function refreshAdjList(){
    const { channelId, start, end } = currentPeriod();
    const list = state.data.billingAdjustments.filter(x=>x.channelId===channelId && x.periodStart===start && x.periodEnd===end);
    document.getElementById('billingAdjList').innerHTML = list.length ? `<table><thead><tr><th>備註</th><th>金額</th><th></th></tr></thead><tbody>${list.map(x=>`<tr><td>${x.note}</td><td class="amount">${x.amount>=0?'+':''}$${money(x.amount)}</td><td class="no-print"><button class="btn danger" data-deladj="${x.id}">刪除</button></td></tr>`).join('')}</tbody></table>` : '<div class="empty">此區間尚無例外調整</div>';
    document.getElementById('billingAdjList').querySelectorAll('[data-deladj]').forEach(btn=>{
      btn.onclick = async ()=>{ try{ await deleteBillingAdjustment(btn.dataset.deladj); refreshAdjList(); refresh(); }catch(err){ alert(err.message); } };
    });
  }
  document.getElementById('addBillingAdj').onclick = async ()=>{
    const { channelId, start, end } = currentPeriod();
    const note = document.getElementById('baNote').value.trim();
    const amount = Number(document.getElementById('baAmount').value);
    if(!note || !amount){ alert('請填寫備註與金額'); return; }
    try{
      await createBillingAdjustment({ channelId, periodStart:start, periodEnd:end, note, amount });
      document.getElementById('baNote').value=''; document.getElementById('baAmount').value='';
      refreshAdjList(); refresh();
    }catch(err){ alert(err.message); }
  };
  function refresh(){
    const channelId = document.getElementById('bChannel').value;
    const monthStr = document.getElementById('bMonth').value;
    state._billingMonth = monthStr;
    const channel = state.data.channels.find(ch=>ch.id===channelId);
    if(!channel){ document.getElementById('billingResult').innerHTML='<div class="empty">請先建立通路</div>'; return; }
    let period = defaultPeriod(channel, monthStr);
    const startInput = document.getElementById('bStart'), endInput = document.getElementById('bEnd');
    if(!startInput.value) startInput.value = period.start;
    if(!endInput.value) endInput.value = period.end;
    const start = startInput.value, end = endInput.value;
    refreshAdjList();

    const segments = splitPeriodByVersionChanges(channelId, start, end);
    // 先把每段小區間的金額四捨五入到整數再往下加總，確保畫面上顯示的每一列
    // 跟「未稅/含稅合計」對得起來（不會因為先加總浮點數再四捨五入而差1元）。
    const segRows = segments.map(seg=> ({ ...seg, amount: Math.round(channelBillingTotal(channelId, seg.start, seg.end).total) }));
    const tripTotal = segRows.reduce((s,x)=>s+x.amount, 0);
    const originRows = channelOriginBreakdown(channelId, start, end);
    const adjustments = state.data.billingAdjustments.filter(x=>x.channelId===channelId && x.periodStart===start && x.periodEnd===end);
    const adjTotal = adjustments.reduce((s,x)=>s+x.amount, 0);
    const combined = tripTotal + adjTotal;
    const taxIncl = channel.taxInclusive !== false;
    const grand = untaxWithTax(combined, taxIncl);
    const originWithTax = originRows.map(o=> ({ ...o, ...untaxWithTax(o.amount, taxIncl) }));

    document.getElementById('billingResult').innerHTML = `
      <div class="panel">
        <h3 style="margin-top:0;">${channel.name}｜物流費用請款總覽（${start} ~ ${end}）</h3>
        <table>
          <thead><tr><th>請款期間</th><th>物流費</th></tr></thead>
          <tbody>${segRows.map(s=>`<tr><td>${s.start} ~ ${s.end}</td><td class="amount">$${money(Math.round(s.amount))}</td></tr>`).join('') || '<tr><td colspan="2"><div class="empty">此區間無相關車趟</div></td></tr>'}
          ${adjustments.map(x=>`<tr><td>${x.note}</td><td class="amount">${x.amount>=0?'+':''}$${money(x.amount)}</td></tr>`).join('')}
          </tbody>
          <tfoot><tr><td><strong>未稅合計</strong></td><td class="amount"><strong>$${money(grand.untaxed)}</strong></td></tr>
          <tr><td><strong>稅額</strong></td><td class="amount"><strong>$${money(grand.tax)}</strong></td></tr>
          <tr><td><strong>含稅合計</strong></td><td class="amount"><strong>$${money(grand.withTax)}</strong></td></tr></tfoot>
        </table>
        <h4 style="margin:14px 0 6px;">各區費用總覽（依供應商／出發點）</h4>
        <table>
          <thead><tr><th>供應商</th><th>車趟數</th><th>配送店次</th><th>未稅</th><th>稅額</th><th>含稅</th></tr></thead>
          <tbody>${originWithTax.map(o=>`<tr><td>${originLabel(o.originAddr)}</td><td>${o.tripCount}</td><td>${o.storeCount}</td><td class="amount">$${money(o.untaxed)}</td><td class="amount">$${money(o.tax)}</td><td class="amount">$${money(o.withTax)}</td></tr>`).join('') || '<tr><td colspan="6"><div class="empty">此區間無相關車趟</div></td></tr>'}</tbody>
        </table>
        ${renderRunDetailTables(channelId, start, end)}
        <button class="btn amber no-print" id="printBilling" style="margin-top:10px;">產生請款單（列印/另存PDF）</button>
      </div>`;
    document.getElementById('printBilling').onclick = ()=> exportPanelPrint(document.getElementById('printBilling').closest('.panel'), `${channel.name}_${start}_${end}_請款單`);
  }
  document.getElementById('bChannel').onchange = ()=>{ document.getElementById('bStart').value=''; document.getElementById('bEnd').value=''; refresh(); };
  document.getElementById('bMonth').onchange = ()=>{ document.getElementById('bStart').value=''; document.getElementById('bEnd').value=''; refresh(); };
  document.getElementById('bStart').onchange = refresh;
  document.getElementById('bEnd').onchange = refresh;
  refresh();
}

function renderExport(c){

        <div class="field"><label>結束日期</label><input id="exEnd" type="date"></div>
      </div>
      <button class="btn ghost" id="exPreview">預覽區間資料</button>
    </div>
    <div id="exResult"></div>
  `;
  function getMatched(){
    const type = document.getElementById('exType').value;

    if(!start || !end) return {type, start, end, rows:[]};
    if(type==='assignments'){
      return {type, start, end, rows: state.data.assignments.filter(a=>a.date>=start && a.date<=end)};
    } else {
      return {type, start, end, rows: state.data.adjustments.filter(a=>a.month >= start.slice(0,7) && a.month <= end.slice(0,7))};
    }
  }
  document.getElementById('exPreview').onclick = ()=>{
    const {type, start, end, rows} = getMatched();
    if(!start || !end){ alert('請選擇起訖日期'); return; }
    document.getElementById('exResult').innerHTML = `
      <div class="panel">
        <h3 style="margin-top:0;">預覽：${start} ~ ${end}（共 ${rows.length} 筆）</h3>
        <table>
          ${type==='assignments' ? `
            <thead><tr><th>日期</th><th>路線</th><th>司機</th><th>車資</th><th>狀態</th></tr></thead>
            <tbody>${rows.map(a=>`<tr><td>${a.date}</td><td>${routeName(a.routeId)}</td><td>${driverName(a.driverId)}</td><td class="amount">$${money(a.fare)}</td><td>${a.status==='completed'?'已完成':'排定中'}</td></tr>`).join('') || '<tr><td colspan="5"><div class="empty">此區間無資料</div></td></tr>'}
          ` : `
            <thead><tr><th>月份</th><th>司機</th><th>類型</th><th>金額</th><th>備註</th></tr></thead>
            <tbody>${rows.map(a=>`<tr><td>${a.month}</td><td>${driverName(a.driverId)}</td><td>${a.type==='advance'?'預支':a.type==='add'?'加錢':'減錢'}</td><td class="amount">$${money(a.amount)}</td><td>${a.note||'—'}</td></tr>`).join('') || '<tr><td colspan="5"><div class="empty">此區間無資料</div></td></tr>'}
          `}
        </table>
        <div class="no-print" style="margin-top:10px; display:flex; gap:8px;">
          <button class="btn ghost" id="exPrint">列印/另存PDF</button>
          <button class="btn danger" id="exDelete" ${rows.length?'':'disabled'}>確認已匯出，刪除此區間資料</button>
        </div>
      </div>`;
    document.getElementById('exPrint').onclick = ()=> exportPanelPrint(document.getElementById('exPrint').closest('.panel'), `資料匯出_${start}_${end}`);
    const delBtn = document.getElementById('exDelete');
    if(delBtn) delBtn.onclick = async ()=>{
      if(!confirm('確定已完成PDF匯出／備份？此動作將永久刪除此區間資料，無法復原。')) return;
      try{
        const ids = rows.map(r=>r.id);
        if(type==='assignments') await bulkDeleteAssignments(ids);
        else await bulkDeleteAdjustments(ids);
        document.getElementById('exResult').innerHTML = '<div class="note">已刪除該區間資料。</div>';
      }catch(err){ alert(err.message); }
    };
  };
}

        </span>
      </div>
      <p style="font-size:12.5px;">出發點：${a.origin||'—'} <a class="link" href="${mapLink(a.origin||'')}" target="_blank">${a.origin?'開啟導航':''}</a></p>
      ${a.status==='scheduled' ? `<button class="btn amber" data-start="${a.id}">開始行程</button>` : `
        ${a.dropPoints.map(dp=>`

            ${dpLabel(dp)}（${channelName(dp.channelId)}）
            ${dp.status==='completed'?'<span class="badge completed">已送達</span>':'<span class="badge pending">待送達</span>'}

          </div>`).join('')}

        ${!allDone?'<p style="font-size:11.5px;color:var(--ink-soft);">尚有下貨點未完成拍照，結束時需填寫備註說明原因</p>':''}
      `}

  }).join('');

      catch(err){ alert(err.message); }
    };
  });
  box.querySelectorAll('[data-finish]').forEach(btn=>{
    btn.onclick = async ()=>{
      const a = state.data.assignments.find(x=>x.id===btn.dataset.finish);
      const allDone = a.dropPoints.length>0 && a.dropPoints.every(dp=>dp.status==='completed');
      let issueNote;
      if(!allDone){
        const note = prompt('尚有下貨點未完成拍照回報，請說明原因（此備註主控端會看到）：');
        if(note===null) return;
        if(!note.trim()){ alert('請填寫備註原因'); return; }
        issueNote = note.trim();
      }
      try{ await markAssignmentComplete(a.id, issueNote); renderContent(); }
      catch(err){ alert(err.message); }
    };
  });
  box.querySelectorAll('[data-photo]').forEach(input=>{
    input.onchange = (e)=>{
      const [aid, dpid] = input.dataset.photo.split('|');
      const file = e.target.files[0]; if(!file) return;
      compressImageFile(file).then(async (dataUrl)=>{
        await uploadDropPointPhoto(aid, dpid, dataUrl);
        renderContent();
      }).catch(err=>{
        console.error('照片處理失敗', err);
        alert('照片處理失敗，請重新拍攝或選擇另一張照片再試一次。');
      });
    };
  });
}

        <tbody>${r.trips.map(a=>`<tr><td>${a.date}</td><td>${routeName(a.routeId)}</td><td class="amount">$${money(a.fare)}</td></tr>`).join('') || '<tr><td colspan="3"><div class="empty">本月尚無已完成車趟</div></td></tr>'}</tbody>
      </table>
      ${r.adjustments.length ? `
        <h3>本月調整項明細</h3>
        <table>
          <thead><tr><th>項目</th><th>備註</th><th>金額</th></tr></thead>
          <tbody>${r.adjustments.map(adj=>`<tr><td>${adj.type==='advance'?'預支':adj.type==='add'?'加項':'扣項'}</td><td>${adj.note||'—'}</td><td class="amount">${adj.type==='add'?'+':'-'}$${money(Math.abs(adj.amount))}</td></tr>`).join('')}</tbody>
        </table>
      ` : ''}
    </div>`;
}
// ---------- 司機端：我的資料 ----------
function renderMyProfile(c){
  const dId = state.activeDriverId;
  const d = state.data.drivers.find(x=>x.id===dId);
  c.innerHTML = `
    <h2 class="section-title">我的資料</h2>
    <p class="section-sub">修改後主控端會收到通知。姓名與狀態如需變更請聯絡主控。</p>
    <div class="panel">
      <div class="grid3">
        <div class="field"><label>電話</label><input id="mpPhone" value="${d.phone||''}"></div>
        <div class="field"><label>車牌</label><input id="mpPlate" value="${d.vehicle.plate||''}"></div>
        <div class="field"><label>車型</label><input id="mpVType" value="${d.vehicle.type||''}"></div>
      </div>
      <div class="grid4">
        <div class="field"><label>銀行</label><input id="mpBankName" value="${d.bank.bankName||''}"></div>
        <div class="field"><label>分行</label><input id="mpBranch" value="${d.bank.branch||''}"></div>
        <div class="field"><label>帳號</label><input id="mpAccount" value="${d.bank.account||''}"></div>
        <div class="field"><label>戶名</label><input id="mpHolder" value="${d.bank.holder||''}"></div>
      </div>
      <button class="btn amber" id="mpSave">儲存修改</button>
    </div>
  `;
  document.getElementById('mpSave').onclick = async ()=>{
    const changes = [];
    const checks = [
      ['phone', d.phone, document.getElementById('mpPhone').value.trim(), '電話'],
      ['vehicle.plate', d.vehicle.plate, document.getElementById('mpPlate').value.trim(), '車牌'],
      ['vehicle.type', d.vehicle.type, document.getElementById('mpVType').value.trim(), '車型'],
      ['bank.bankName', d.bank.bankName, document.getElementById('mpBankName').value.trim(), '銀行'],
      ['bank.branch', d.bank.branch, document.getElementById('mpBranch').value.trim(), '分行'],
      ['bank.account', d.bank.account, document.getElementById('mpAccount').value.trim(), '帳號'],
      ['bank.holder', d.bank.holder, document.getElementById('mpHolder').value.trim(), '戶名']
    ];
    checks.forEach(([field, oldVal, newVal, label])=>{ if((oldVal||'')!==newVal) changes.push(label); });
    if(!changes.length){ alert('沒有變更任何欄位'); return; }
    try{
      await updateDriverProfile(dId, {
        phone: document.getElementById('mpPhone').value.trim(),
        plate: document.getElementById('mpPlate').value.trim(),
        vtype: document.getElementById('mpVType').value.trim(),
        bankName: document.getElementById('mpBankName').value.trim(),
        branch: document.getElementById('mpBranch').value.trim(),

        holder: document.getElementById('mpHolder').value.trim()
      }, changes.join('、'));
      alert('已儲存，主控端會收到通知。');
      renderContent();
    }catch(err){ alert(err.message); }
  };
}

// 全畫面橫版簽名視窗：點「已確認報酬」才跳出來簽，簽完按☑️送出、按❌取消不送出。
function openSignatureModal(record){
  const host = document.getElementById('sigModalHost');
  // 手機直放時簽名畫布會又窄又長不好簽，這裡用CSS把整個視窗轉90度，
  // 讓司機不用自己轉手機也能用橫式畫面簽名（平板/電腦本來就是橫的就不用轉）。
  const isPortrait = window.innerHeight > window.innerWidth;
  host.innerHTML = `
    <div class="sig-modal-backdrop${isPortrait ? ' sig-force-landscape' : ''}" id="sigBackdrop">
      <div class="sig-modal-canvas-wrap">
        <div class="sig-watermark">請簽名</div>
        <canvas id="sigPad"></canvas>
      </div>
      <div class="sig-modal-actions">
        <div class="sig-side"><button class="sig-clear-link" id="sigClear">清除重簽</button></div>
        <div class="sig-side">
          <button class="sig-icon-btn cancel" id="sigCancel" title="取消">❌</button>
          <button class="sig-icon-btn confirm" id="sigConfirm" title="確認送出">☑️</button>
        </div>
      </div>
    </div>`;
  const canvas = document.getElementById('sigPad');
  const wrapEl = canvas.parentElement;
  const ctx = canvas.getContext('2d');
  function resizeCanvas(){
    const rect = wrapEl.getBoundingClientRect();
    const prev = canvas.width ? canvas.toDataURL('image/png') : null;
    canvas.width = rect.width * 2; canvas.height = rect.height * 2;
    ctx.lineWidth = 5; ctx.lineCap = 'round'; ctx.strokeStyle = '#1B2129';
    if(prev){ const img = new Image(); img.onload = ()=> ctx.drawImage(img,0,0,canvas.width,canvas.height); img.src = prev; }
  }
  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);
  let drawing = false, hasSignature = false;
  function pos(e){
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width/rect.width, scaleY = canvas.height/rect.height;
    return { x:(e.clientX-rect.left)*scaleX, y:(e.clientY-rect.top)*scaleY };
  }
  canvas.addEventListener('pointerdown', e=>{ drawing=true; hasSignature=true; const p=pos(e); ctx.beginPath(); ctx.moveTo(p.x,p.y); });
  canvas.addEventListener('pointermove', e=>{ if(!drawing) return; const p=pos(e); ctx.lineTo(p.x,p.y); ctx.stroke(); });
  window.addEventListener('pointerup', ()=>{ drawing=false; });
  document.getElementById('sigClear').onclick = ()=>{ ctx.clearRect(0,0,canvas.width,canvas.height); hasSignature=false; };
  document.getElementById('sigCancel').onclick = ()=>{ window.removeEventListener('resize', resizeCanvas); host.innerHTML=''; };
  document.getElementById('sigConfirm').onclick = async ()=>{
    if(!hasSignature){ alert('請先簽名再送出'); return; }
    try{
      await signStatement(record.id, canvas.toDataURL('image/png'));
      window.removeEventListener('resize', resizeCanvas);
      host.innerHTML='';
      renderContent();
    }catch(err){ alert(err.message); }
  };
}
function renderMyStatement(c){
  const dId = state.activeDriverId;
  const now = new Date(); let prevY=now.getFullYear(), prevM=now.getMonth();
  if(prevM===0){ prevM=12; prevY--; }
  const defaultMonth = `${prevY}-${pad(prevM)}`;
  const monthStr = state._myStatementMonth || defaultMonth;
  c.innerHTML = `
    <h2 class="section-title">對帳單 / 勞報單</h2>
    <div class="panel"><div class="field" style="max-width:200px;"><label>月份</label><input id="smMonth" type="month" value="${monthStr}"></div></div>
    <div id="statementBox"></div>`;
  function refresh(){
    const m = document.getElementById('smMonth').value;
    state._myStatementMonth = m;
    const record = state.data.statements.find(s=>s.driverId===dId && s.month===m);
    const box = document.getElementById('statementBox');

    if(!record){
      box.innerHTML = `<div class="panel"><div class="empty">${m} 尚未由主控端完成月結確認，結算完成後才能在這裡看到並回簽勞報單。</div></div>`;
      return;
    }
    if(record.status==='awaiting_signature'){
      box.innerHTML = `
        <div class="panel">
          <h3 style="margin-top:0;">${driverName(dId)} — ${m} 勞報單 <span class="badge progress">待回簽</span></h3>
          <table>
            <tr><td>車趟報酬合計</td><td class="amount">$${money(record.tripTotal)}</td></tr>
            <tr><td>調整項合計</td><td class="amount">${record.adjTotal>=0?'+':''}$${money(record.adjTotal)}</td></tr>
            <tr><td><strong>應付淨額</strong></td><td class="amount"><strong>$${money(record.net)}</strong></td></tr>
          </table>
          <button class="btn amber no-print" id="ackPayBtn" style="width:100%; margin-top:6px;">已確認報酬</button>
        </div>
        <div id="sigModalHost"></div>`;
      document.getElementById('ackPayBtn').onclick = ()=> openSignatureModal(record);
    } else if(record.status==='signed'){
      box.innerHTML = `
        <div class="panel">
          <h3 style="margin-top:0;">${driverName(dId)} — ${m} 勞報單 <span class="badge signed">已回簽</span></h3>
          <div class="note">此為回簽當下凍結的金額，之後不會再變動。</div>
          <table>
            <tr><td>車趟報酬合計</td><td class="amount">$${money(record.tripTotal)}</td></tr>
            <tr><td>調整項合計</td><td class="amount">${record.adjTotal>=0?'+':''}$${money(record.adjTotal)}</td></tr>
            <tr><td><strong>應付淨額</strong></td><td class="amount"><strong>$${money(record.net)}</strong></td></tr>
          </table>
          ${record.signatureDataUrl?`<label>您的簽名</label><br><img src="${record.signatureDataUrl}" style="max-width:280px; border:1px solid var(--border); border-radius:var(--radius);">`:''}
          <div class="no-print" style="margin-top:10px;">
            <button class="btn ghost" id="printMy">列印/另存PDF</button>
          </div>
        </div>`;
      document.getElementById('printMy').onclick = ()=> exportPanelPrint(document.getElementById('printMy').closest('.panel'), `${driverName(dId)}_${m}_對帳單`);
    }
  }
  document.getElementById('smMonth').onchange = refresh;
  refresh();
}

// ---------- 登入與身份識別 ----------
// 原本的 loadSession/saveSession/clearSession（只記「我剛剛通過代碼檢查」，
// 沒有真正的驗證）與 renderLoginGate（直接比對 state.data 裡的明文PIN/代碼）
// 已經整個由 js/auth.js 取代：改成呼叫 Vercel Serverless Function 驗證、拿到簽過名的
// JWT 存進 localStorage，見 auth.js 的 getStoredAuth()/clearAuth()/renderLoginGate()。
function updateTitle(){
  const inDriverView = state.adminViewDriver || state.role==='driver';
  document.getElementById('appTitle').textContent = inDriverView ? '碳金車隊' : '碳金車隊調度系統';
}
function updateHeaderBar(){
  const who = document.getElementById('whoAmI');
  const btn = document.getElementById('logoutBtn');
  btn.style.display = 'inline-block';
  if(state.adminViewDriver){
    who.textContent = `主控檢視中：${driverName(state.adminViewDriver)}`;
    btn.textContent = '返回主控';
  } else if(state.role==='admin'){
    who.textContent = '主控帳號';
    btn.textContent = '登出／切換身份';
  } else {
    who.textContent = `司機：${driverName(state.activeDriverId)}`;
    btn.textContent = '登出／切換身份';
  }
}
function viewAsDriver(driverId){
  state.adminViewDriver = driverId;
  state.activeDriverId = driverId;
  state.tab = 'home';
  updateHeaderBar(); renderNav(); renderContent();
}
function showApp(){
  document.getElementById('loginGate').style.display = 'none';
  document.getElementById('appLayout').style.display = 'flex';
  updateHeaderBar();
  updateTitle(); renderNav(); renderContent();
}
// renderLoginGate() 的正式版實作在 js/auth.js（呼叫 /api/auth-driver、/api/auth-admin，
// 不再直接比對 state.data 裡的明文PIN/代碼；此時 state.data 根本還沒載入）。
document.getElementById('logoutBtn').onclick = ()=>{
  if(state.adminViewDriver){
    state.adminViewDriver = null; state.activeDriverId = null; state.tab = 'home';
    updateHeaderBar(); updateTitle(); renderNav(); renderContent();
    return;
  }
  clearAuth(); state.role=null; state.activeDriverId=null; state.tab=null;
  renderLoginGate();
};

// cleanupOldPhotos()（每次開系統時把超過30天的照片從記憶體裡清掉）已經沒有對應實作。
// 正式版的照片存在 Supabase Storage，「清除30天前照片」需要一支獨立的排程工作
// （例如 Supabase pg_cron + Edge Function，定期找出 assignment_drop_points 裡
// completed_at 超過30天且 photo_cleared=false 的資料列，刪除 Storage 物件後
// 把 photo_url 設回 null、photo_cleared 設成 true）。這個排程job還沒有建立，
// 是目前已知、故意先擱置的缺口，上線前請評估是否要先做這個，或先接受
// 舊照片會持續留在 Storage 裡（多花一點儲存空間，但不影響功能正確性）。

async function bootApp(){
  const auth = getStoredAuth();
  if(!auth){ renderLoginGate(); return; }
  state.role = auth.role;
  if(auth.role==='driver') state.activeDriverId = auth.driver.id;
  try{
    state.data = await loadAllData();
  }catch(e){
    alert('讀取資料失敗，請重新登入：' + e.message);
    clearAuth(); renderLoginGate();
    return;
  }
  if(auth.role==='driver'){
    const stillActive = state.data.drivers.some(d=>d.id===auth.driver.id && d.status==='active');
    if(!stillActive){ clearAuth(); renderLoginGate('此帳號已停用，請聯絡主控。'); return; }
  }
  showApp();
}

(async function init(){
  await bootApp();
})();
</script>

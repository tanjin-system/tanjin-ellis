  function wireDeferredForm(){
    const save = document.getElementById('dfSave');
    if(!save) return;
    const pv = document.getElementById('dfPreview');
    let timer=null, seq=0;
    const update = ()=>{
      clearTimeout(timer);
      timer = setTimeout(async ()=>{
        const start = document.getElementById('dfStart').value, end = document.getElementById('dfEnd').value, driverId = document.getElementById('pDriver').value;
        const my = ++seq;
        if(!driverId || !start || !end){ pv.textContent=''; return; }
        try{ validatePaymentRange(start, end); }catch(err){ pv.textContent = err.message; return; }
        try{
          const trips = await fetchDriverTripsInRange(driverId, start, end);
          if(my!==seq || !pv.isConnected) return;
          const list = trips.filter(t=>t.status==='completed' && !(Number(t.paidAmount)>0));
          const total = list.reduce((s,t)=>s+tripPay(t),0);
          pv.innerHTML = `區間內已完成未付 <b>${list.length}</b> 趟，趟報酬合計 <b>$${money(total)}</b>。`;
        }catch(err){ if(my===seq) pv.textContent = err.message; }
      }, 300);
    };
    ['dfStart','dfEnd'].forEach(id=> document.getElementById(id).oninput = update);
    document.getElementById('dfStart').value = ymd(addDays(todayStr(), -1));
    document.getElementById('dfEnd').value = ymd(addDays(todayStr(), -1));
    update();
    save.onclick = async ()=>{
      const driverId = document.getElementById('pDriver').value;
      const args = { driverId, start:document.getElementById('dfStart').value, end:document.getElementById('dfEnd').value, dueDate:document.getElementById('dfDue').value, note:document.getElementById('dfNote').value };
      if(!driverId){ alert('請先選擇夥伴'); return; }
      if(!args.dueDate){ alert('請選擇預計付款日'); return; }
      if(!confirm(`把 ${driverName(driverId)} ${args.start}～${args.end} 已完成的任務掛帳，預計 ${args.dueDate} 付款嗎？`)) return;
      try{ const r = await deferPayment(args); alert(`已掛帳：${r.count} 趟，趟報酬合計 $${r.total}，預計 ${args.dueDate} 付款`); document.getElementById('dfNote').value=''; renderDeferredPanel(); update(); }
      catch(err){ alert(err.message); }
    };

  // 已開單（金額凍結）的勞報單，如果跟「現在的即時帳務」對不上（例如開單後才補代墊款日期、
  // 加減項被改），在主控端提醒收回重開；夥伴看到的仍是凍結的數字，這裡只是給主控的警示。
  function statementDriftNote(record, live){
    if(!record) return '';
    const calc = statementNetFromAdjustments(live.tripTotal, live.adjustments);
    const diffs = [];
    if(Math.abs(record.tripTotal - live.tripTotal) > 0.5) diffs.push(`任務報酬 凍結 $${money(record.tripTotal)}／現在 $${money(live.tripTotal)}`);
    if(Math.abs(record.adjTotal - calc.adjTotal) > 0.5) diffs.push(`加減項 凍結 $${money(record.adjTotal)}／現在 $${money(calc.adjTotal)}`);
    if(Math.abs(record.reimbursementAmount - live.reimbursement) > 0.5) diffs.push(`代墊款 凍結 $${money(record.reimbursementAmount)}／現在 $${money(live.reimbursement)}`);
    if(!diffs.length) return '';
    return `<div class="note" style="border-color:var(--danger); color:var(--danger);">⚠️ 這張勞報單開單後帳務有變動，凍結的數字跟現在對不上：${diffs.join('；')}。如果現在的帳才是對的，請「收回」後重新開單。</div>`;
  }

    else { state._payrollMonth = x.month; state._scrollTo = 'payrollResult'; }
    renderContent();
  }

    box.innerHTML = listHtml + '<div class="empty">載入中...</div>';
    let rangeAssignments;

    const record = state.data.statements.find(x=>x.driverId===driverId && x.periodStart===start && x.periodEnd===end);

        ${overlap ? `<div class="note" style="color:var(--danger);">⚠️ 這段期間跟已存在的勞報單（${statementLabel(overlap)}）重疊，不能開單。</div>` : ''}
        <h4 style="margin:14px 0 8px; font-size:13.5px;">配送明細（${sortedTrips.length}趟，合計 <span class="amount">$${money(r.tripTotal)}</span>）</h4>
        <table><thead><tr><th>日期</th><th>路線</th><th>車資</th></tr></thead>
          <tbody>${sortedTrips.map(a=>`<tr><td>${a.date}</td><td>${routeName(a.routeId)}</td><td class="amount">$${money(tripPay(a))}</td></tr>`).join('') || '<tr><td colspan="3"><div class="empty">這段期間無已完成任務</div></td></tr>'}</tbody></table>
        <h4 style="margin:14px 0 8px; font-size:13.5px;">調整項（依調整項日期歸入）</h4>
        <table><thead><tr><th>日期</th><th>調整項類型</th><th>金額</th><th>備註</th><th></th></tr></thead>
          <tbody>${r.adjustments.map(a=>`<tr><td>${adjustmentEffectiveDate(a)}${a.date?'':'（無日期）'}</td><td>${adjTypeLabel(a.type)}</td><td class="amount">$${money(a.amount)}</td><td>${escapeHtml(a.note||'—')}</td><td>${!record?`<button class="btn danger" data-perdeladj="${a.id}">刪除</button>`:''}</td></tr>`).join('') || '<tr><td colspan="5"><div class="empty">無調整項</div></td></tr>'}</tbody></table>
        <table style="margin-top:10px;">
          <tr><td>報酬總額（任務＋加項−減項）</td><td class="amount">$${money(r.net)}</td></tr>
          ${r.reimbursement ? `<tr><td>　其中代墊款（憑證開公司，非所得，不扣稅）</td><td class="amount">$${money(r.reimbursement)}</td></tr><tr><td>　所得額（扣稅／補充保費基礎）</td><td class="amount">$${money(r.net-r.reimbursement)}</td></tr>` : ''}
          ${ded.taxAmount||ded.nhiAmount ? `<tr><td>扣稅／補充保費</td><td class="amount">-$${money(ded.taxAmount+ded.nhiAmount)}</td></tr>` : ''}
          ${advanceTotal ? `<tr><td>已預支</td><td class="amount">-$${money(advanceTotal)}</td></tr>` : ''}
          ${paidTotal ? `<tr><td>已付款（先付現金／轉帳）</td><td class="amount">-$${money(paidTotal)}</td></tr>` : ''}
          <tr><td><strong>可領淨額</strong></td><td class="amount"><strong>${payable<0?'-':''}$${money(Math.abs(payable))}</strong></td></tr>

// ---------- 請款結算 ----------
// 依「通路」（例如7-11、康達盛通）結算一整份請款單：先依路線版本異動日期自動切成
// 好幾段小區間算出各通路自己的未稅/含稅總額；配送明細則是「已選通路」共用一份，
// 只列出已選通路的店數/佔比/金額，未勾選的通路完全不會出現（見 mergedRunRows）。
// ---------- 夥伴搜尋選單 ----------
// 把原本的 <select>（夥伴太多時很難找）升級成「可輸入文字搜尋」的選單：原本的 select 仍保留在頁面上
// （隱藏），選到的值照常讀 select.value、照常觸發 change，所以呼叫端程式完全不用改。
// 排班／換夥伴這幾處可以傳 getOrigin，優先列出「最近 60 天實際跑過這個任務起點」的夥伴（自動判斷，免維護）。
async function loadDriverOriginStats(){
  const c = state._driverOriginStats;
  if(c && Date.now() - c.at < 30*60*1000) return c.map;
  const supabase = getSupabase();
  const since = ymd(addDays(todayStr(), -60));
  const PAGE = 1000, rows = [];
  for(let from=0; ; from+=PAGE){
    const { data, error } = await supabase.from('assignments').select('driver_id, route_id')
      .eq('status','completed').gte('trip_date', since).order('id').range(from, from+PAGE-1);
    if(error) throw new Error(error.message);
    rows.push(...(data||[]));
    if(!data || data.length < PAGE) break;
  }
  const routeOrigin = new Map(state.data.routes.map(r=>[r.id, r.originAddr]));
  const map = new Map(); // originAddr -> Map(driverId -> 趟數)
  rows.forEach(r=>{
    const og = routeOrigin.get(r.route_id); if(!og) return;
    if(!map.has(og)) map.set(og, new Map());
    const m = map.get(og); m.set(r.driver_id, (m.get(r.driver_id)||0)+1);
  });
  state._driverOriginStats = { at: Date.now(), map };
  return map;
}
function enhanceDriverSelect(sel, opts){
  if(!sel || sel.dataset.enhanced) return;
  opts = opts || {};
  sel.dataset.enhanced = '1';
  sel.style.display = 'none';
  const wrap = document.createElement('div');
  wrap.style.cssText = 'position:relative; width:100%;';
  const input = document.createElement('input');
  input.type = 'text'; input.autocomplete = 'off';
  input.style.cssText = 'width:100%;';
  const list = document.createElement('div');
  list.style.cssText = 'display:none; position:absolute; left:0; right:0; top:100%; z-index:60; max-height:280px; overflow:auto; background:var(--panel,#fff); border:1px solid var(--border); border-radius:8px; box-shadow:0 6px 18px rgba(27,33,41,.18); margin-top:2px;';
  wrap.appendChild(input); wrap.appendChild(list);
  sel.after(wrap);
  // 「選擇夥伴」這種空白提示選項不列進清單（只有「全部夥伴」這種有意義的空值保留）。
  const options = ()=> [...sel.options].filter(o=>o.value || o.textContent.includes('全部')).map(o=>({ value:o.value, text:o.textContent }));
  const currentText = ()=>{ const o = sel.options[sel.selectedIndex]; return o && o.value ? o.textContent : (o && o.textContent.includes('全部') ? o.textContent : ''); };
  const syncText = ()=>{ input.value = currentText(); input.placeholder = (sel.options[0] && !sel.options[0].value && !sel.options[0].textContent.includes('全部')) ? sel.options[0].textContent+'（可輸入名字搜尋）' : '輸入名字搜尋…'; };
  sel.syncPicker = syncText;
  let freq = null; // Map(driverId -> 趟數)，這個任務起點最近60天常跑的
  const loadFreq = ()=>{
    if(!opts.getOrigin) return;
    const og = opts.getOrigin();
    if(!og){ freq = null; return; }
    loadDriverOriginStats().then(map=>{ const m = new Map([...(map.get(og)||new Map())].filter(([,n])=>n>=2)); freq = m; if(list.style.display!=='none') render(); }).catch(()=>{ freq = null; });
  };
  function render(){
    const q = input.value.trim().toLowerCase();
    const filtering = q && q !== currentText().toLowerCase();
    const items = options().filter(o=> !filtering || o.text.toLowerCase().includes(q));
    const rowHtml = o=>`<div class="dpick-item" data-v="${escapeHtml(o.value)}" style="padding:7px 12px; cursor:pointer; font-size:13.5px; ${o.value===sel.value?'background:#F4F3EF;':''}">${escapeHtml(o.text)}${freq && freq.get(o.value) ? `<span style="color:var(--ink-soft); font-size:11.5px; margin-left:6px;">近60天 ${freq.get(o.value)} 趟</span>` : ''}</div>`;
    let html;
    if(freq && freq.size){
      const common = items.filter(o=>o.value && freq.has(o.value)).sort((a,b)=>freq.get(b.value)-freq.get(a.value));
      const other = items.filter(o=>!(o.value && freq.has(o.value)));
      const og = opts.getOrigin && opts.getOrigin();
      html = (common.length ? `<div style="padding:4px 12px; font-size:11.5px; color:var(--teal); background:#F4F3EF;">${escapeHtml(originLabel(og))} 常跑的夥伴</div>${common.map(rowHtml).join('')}` : '')
        + (other.length ? `<div style="padding:4px 12px; font-size:11.5px; color:var(--ink-soft); background:#F4F3EF;">${common.length?'其他夥伴':'夥伴'}</div>${other.map(rowHtml).join('')}` : '');
    } else html = items.map(rowHtml).join('');
    list.innerHTML = html || '<div style="padding:8px 12px; font-size:12.5px; color:var(--ink-soft);">找不到符合的夥伴</div>';
    list.querySelectorAll('.dpick-item').forEach(el=>{
      el.onmousedown = e=>{ e.preventDefault(); choose(el.dataset.v); };
    });
  }
  function choose(v){
    sel.value = v;
    syncText();
    list.style.display = 'none';
    sel.dispatchEvent(new Event('change'));
  }
  input.onfocus = ()=>{ loadFreq(); input.select(); render(); list.style.display = 'block'; };
  input.oninput = ()=>{ render(); list.style.display = 'block'; };
  input.onblur = ()=>{ setTimeout(()=>{ list.style.display = 'none'; syncText(); }, 120); };
  input.onkeydown = e=>{
    if(e.key==='Escape'){ list.style.display='none'; input.blur(); }
    if(e.key==='Enter'){ e.preventDefault(); const first = list.querySelector('.dpick-item'); if(first) choose(first.dataset.v); }
  };
  syncText();
  loadFreq();
}

// 算出一個通路在某區間的請款總覽資料（未稅/含稅/各任務起點總額，純資料不含畫面），
// 畫面渲染跟Excel匯出共用同一份資料，確保兩邊數字保證一致。
function computeChannelBillingReport(channelId, start, end, assignmentsList = state.data.assignments){
  const channel = state.data.channels.find(ch=>ch.id===channelId);
  if(!channel) return null;
  const segments = splitPeriodByVersionChanges(channelId, start, end);
  // 先把每段小區間的金額四捨五入到整數再往下加總，確保畫面/Excel上顯示的每一列
  // 跟「未稅/含稅合計」對得起來（不會因為先加總浮點數再四捨五入而差1元）。
  const segRows = segments.map(seg=> ({ ...seg, amount: Math.round(channelBillingTotal(channelId, seg.start, seg.end, assignmentsList).total) }));
  const tripTotal = segRows.reduce((s,x)=>s+x.amount, 0);
  const originRows = channelOriginBreakdown(channelId, start, end, assignmentsList);
  const adjustments = state.data.billingAdjustments.filter(x=>x.channelId===channelId && x.periodStart===start && x.periodEnd===end);
  const adjTotal = adjustments.reduce((s,x)=>s+x.amount, 0);
  const combined = tripTotal + adjTotal;
  const taxMode = channel.taxMode || 'inclusive';
  const grand = untaxWithTax(combined, taxMode);
  const originWithTax = originRows.map(o=> ({ ...o, ...untaxWithTax(o.amount, taxMode) }));
  return { channel, start, end, segRows, tripTotal, adjustments, adjTotal, grand, originWithTax };
}
// 多通路合併配送明細：只計入「已選通路」的店數/金額，未勾選的通路即使共用同一
// 任務也完全不會出現（避免把其他通路的請款資訊洩漏到對帳用的明細表裡）。
// 同一條路線如果連續好幾天店點組成、金額都完全相同（代表路線沒有異動），
// 會自動合併成一列「生效區間＋天數」；只有真的異動過的路線才會拆成好幾列，
// 不需要像人工作業一樣，一有異動就整個任務起點的車都重新複製一份。
function mergedRunRows(channelIds, start, end, assignmentsList = state.data.assignments){
  const rows = assignmentsList.filter(a=> a.status==='completed' && a.date>=start && a.date<=end);
  const byOriginRoute = {};
  rows.forEach(a=>{
    const route = state.data.routes.find(r=>r.id===a.routeId);
    if(!route) return;
    const fullByChannel = effectiveByChannelForAssignment(a);

    // 有星期一報價版本的路線家族：金額（fullByChannel，上面 effectiveByChannelForAssignment
    // 已經處理）跟「配送路線」內容（店點清單／店數／公里）在請款單上一律顯示星期一版本
    // 當天生效的內容，不用當天任務實際跑的店點——平日實際停靠站難免天天略有出入，
    // 沒有這步的話，同一個車次會因為內容細節不同被拆成好幾筆看起來不一樣的請款明細，
    // 即使金額其實已經是同一個數字。
    const mondayRoute = findMondayQuoteRoute(route);
    const displayRoute = (mondayRoute && mondayRoute.id !== route.id) ? mondayRoute : route;
    let displayDropPoints = a.dropPoints, displayKm = a.distanceKm;
    if(displayRoute.id !== route.id){
      const mv = getActiveVersion(displayRoute, a.date) || [...(displayRoute.versions||[])].sort((x,y)=>x.start.localeCompare(y.start)).pop();
      if(mv){
        displayDropPoints = (mv.dropPointIds||[]).map(id=> state.data.dropPoints.find(dp=>dp.id===id)).filter(Boolean);
        displayKm = mv.distanceKm;
      }
    }

    const byChannel = {}; const storeCounts = {}; let dailyTotal = 0; let relevant = false;
    channelIds.forEach(cid=>{
      const amt = Math.round(fullByChannel[cid]||0);
      const cnt = (displayDropPoints||[]).filter(dp=>dp.channelId===cid).length;
      byChannel[cid] = amt; storeCounts[cid] = cnt; dailyTotal += amt;
      if(amt>0 || cnt>0) relevant = true;
    });
    if(!relevant) return; // 這趟車跟已選通路完全無關，略過
    const addr = displayRoute.originAddr || '';
    if(!byOriginRoute[addr]) byOriginRoute[addr] = {};
    if(!byOriginRoute[addr][displayRoute.id]) byOriginRoute[addr][displayRoute.id] = { route: displayRoute, items: [] };
    const dropLabel = (displayDropPoints||[]).filter(dp=>channelIds.includes(dp.channelId)).map(dpLabel).join('➔')||'—';
    byOriginRoute[addr][displayRoute.id].items.push({ date:a.date, dropLabel, km:displayKm, storeCounts, byChannel, dailyTotal });
  });
  const byOrigin = {};
  Object.keys(byOriginRoute).forEach(addr=>{
    const routeGroups = Object.values(byOriginRoute[addr]);
    routeGroups.sort((x,y)=> (x.route.shift||'').localeCompare(y.route.shift||'') || seqSortKey(x.route.seq)-seqSortKey(y.route.seq));
    const collapsedRows = [];
    routeGroups.forEach(({route, items})=>{
      items.sort((x,y)=> x.date.localeCompare(y.date));
      let run = null;
      const flush = ()=>{ if(run) collapsedRows.push(run); run = null; };
      items.forEach(item=>{
        const sig = JSON.stringify([item.dropLabel, item.km, channelIds.map(cid=>[item.storeCounts[cid]||0, item.byChannel[cid]||0])]);
        if(run && run.sig===sig){ run.dateEnd = item.date; run.dayCount += 1; }
        else { flush(); run = { route, sig, dateStart:item.date, dateEnd:item.date, dayCount:1, dropLabel:item.dropLabel, km:item.km, storeCounts:item.storeCounts, byChannel:item.byChannel, dailyTotal:item.dailyTotal }; }
      });
      flush();
    });
    if(collapsedRows.length) byOrigin[addr] = collapsedRows;
  });
  return byOrigin;
}

// ---- Excel（.xlsx）匯出：跟畫面用同一份資料（computeChannelBillingReport／
// mergedRunRows），保證數字一致；萬一系統算錯，這份檔案可以直接在Excel裡手動修正金額。----
function addAOASheet(wb, sheetName, aoa, merges){
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  if(merges && merges.length) ws['!merges'] = merges;
  let safeName = sheetName.replace(/[\\/?*\[\]:]/g,'_').slice(0,31);
  let name = safeName, i=1;
  while(wb.SheetNames.includes(name)){ name = safeName.slice(0,28) + '_' + (++i); }
  XLSX.utils.book_append_sheet(wb, ws, name);
}
function buildChannelSummarySheet(wb, report){
  const { channel, start, end, segRows, adjustments, grand, originWithTax } = report;
  const aoa = [];
  aoa.push(['信興行銷有限公司']);
  aoa.push([`${channel.name}｜物流費用請款總覽（${start}~${end}）`]);
  aoa.push(['請款期間','物流費']);
  segRows.forEach(s=> aoa.push([`${s.start}~${s.end}`, s.amount]));
  adjustments.forEach(x=> aoa.push([x.note, x.amount]));
  aoa.push(['未稅合計', grand.untaxed]);
  aoa.push(['稅額', grand.tax]);
  aoa.push(['含稅合計', grand.withTax]);
  aoa.push([]);
  aoa.push(['各區費用總覽（依供應商／任務起點）']);
  aoa.push(['供應商','任務數','配送店次','未稅','稅額','含稅']);
  originWithTax.forEach(o=> aoa.push([originLabel(o.originAddr), o.tripCount, o.storeCount, o.untaxed, o.tax, o.withTax]));
  const merges = [{ s:{r:0,c:0}, e:{r:0,c:5} }, { s:{r:1,c:0}, e:{r:1,c:5} }, { s:{r:aoa.findIndex(r=>r[0]==='各區費用總覽（依供應商／任務起點）'), c:0}, e:{r:aoa.findIndex(r=>r[0]==='各區費用總覽（依供應商／任務起點）'), c:5} }];
  addAOASheet(wb, `${channel.name}請款總覽`, aoa, merges);
}
function buildMergedDetailSheets(wb, channelIds, mergedByOrigin, start, end){
  const channelNamesJoined = channelIds.map(channelName).join('、');
  Object.keys(mergedByOrigin).forEach(addr=>{
    const list = mergedByOrigin[addr];
    const dAoa = [];
    dAoa.push([`${originLabel(addr)}｜配送明細（${start}~${end}，已選通路：${channelNamesJoined}）`]);
    dAoa.push(['生效區間','天數','時段','車次','配送路線', ...channelIds.map(cid=>`${channelName(cid)}店數`), '總店數','公里','單日總金額', ...channelIds.map(cid=>`${channelName(cid)}佔比`), '期間合計', ...channelIds.map(cid=>`${channelName(cid)}請款`)]);
    list.forEach(r=>{
      const totalStores = channelIds.reduce((s,cid)=> s+(r.storeCounts[cid]||0), 0);
      const storeCounts = channelIds.map(cid=> r.storeCounts[cid]||0);
      const pcts = channelIds.map(cid=> r.dailyTotal? Number(((r.byChannel[cid]||0)/r.dailyTotal*100).toFixed(1)) : 0);
      const periodAmts = channelIds.map(cid=> Math.round((r.byChannel[cid]||0)*r.dayCount));
      const period = r.dateStart===r.dateEnd ? r.dateStart : `${r.dateStart}~${r.dateEnd}`;
      dAoa.push([period, r.dayCount, r.route.shift==='AM'?'上午':'下午', seqToR(stripWeekdayLabel(r.route.seq)), r.dropLabel, ...storeCounts, totalStores, r.km??'', Math.round(r.dailyTotal), ...pcts, Math.round(r.dailyTotal*r.dayCount), ...periodAmts]);
    });
    addAOASheet(wb, `${originLabel(addr)}配送明細`, dAoa, [{ s:{r:0,c:0}, e:{r:0,c:dAoa[1].length-1} }]);
  });
}
// channelIds 只有一個時，該通路的總覽沿用抓取範圍(start~end)；勾選多個通路時，
// 每個通路的總覽改用自己在「通路管理」設定的週期（自然月／自訂區間），
// 不會被抓取範圍污染——跟畫面渲染的 ownPeriodFor() 邏輯保持一致。
function exportBillingExcel(channelIds, monthStr, start, end, assignmentsList = state.data.assignments){
  const wb = XLSX.utils.book_new();
  channelIds.forEach(cid=>{
    const channel = state.data.channels.find(ch=>ch.id===cid);
    if(!channel) return;
    const own = channelIds.length===1 ? {start, end} : defaultPeriod(channel, monthStr);
    const report = computeChannelBillingReport(cid, own.start, own.end, assignmentsList);
    if(report) buildChannelSummarySheet(wb, report);
  });
  const merged = mergedRunRows(channelIds, start, end, assignmentsList);
  buildMergedDetailSheets(wb, channelIds, merged, start, end);
  XLSX.writeFile(wb, `請款單_${start}_${end}.xlsx`);
}
function renderBilling(c){

    <div class="panel">
      <div class="field">

        <div class="field"><label>對應月份（各通路的請款總覽會自動套用自己的週期）</label><input id="bMonth" type="month" value="${month}"></div>
        <div class="field"><label>抓取範圍起（可調整；只勾一個通路時＝該通路自己的週期）</label><input id="bStart" type="date"></div>
        <div class="field"><label>抓取範圍迄（可調整；只勾一個通路時＝該通路自己的週期）</label><input id="bEnd" type="date"></div>
      </div>
    </div>
    <div class="panel">
      <h3 style="margin-top:0;">例外調整（人工加註的備註與金額，會併入該通路請款單總額）</h3>
      <div class="grid3">
        <div class="field"><label>調整項通路</label><select id="baChannel">${state.data.channels.map(ch=>`<option value="${ch.id}">${ch.name}</option>`).join('')}</select></div>
        <div class="field"><label>發生日期</label><input id="baDate" type="date"></div>

      <div class="field"><label>備註</label><input id="baNote" placeholder="例如：久陽一車未出車"></div>
      <button class="btn ghost" id="addBillingAdj">新增調整項</button>
      <div id="billingAdjList" style="margin-top:8px;"></div>
    </div>
    <div id="billingResult"></div>`;
  function checkedChannelIds(){ return Array.from(document.querySelectorAll('.bChCheck:checked')).map(cb=>cb.value); }
  // 例外調整永遠自動歸入「調整項通路」自己在通路管理設定的請款週期（不是
  // 畫面上方那組給合併明細用的抓取範圍），使用者只需要填「發生日期」（單一
  // 天，不是區間）方便日後查看，實際存檔的 periodStart/periodEnd 是自動算的。
  function adjChannelPeriod(){
    const channelId = document.getElementById('baChannel').value;
    const channel = state.data.channels.find(ch=>ch.id===channelId);
    const monthStr = document.getElementById('bMonth').value;
    return channel ? defaultPeriod(channel, monthStr) : null;
  }
  function refreshAdjList(){
    const channelId = document.getElementById('baChannel').value;
    const period = adjChannelPeriod();
    if(!period){ document.getElementById('billingAdjList').innerHTML = '<div class="empty">請先選擇對應月份</div>'; return; }
    const list = state.data.billingAdjustments.filter(x=>x.channelId===channelId && x.periodStart===period.start && x.periodEnd===period.end);
    document.getElementById('billingAdjList').innerHTML = list.length ? `<table><thead><tr><th>備註</th><th>金額</th><th></th></tr></thead><tbody>${list.map(x=>`<tr><td>${x.note}</td><td class="amount">${x.amount>=0?'+':''}$${money(x.amount)}</td><td class="no-print"><button class="btn danger" data-deladj="${x.id}">刪除</button></td></tr>`).join('')}</tbody></table>` : '<div class="empty">此週期尚無例外調整</div>';
    document.getElementById('billingAdjList').querySelectorAll('[data-deladj]').forEach(btn=>{
      btn.onclick = async ()=>{
        const adj = list.find(x=>x.id===btn.dataset.deladj);
        if(!confirm(`確定要刪除這筆請款例外調整嗎（${adj?.note||'無備註'}，${adj&&adj.amount>=0?'+':''}$${money(adj?.amount||0)}）？刪除後會影響這個通路這期的請款總額，無法復原。`)) return;

    });

  document.getElementById('addBillingAdj').onclick = async ()=>{
    const channelId = document.getElementById('baChannel').value;
    const period = adjChannelPeriod();
    const dateVal = document.getElementById('baDate').value;
    const noteVal = document.getElementById('baNote').value.trim();

    if(!period){ alert('請先選擇對應月份'); return; }
    if(!dateVal || !noteVal || !amount){ alert('請填寫發生日期、備註與金額'); return; }
    const d = new Date(dateVal+'T00:00:00');
    const note = `${d.getMonth()+1}/${d.getDate()} ${noteVal}`;
    try{
      await createBillingAdjustment({ channelId, periodStart:period.start, periodEnd:period.end, note, amount });

      refreshAdjList(); refresh();
    }catch(err){ alert(err.message); }
  };
  document.getElementById('baChannel').onchange = refreshAdjList;
  // 通路自己的請款總覽（未稅/含稅合計）永遠套用「通路管理」裡設定的自己週期
  // 去算，只有勾選單一通路時，才會直接沿用共用的「區間起訖」欄位（維持原本
  // 可手動調整單一通路週期的彈性）。多選通路時，共用的「區間起訖」欄位改成
  // 只決定「抓取範圍」──要夠寬才能同時涵蓋每個已選通路各自的區間，讓合併
  // 配送明細表看得到全部相關任務；預設值會自動抓所有已選通路週期的聯集
  // （最早的起始日～最晚的結束日）。
  function ownPeriodFor(channelId, monthStr, channelIds, sharedStart, sharedEnd){
    const channel = state.data.channels.find(ch=>ch.id===channelId);
    if(!channel) return null;
    if(channelIds.length===1) return { start:sharedStart, end:sharedEnd };
    return defaultPeriod(channel, monthStr);
  }
  async function refresh(){
    const channelIds = checkedChannelIds();
    state._billingChannelIds = channelIds;
    const monthStr = document.getElementById('bMonth').value;
    state._billingMonth = monthStr;
    const startInput = document.getElementById('bStart'), endInput = document.getElementById('bEnd');
    if(!startInput.value || !endInput.value){
      const relevantChannels = (channelIds.length ? channelIds.map(cid=>state.data.channels.find(ch=>ch.id===cid)) : [state.data.channels[0]]).filter(Boolean);
      const periods = relevantChannels.map(ch=> defaultPeriod(ch, monthStr));
      if(periods.length){
        const unionStart = periods.reduce((s,p)=> (s===null||p.start<s)?p.start:s, null);
        const unionEnd = periods.reduce((s,p)=> (s===null||p.end>s)?p.end:s, null);
        if(!startInput.value) startInput.value = unionStart;
        if(!endInput.value) endInput.value = unionEnd;
      }
    }
    const start = startInput.value, end = endInput.value; // 抓取範圍（合併配送明細用）
    // 這個畫面只讀不寫，直接跟資料庫要這段區間的任務，不碰共用的
    // state.data.assignments——查完這個函式結束就丟，不管查的區間多大、
    // 查幾次，都不會累積佔用記憶體、拖慢其他畫面。
    if(start && end){
      document.getElementById('billingResult').innerHTML = '<div class="panel"><div class="empty">載入中...</div></div>';
      try{ billingAssignments = await fetchAssignmentsInRange(start, end); }
      catch(err){ document.getElementById('billingResult').innerHTML = `<div class="panel"><div class="empty">${err.message}</div></div>`; return; }
      if(startInput.value!==start || endInput.value!==end) return; // 使用者可能已經改了區間
    }
    refreshAdjList();
    if(!channelIds.length){
      document.getElementById('billingResult').innerHTML = '<div class="panel"><div class="empty">請至少勾選一個通路</div></div>';
      return;
    }
    const reports = channelIds.map(cid=>{
      const own = ownPeriodFor(cid, monthStr, channelIds, start, end);
      return own ? computeChannelBillingReport(cid, own.start, own.end, billingAssignments) : null;
    }).filter(Boolean);
    const merged = mergedRunRows(channelIds, start, end, billingAssignments);
    document.getElementById('billingResult').innerHTML = `
      <div id="billingPrintArea">
        <h2 style="text-align:center; margin:0 0 14px;">信興行銷有限公司</h2>
        ${reports.map(channelSummaryPanelHtml).join('')}
        <div class="panel">
          <h3 style="margin-top:0;">配送明細（已選通路：${reports.map(r=>r.channel.name).join('、')}）</h3>
          ${mergedRunDetailTableHtml(channelIds, merged)}
        </div>
      </div>
      <div class="no-print" style="margin-top:10px; display:flex; gap:8px;">
        <button class="btn amber" id="printBilling">產生請款單（列印/另存PDF）</button>
        <button class="btn ghost" id="exportBillingXlsx">下載Excel（.xlsx，可手動調整金額）</button>
      </div>`;
    document.getElementById('printBilling').onclick = ()=> exportPanelPrint(document.getElementById('billingPrintArea'), `請款單_${start}_${end}`, '');
    document.getElementById('exportBillingXlsx').onclick = ()=> exportBillingExcel(channelIds, monthStr, start, end, billingAssignments);
  }
  document.querySelectorAll('.bChCheck').forEach(cb=> cb.onchange = ()=>{ document.getElementById('bStart').value=''; document.getElementById('bEnd').value=''; refresh(); });
  document.getElementById('bMonth').onchange = ()=>{ document.getElementById('bStart').value=''; document.getElementById('bEnd').value=''; refresh(); };
  document.getElementById('bStart').onchange = refresh;
  document.getElementById('bEnd').onchange = refresh;
  refresh();
}

function usageBarHtml(label, usedBytes, limitBytes, note){
  if(usedBytes==null){
    return `<div style="margin-bottom:12px;"><div style="display:flex; justify-content:space-between; font-size:12.5px;"><strong>${label}</strong><span style="color:var(--ink-soft);">無法取得</span></div></div>`;
  }
  const pct = Math.min(100, usedBytes/limitBytes*100);
  const barColor = pct>=90 ? 'var(--danger)' : pct>=70 ? 'var(--amber)' : 'var(--teal)';
  return `<div style="margin-bottom:12px;">
    <div style="display:flex; justify-content:space-between; font-size:12.5px;">
      <strong>${label}</strong>
      <span>${formatBytes(usedBytes)} / ${formatBytes(limitBytes)}（${pct.toFixed(1)}%）</span>
    </div>
    <div style="background:var(--border); border-radius:4px; height:8px; margin-top:4px; overflow:hidden;">
      <div style="background:${barColor}; height:100%; width:${pct}%;"></div>
    </div>
    ${note?`<p style="font-size:11px; color:var(--ink-soft); margin:4px 0 0;">${note}</p>`:''}
  </div>`;
}
function formatBytes(bytes){
  if(bytes==null) return '無法取得';
  const mb = bytes/1024/1024;
  return mb<1024 ? `${mb.toFixed(1)} MB` : `${(mb/1024).toFixed(2)} GB`;
}

        <a class="btn ghost" href="https://supabase.com/dashboard/project/rcdvclfvqnrvffxkseqh/settings/billing/usage" target="_blank" rel="noopener" style="text-decoration:none; display:inline-block;">前往 Supabase 後台查看流量用量</a>
      </div>
    </div>
    <div class="panel">
      <h3 style="margin-top:0;">資料備份</h3>
      <p class="section-sub">Supabase 免費方案沒有自動備份機制，建議定期用下面的方式手動備份一份。</p>
      <button class="btn ghost" id="exportAllData">下載目前資料快照（JSON）</button>

    body.innerHTML = `
      ${usageBarHtml('資料庫大小', dbSizeBytes, 500*1024*1024)}
      ${usageBarHtml('檔案儲存空間', storageTotalBytes, 1024*1024*1024, bucketLines)}

    const body = document.getElementById('usageStatsBody');
    if(body) body.innerHTML = `<div class="empty">用量資料載入失敗：${err.message}</div>`;
  });
  document.getElementById('savePin').onclick = async ()=>{

    if(!pin){ alert('PIN碼不能空白'); return; }
    try{ await updateAdminPin(pin); alert('已更新主控PIN碼。'); }
    catch(err){ alert(err.message); }
  };
  document.getElementById('showBackupText').onclick = ()=>{
    const ta = document.getElementById('backupTextArea');
    ta.value = JSON.stringify(state.data);
    ta.style.display = 'block';
    ta.focus(); ta.select();
    recordBackupDone();
    alert('已顯示備份文字並自動選取，請用手機的「複製」功能（長按選取範圍會出現複製選項）複製後貼到記事本或LINE保存。');
  };
  document.getElementById('exportAllData').onclick = ()=>{
    const json = JSON.stringify(state.data, null, 2);
    const blob = new Blob([json], { type: 'application/json' });

    const a = document.createElement('a');
    a.href = url;
    a.download = `碳金Hub系統備份_${todayStr()}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);

  };
}

function renderExport(c){
  c.innerHTML = `
    <h2 class="section-title">資料匯出與封存</h2>
    <p class="section-sub">設定區間，先預覽並可列印/另存PDF，確認備份後再執行刪除，釋放系統資料量。</p>
    <div class="panel">
      <div class="grid3">
        <div class="field"><label>資料類型</label>
          <select id="exType"><option value="assignments">任務／班表紀錄</option><option value="adjustments">薪資調整項</option><option value="routeVersions">路線管理（歷史版本）</option></select>
        </div>
        <div class="field" id="exStartField"><label>起始日期</label><input id="exStart" type="date"></div>
        <div class="field" id="exEndField"><label>結束日期</label><input id="exEnd" type="date"></div>
      </div>
      <p class="section-sub" id="exTypeHint" style="display:none;"></p>
      <button class="btn ghost" id="exPreview">預覽區間資料</button>
    </div>
    <div id="exResult"></div>
  `;
  document.getElementById('exType').onchange = ()=>{
    const isRouteVersions = document.getElementById('exType').value==='routeVersions';
    document.getElementById('exTypeHint').style.display = isRouteVersions ? '' : 'none';
    document.getElementById('exTypeHint').textContent = isRouteVersions ? '只列出「已經被新版本取代」的舊版本（依版本結束日判斷是否落在區間內），目前生效中的版本不會出現在這裡、也不會被刪除。' : '';
  };
  // 每一條路線的歷史版本（route_versions裡end不是null的，代表已被新版本
  // 取代），攤平成一筆一筆方便依「版本結束日」篩選區間、預覽、匯出、
  // 確認備份後刪除釋放資料量——跟任務/薪資調整項同一套流程，只是資料
  // 來源是route裡的versions陣列，不是獨立的table直接查。
  function allClosedRouteVersions(){
    const rows = [];
    state.data.routes.forEach(route=>{
      route.versions.forEach(v=>{
        if(v.end) rows.push({ ...v, routeId: route.id, routeName: routeDisplayName(route.name) });
      });
    });
    return rows;
  }
  function getMatched(assignmentsList){
    const type = document.getElementById('exType').value;
    const start = document.getElementById('exStart').value;
    const end = document.getElementById('exEnd').value;
    if(!start || !end) return {type, start, end, rows:[]};
    if(type==='assignments'){
      return {type, start, end, rows: (assignmentsList||[]).filter(a=>a.date>=start && a.date<=end)};
    } else if(type==='routeVersions'){
      return {type, start, end, rows: allClosedRouteVersions().filter(v=>v.end>=start && v.end<=end)};
    } else {
      return {type, start, end, rows: state.data.adjustments.filter(a=>a.month >= start.slice(0,7) && a.month <= end.slice(0,7))};
    }
  }
  document.getElementById('exPreview').onclick = async ()=>{
    const preType = document.getElementById('exType').value;
    const preStart = document.getElementById('exStart').value;
    const preEnd = document.getElementById('exEnd').value;
    if(!preStart || !preEnd){ alert('請選擇起訖日期'); return; }
    // 任務／班表紀錄這裡是唯一需要任意查回更久以前資料的地方（匯出封存的
    // 目的就是處理舊資料），直接跟資料庫要這段區間，不影響/不依賴共用的
    // state.data.assignments，查完這個函式結束就丟，不會佔用記憶體。
    let exAssignments;
    if(preType==='assignments'){
      document.getElementById('exResult').innerHTML = '<div class="panel"><div class="empty">載入中...</div></div>';
      try{ exAssignments = await fetchAssignmentsInRange(preStart, preEnd); }
      catch(err){ document.getElementById('exResult').innerHTML = `<div class="panel"><div class="empty">${err.message}</div></div>`; return; }
      if(document.getElementById('exStart')?.value!==preStart || document.getElementById('exEnd')?.value!==preEnd) return; // 使用者可能已經改了區間
    }
    const {type, start, end, rows} = getMatched(exAssignments);
    document.getElementById('exResult').innerHTML = `
      <div class="panel">
        <h3 style="margin-top:0;">預覽：${start} ~ ${end}（共 ${rows.length} 筆）</h3>
        <table>
          ${type==='assignments' ? `
            <thead><tr><th>日期</th><th>路線</th><th>夥伴</th><th>車資</th><th>狀態</th></tr></thead>
            <tbody>${rows.map(a=>`<tr><td>${a.date}</td><td>${routeName(a.routeId)}</td><td>${driverName(a.driverId)}</td><td class="amount">$${money(a.fare)}</td><td>${a.status==='completed'?'已完成':'排定中'}</td></tr>`).join('') || '<tr><td colspan="5"><div class="empty">此區間無資料</div></td></tr>'}
          ` : type==='routeVersions' ? `
            <thead><tr><th>路線</th><th>生效區間</th><th>里程</th><th>夥伴費用</th><th>請款總額</th><th>店點（當時）</th></tr></thead>
            <tbody>${rows.map(v=>{
              const pts = (v.dropPointIds||[]).map(id=>{ const dp = state.data.dropPoints.find(x=>x.id===id); return dp ? dpLabel(dp) : '（已刪除的店點）'; }).join('、') || '—';
              return `<tr><td>${escapeHtml(v.routeName)}</td><td>${v.start} ~ ${v.end}</td><td>${v.distanceKm??'—'}km</td><td class="amount">$${money(v.driverFare||0)}</td><td class="amount">$${money(v.billingTotal||0)}</td><td style="font-size:12px;">${pts}</td></tr>`;
            }).join('') || '<tr><td colspan="6"><div class="empty">此區間無資料</div></td></tr>'}
          ` : `
            <thead><tr><th>月份</th><th>夥伴</th><th>類型</th><th>金額</th><th>備註</th></tr></thead>
            <tbody>${rows.map(a=>`<tr><td>${a.month}</td><td>${driverName(a.driverId)}</td><td>${adjTypeLabel(a.type)}</td><td class="amount">$${money(a.amount)}</td><td>${a.note||'—'}</td></tr>`).join('') || '<tr><td colspan="5"><div class="empty">此區間無資料</div></td></tr>'}
          `}
        </table>
        <div class="no-print" style="margin-top:10px; display:flex; gap:8px;">
          <button class="btn ghost" id="exPrint">列印/另存PDF</button>
          <button class="btn danger" id="exDelete" ${rows.length?'':'disabled'}>確認已匯出，刪除此區間資料</button>
        </div>
      </div>`;
    document.getElementById('exPrint').onclick = ()=> exportPanelPrint(document.getElementById('exPrint').closest('.panel'), `資料匯出_${start}_${end}`);
    const delBtn = document.getElementById('exDelete');
    if(delBtn) delBtn.onclick = async ()=>{
      if(!confirm('確定已完成PDF匯出／備份？此動作將永久刪除此區間資料，無法復原。')) return;
      try{
        const ids = rows.map(r=>r.id);
        if(type==='assignments') await bulkDeleteAssignments(ids);
        else if(type==='routeVersions') await bulkDeleteRouteVersions(ids);
        else await bulkDeleteAdjustments(ids);
        document.getElementById('exResult').innerHTML = '<div class="note">已刪除該區間資料。</div>';
      }catch(err){ alert(err.message); }
    };
  };
}

// ---------- 夥伴端：今日任務（預設畫面） ----------
// 上午永遠排在下午前面——不管實際建立任務的順序（週期任務清單怎麼異動、
// 哪個先建立），同一天同時有上午跟下午的車次時，畫面上一律上午在上。
function assignmentShiftKey(a){
  const route = state.data.routes.find(r=>r.id===a.routeId);
  return route?.shift==='PM' ? 1 : 0;
}
function renderToday(c){
  const dId = state.activeDriverId;
  const today = todayStr();
  const todays = state.data.assignments.filter(a=>a.driverId===dId && a.published!==false && a.date===today && a.status!=='completed')
    .sort((a,b)=> assignmentShiftKey(a)-assignmentShiftKey(b));
  const weekDates = [...getWeekDates(0), ...getWeekDates(1)];
  c.innerHTML = `
    <h2 class="section-title">今日任務</h2>
    <p class="section-sub">Hi~${driverName(dId)}，這是您今日任務。${todayHolidayGreeting(dId)?` ${todayHolidayGreeting(dId)}`:''}</p>
    <div id="todayDetail"></div>
    <h3 style="margin-top:20px;">本週任務總覽</h3>
    <p class="section-sub" style="margin-top:-6px;">點擊「待完成」的任務可預覽當天行程與報酬。</p>
    <div class="schedule-list">${(()=>{
      const dayName = d=> `${d.slice(5).replace('-','/')}（${WEEKDAY_ZH[(new Date(d+'T00:00:00').getDay()+6)%7]}）`;
      const tasksOf = d=> state.data.assignments.filter(a=>a.driverId===dId && a.published!==false && a.date===d).sort((a,b)=> assignmentShiftKey(a)-assignmentShiftKey(b));
      const st = a=> a.status==='completed' ? '<span class="sl-st done">✓ 已完成</span>' : a.status==='in_progress' ? '<span class="sl-st run">● 執行中</span>' : '<span class="sl-st wait">○ 待完成</span>';
      const row = a=> `<div class="sl-row" ${a.status==='scheduled'?`data-previewtrip="${a.id}" style="cursor:pointer;"`:''}><strong>${routeName(a.routeId)}</strong>${st(a)}</div>`;
      const thisWeek = getWeekDates(0), nextWeek = getWeekDates(1);
      let html = '';
      // 本週已過去的日子：收成一行，點開才看（詳細紀錄在「歷史任務」）。
      const pastTasks = thisWeek.filter(d=>d<today).flatMap(d=>tasksOf(d).map(a=>({d,a})));
      // 同一天的任務放在同一個日期底下（日期只出現一次）。
      const pastDays = [...new Set(pastTasks.map(x=>x.d))];
      if(pastTasks.length) html += `<details class="sl-past"><summary>本週已過去的任務 ${pastTasks.length} 項 ▸</summary>${pastDays.map(d=>`<div class="sl-day"><div class="sl-day-label">${dayName(d)}</div><div class="sl-rows">${pastTasks.filter(x=>x.d===d).map(x=>row(x.a)).join('')}</div></div>`).join('')}</details>`;
      const renderRange = dates=>{
        let out = '', emptyRun = [];
        const flush = ()=>{ if(!emptyRun.length) return; out += `<div class="sl-empty">${emptyRun.length===1?dayName(emptyRun[0]):`${emptyRun[0].slice(5).replace('-','/')}～${emptyRun[emptyRun.length-1].slice(5).replace('-','/')}`}　無任務</div>`; emptyRun = []; };
        dates.forEach(d=>{
          const items = tasksOf(d);
          if(!items.length){ emptyRun.push(d); return; }
          flush();
          out += `<div class="sl-day ${d===today?'today':''}"><div class="sl-day-label">${dayName(d)}${d===today?'・今天':''}</div><div class="sl-rows">${items.map(row).join('')}</div></div>`;
        });
        flush();
        return out;
      };
      const thisUpcoming = thisWeek.filter(d=>d>=today);
      if(thisUpcoming.length) html += renderRange(thisUpcoming);
      // 今天不在本週清單（理論上不會）時也要有今天標示，這裡不另外處理。
      const nextHasTasks = nextWeek.some(d=>tasksOf(d).length);
      // 下週：有已發佈的任務才顯示，沒有就整段不出現。
      if(nextHasTasks) html += `<div class="sl-sub">下週</div>` + renderRange(nextWeek);
      return html;
    })()}</div>
    <div class="schedule-grid">
      ${weekDates.map(d=>{
        const items = state.data.assignments.filter(a=>a.driverId===dId && a.published!==false && a.date===d)
          .sort((a,b)=> assignmentShiftKey(a)-assignmentShiftKey(b));
        return `<div class="day-card"><div class="day-label">${d.slice(5)}（星期${WEEKDAY_ZH[(new Date(d+'T00:00:00').getDay()+6)%7]}）${d===today?'・今天':''}</div>
          ${items.map(a=>`<div class="trip-chip ${a.status==='completed'?'locked':''}" ${a.status==='scheduled'?`data-previewtrip="${a.id}" style="cursor:pointer;"`:''}><strong>${routeName(a.routeId)}</strong><br>${a.status==='completed'?'<span class="badge locked">已完成</span>':a.status==='in_progress'?'<span class="badge progress">執行中</span>':'<span class="badge pending">待完成</span>'}</div>`).join('') || '<div style="color:var(--ink-soft);font-size:11px;">無任務</div>'}
        </div>`;
      }).join('')}
    </div>
    <div id="weekTripModal"></div>
  `;
  c.querySelectorAll('[data-previewtrip]').forEach(chip=>{
    chip.onclick = ()=> openWeekTripPreview(chip.dataset.previewtrip);
  });
  renderTodayDetail(todays);
}
// 本週任務總覽裡「待完成」的車次點擊後預覽當天行程與夥伴費用——單純預覽，
// 任務還沒開始，不提供拍照/完成等操作（那些要等到當天在「今日任務」才會出現）。

      <div class="modal-box" style="max-width:480px;">
        <div class="toolbar"><h3 style="margin:0;">${routeName(a.routeId)}</h3><button class="btn ghost" id="closeWeekTrip">關閉</button></div>
        <p style="font-size:12.5px; color:var(--ink-soft); margin:0 0 8px;">${a.date}（星期${['日','一','二','三','四','五','六'][new Date(a.date+'T00:00:00').getDay()]}）</p>
        <p style="font-size:12.5px;">任務起點：${a.origin||'—'} ${(()=>{ const link = buildMultiStopMapsLink(a.origin, ownDropPoints(a)); return link ? `<a class="link" href="${link}" target="_blank">開啟多點導航</a>` : ''; })()}</p>
        <h3 style="margin:0 0 8px;">報酬：$${money(tripPay(a))}</h3>

// 夥伴自己的店點：交給支援夥伴的店點不再出現在原夥伴的畫面（任務明細、導航、LINE 提醒、完成判斷都不含）。
function ownDropPoints(a){ return (a.dropPoints||[]).filter(dp=>!dp.helperId); }
function renderTodayDetail(todays){

  const supportToday = state.data.assignments.filter(a=>a.isSupport && a.date===todayStr());
  if(!todays.length && !supportToday.length){ box.innerHTML = '<div class="empty">今天沒有排定任務</div>'; return; }
  // 一個店點一列（狀態、拍照／上傳／導航按鈕、未完成原因）；readonly＝已交給支援夥伴，原夥伴只看狀態不能再動。
  const dpRow = (a, dp, readonly)=>{

    const statusBadge = dp.status==='completed'

            ${dp.status!=='completed' && dp.issueReason ? `<span class="badge" style="background:#F4E3C1; color:#7A5A00;">未完成：${dp.issueReason}</span>` : ''}

              <button type="button" class="btn ghost" style="flex:1; min-width:110px; margin:0;" data-photo="${a.id}|${dp.id}">拍照上傳</button>
              <input type="file" accept="image/*" capture="environment" data-photofallback="${a.id}|${dp.id}" style="display:none;">

              <input type="file" accept="image/*" multiple data-photolibinput="${a.id}|${dp.id}" style="display:none;">

            </div>

              </select>
            </div>` : ''}`}
          </div>`;
  };
  // 自己當天有任務時，支援的店點直接併進自己的那一台車（用藍框區塊標示「支援」）；當天沒有自己的任務才用獨立卡片。
  const supBlock = s=>`<div style="margin:10px 0; padding:8px; border:2px solid #2F6EA5; border-radius:8px;">
      <div style="font-size:12.5px; font-weight:700; color:#2F6EA5; margin-bottom:4px;">支援：${routeName(s.routeId)}（原夥伴：${escapeHtml(s.originalDriverName||'—')}）${s.dropPoints.length}個店點，直接拍照上傳即可</div>
      ${s.dropPoints.map(dp=>dpRow(s, dp, false)).join('')}
    </div>`;
  const supportHtml = supportToday.map(a=>`<div class="panel" style="border-color:#2F6EA5; border-width:2px;">
      <div class="toolbar"><strong>支援：${routeName(a.routeId)}</strong><span class="badge" style="background:#E3EEF7; color:#2F6EA5;">原夥伴：${escapeHtml(a.originalDriverName||'—')}</span></div>
      <p style="font-size:12.5px; color:var(--ink-soft);">這是臨時交給您支援的店點（${a.dropPoints.length} 個），到店後直接拍照上傳即可，不需要再傳給原夥伴。完成後原夥伴會自動看到。</p>
      ${a.dropPoints.map(dp=>dpRow(a, dp, false)).join('')}
    </div>`).join('');
  box.innerHTML = todays.map(a=>{
    const mine = ownDropPoints(a);
    const allHandled = mine.length>0 && mine.every(dp=>dp.status==='completed' || dp.issueReason);
    return `<div class="panel">
      <div class="toolbar">
        <strong>${routeName(a.routeId)}</strong>
        <span>
          ${a.status==='scheduled'?'<span class="badge pending">尚未開始</span>':a.status==='in_progress'?'<span class="badge progress">執行中</span>':''}
          <a class="btn ghost" href="${lineShareLink(`【任務提醒】${a.date} ${routeName(a.routeId)}\n任務起點：${a.origin||'—'}\n店點：${mine.map(dpLabel).join('、')||'尚未建立'}`)}" target="_blank" style="text-decoration:none; display:inline-block;">分享至LINE</a>
        </span>
      </div>
      <p style="font-size:12.5px;">任務起點：${a.origin||'—'} ${(()=>{ const link = buildMultiStopMapsLink(a.origin, mine); return link ? `<a class="link" href="${link}" target="_blank">開啟多點導航</a>` : ''; })()}</p>
      ${a===todays[0] ? supportToday.map(supBlock).join('') : ''}
      ${a.status==='scheduled' ? `<button class="btn amber" data-start="${a.id}">開始任務</button>` : `
        ${mine.map(dp=>dpRow(a, dp, false)).join('')}
        <button class="btn amber" style="margin-top:10px;" data-finish="${a.id}">完成任務（自動封存進歷史任務）</button>
        ${!allHandled?'<p style="font-size:11.5px;color:var(--ink-soft);">尚有店點未完成拍照或未選擇未完成原因，結束時需填寫備註說明原因</p>':''}
      `}
    </div>`;
  }).join('') + (todays.length ? '' : supportHtml);
  // 照片改成跟歷史任務一樣，點擊「已完成」才載入——手機背景切換常把頁面砍掉
  // 重開，之前「一開頁面就自動載入當天所有已完成照片」會讓同一批照片被
  // 重複下載很多次，是 Storage 流量爆量的主因之一。
  const dpById = {};
  [...todays, ...supportToday].forEach(a=> a.dropPoints.forEach(dp=> dpById[dp.id]=dp));
  box.querySelectorAll('[data-dpid]').forEach(el=>{
    const dp = dpById[el.dataset.dpid];
    const urls = dp ? dpPhotoUrls(dp) : [];
    if(urls.length) el.querySelector('[data-viewphoto]').onclick = ()=> openPhotoLightbox(urls);
  });
  box.querySelectorAll('[data-start]').forEach(btn=>{
    btn.onclick = async ()=>{
      try{ await markAssignmentDeparted(btn.dataset.start); renderContent(); }
      catch(err){ alert(err.message); }
    };
  });
  box.querySelectorAll('[data-finish]').forEach(btn=>{
    btn.onclick = async ()=>{
      const a = state.data.assignments.find(x=>x.id===btn.dataset.finish);
      const allHandled = ownDropPoints(a).length>0 && ownDropPoints(a).every(dp=>dp.status==='completed' || dp.issueReason);
      let issueNote;
      if(!allHandled){
        const note = prompt('尚有店點未完成拍照、也沒有選擇未完成原因，請說明原因（此備註主控端會看到）：');
        if(note===null) return;
        if(!note.trim()){ alert('請填寫備註原因'); return; }
        issueNote = note.trim();
      }
      try{ await markAssignmentComplete(a.id, issueNote); renderContent(); }
      catch(err){ alert(err.message); }
    };
  });
  // 「拍照上傳」跟「上傳照片」兩顆按鈕共用同一套「填下一格」邏輯：一個
  // 店點最多3格照片，第1格是主要送達證明照（決定這個點是否算已完成），
  // 第2、3格是附加照片。不管是先按拍照還是先用相簿上傳、按第幾次，都是
  // 「填下一個還空著的格子」，沒有「重新拍照＝覆蓋」這種概念了——按鈕
  // 名稱/行為固定，同一顆「拍照上傳」按第一次拍主要照片，再按同一顆按
  // 鈕拍第二、第三張，都是往後補上附加照片，直到補滿3格按鈕才會消失
  // （見上面模板 photoCount<3 的判斷）。
  async function fillNextPhotoSlot(aid, dpid, dataUrl){
    const dp = state.data.assignments.find(x=>x.id===aid)?.dropPoints.find(x=>x.id===dpid);
    if(dp && dp.status!=='completed') await uploadDropPointPhoto(aid, dpid, dataUrl);
    else await handleExtraMediaUpload(aid, dpid, [dataUrl]);
  }
  // 拍照按鈕改成自己拉相機串流（openCameraCapture/capturePhoto，見上面
  // compressImageFile旁邊的說明），不再依賴 input[capture] ——那個屬性在
  // Android上很不可靠，很多系統/瀏覽器版本即使寫了 capture="environment"
  // 還是會跳系統相簿選擇器，不是我們程式碼的問題，是瀏覽器不理它。真的
  // 拿不到相機權限或裝置不支援時，才退回旁邊那顆隱藏的 input[capture]
  // 讓夥伴至少還能選一張既有照片，不會整個卡住。
  box.querySelectorAll('[data-photo]').forEach(btn=>{
    const [aid, dpid] = btn.dataset.photo.split('|');
    const fallbackInput = box.querySelector(`[data-photofallback="${aid}|${dpid}"]`);
    async function goMany(dataUrls){
      try{
        for(const dataUrl of dataUrls) await fillNextPhotoSlot(aid, dpid, dataUrl);
        renderContent();
      }catch(err){ console.error('照片處理失敗', err); alert('照片處理失敗：'+err.message+'\n請重新拍攝再試一次。'); }
    }
    btn.onclick = ()=>{
      const dp = state.data.assignments.find(x=>x.id===aid)?.dropPoints.find(x=>x.id===dpid);
      const photoCount = (dp && dp.status==='completed'?1:0) + (dp?.media||[]).filter(m=>m.type==='image').length;
      const budget = Math.max(1, 3 - photoCount);
      // 一次開一個「多拍模式」的鏡頭視窗，budget是這一次最多還能拍幾張
      // （例如已經有主要照片、還剩2格附加照片，budget就是2）——同一個
      // 視窗裡連拍到budget張或按「完成」才關閉，不會每拍一張就關掉鏡頭
      // 再重開一次（見openCameraCapture()旁邊的說明，這是為了避開連續
      // 拍照時部分手機會失敗/黑屏的問題）。
      capturePhoto(fallbackInput, budget, goMany);
    };
    fallbackInput.onchange = (e)=>{
      const files = [...e.target.files]; if(!files.length) return;
      (async ()=>{
        try{
          const dataUrls = [];
          for(const f of files) dataUrls.push(await compressImageFile(f));
          await goMany(dataUrls);
        }catch(err){
          console.error('照片處理失敗', err);
          alert('照片處理失敗：'+err.message+'\n請重新拍攝或選擇另一張照片再試一次。');
        }
      })();
    };
  });
  // 「上傳照片」：不開相機，直接跳手機相簿/檔案選擇——鏡頭串流在部分
  // 手機上不穩定時，讓夥伴可以直接用手機原生相機APP先拍好，再從相簿
  // 選照片上傳，不用依賴我們這個自建相機。可以一次多選，依序填入還空著
  // 的格子（最多3格），選超過的部分不會上傳，會提示哪些沒傳成功。
  box.querySelectorAll('[data-photolib]').forEach(btn=>{
    const [aid, dpid] = btn.dataset.photolib.split('|');
    const libInput = box.querySelector(`[data-photolibinput="${aid}|${dpid}"]`);
    btn.onclick = ()=> libInput.click();
    libInput.onchange = (e)=>{
      const files = [...e.target.files]; if(!files.length) return;
      const dp = state.data.assignments.find(x=>x.id===aid)?.dropPoints.find(x=>x.id===dpid);
      const photoCount = (dp && dp.status==='completed'?1:0) + (dp?.media||[]).filter(m=>m.type==='image').length;
      const budget = Math.max(0, 3 - photoCount);
      const acceptFiles = files.slice(0, budget);
      const droppedCount = files.length - acceptFiles.length;
      // 一次多選時故意「一張一張依序」處理（不是Promise.all同時平行處理）：
      // heic2any底層是WASM解碼器，同時平行轉好幾張HEIC會搶同一份共用
      // 記憶體，轉出來的圖片會互相干擾、變成整張黑屏——這正是實測回報的
      // 「照片可以傳但黑屏」的原因，改成依序等每一張處理完才處理下一張
      // 就不會有這個問題，代價是多選幾張時處理時間會拉長一點。
      (async ()=>{
        try{
          const dataUrls = [];
          for(const f of acceptFiles) dataUrls.push(await compressImageFile(f));
          for(const dataUrl of dataUrls) await fillNextPhotoSlot(aid, dpid, dataUrl);
          if(droppedCount>0) alert(`一個店點最多3張照片，已上傳${acceptFiles.length}張，其餘 ${droppedCount} 張未上傳。`);
          renderContent();
        }catch(err){
          console.error('照片處理失敗', err);
          alert('照片處理失敗：'+err.message+'\n請重新選擇照片再試一次。');
        }
      })();
    };
  });
  // 未完成原因：選了代表這個店點暫時不會有送達照片，直接存檔，不用等到
  // 整趟結束才統一填一個籠統的備註；選完之後如果夥伴還是補拍了照片，
  // uploadDropPointPhoto() 會自動把這裡的原因清掉（見 data-layer.js）。
  box.querySelectorAll('[data-issue]').forEach(sel=>{
    sel.onchange = async ()=>{
      const [aid, dpid] = sel.dataset.issue.split('|');
      try{ await setDropPointIssueReason(aid, dpid, sel.value || null); renderContent(); }
      catch(err){ alert(err.message); }
    };
  });
}

// ---------- 夥伴端：歷史任務 ----------
// 送達照片（主照片＋附加照片）共用的點擊看圖彈窗，跟客戶查詢頁面同一個
// 精神：預設完全不載入照片，點了才跳出視窗、才真的去下載那幾張，避免
// 像之前那樣「同一頁裡有的門店有照片縮圖、有的沒有」看起來時有時無
// （其實是每張縮圖都直接下載，只是簽名連結偶爾失敗才會看起來不一致），
// 同時也減少Supabase流量。
function openPhotoLightbox(urls){
  if(!urls || !urls.length) return;
  let host = document.getElementById('photoLightboxHost');
  if(!host){ host = document.createElement('div'); host.id = 'photoLightboxHost'; document.body.appendChild(host); }
  host.innerHTML = `<div class="modal-backdrop" id="photoLightboxBackdrop">
    <div class="modal-box" style="max-width:480px;">
      <div class="toolbar"><strong>送達照片</strong><button class="btn ghost" id="photoLightboxClose">關閉</button></div>
      ${urls.map(u=>`<img src="${u}" style="width:100%; border-radius:4px; margin-bottom:8px; display:block;">`).join('')}
    </div>
  </div>`;
  document.getElementById('photoLightboxBackdrop').onclick = (e)=>{ if(e.target.id==='photoLightboxBackdrop') host.innerHTML=''; };
  document.getElementById('photoLightboxClose').onclick = ()=> host.innerHTML='';
}
function dpPhotoUrls(dp){
  const urls = [];
  if(dp.photo) urls.push(dp.photo);
  (dp.media||[]).filter(m=>m.type==='image' && m.url).forEach(m=> urls.push(m.url));
  return urls;
}
async function renderHistory(c){
  const dId = state.activeDriverId;
  // 夥伴自己的歷史任務想看多久以前都合理，而且夥伴端因為RLS本來就只看得到
  // 自己的任務（driver_select_own policy），不會因為系統整體規模（多少夥伴/
  // 多少店家）變大而跟著變重，所以這裡直接補到半年前，比預設的14天窗口寬
  // 很多，不受主控端那邊刻意縮小窗口的影響。
  // 只顯示「本月」已完成的紀錄：每月 1 號起，上個月以前的紀錄自動隱藏（各月份金額請看「我的報酬」）。
  const lookbackStart = todayStr().slice(0,7) + '-01';
  if(state.data.assignmentsWindowStart && lookbackStart < state.data.assignmentsWindowStart){
    c.innerHTML = '<h2 class="section-title">歷史任務</h2><div class="empty">載入中...</div>';
    try{ await ensureAssignmentsRange(lookbackStart); }
    catch(e){ c.innerHTML = `<h2 class="section-title">歷史任務</h2><div class="empty">載入失敗：${e.message}</div>`; return; }
    if(state.tab!=='history') return; // 使用者可能已經切走這一頁
  }
  const list = state.data.assignments.filter(a=>a.driverId===dId && a.status==='completed' && a.date>=lookbackStart).sort((a,b)=>b.date.localeCompare(a.date));
  const groups = {};
  list.forEach(a=>{ if(!groups[a.date]) groups[a.date] = []; groups[a.date].push(a); });
  const dateKeys = Object.keys(groups).sort((a,b)=>b.localeCompare(a));
  c.innerHTML = `
    <h2 class="section-title">歷史任務</h2>
    <p class="section-sub">本月已完成並封存的任務紀錄，不可再編輯。</p>
    ${(()=>{
      // 臨時支援別人的店點：只列有完成的，拆分金額是主控填的顯示用數字，不影響我的報酬。
      const sup = state.data.assignments.filter(a=>a.isSupport && a.date>=lookbackStart && a.dropPoints.some(d=>d.status==='completed')).sort((x,y)=>y.date.localeCompare(x.date));
      if(!sup.length) return '';
      return `<div class="panel"><h3 style="margin:0 0 6px;">支援紀錄（本月）</h3>${sup.map(a=>{
        const done = a.dropPoints.filter(d=>d.status==='completed').length;
        return `<div style="padding:6px 0; border-top:1px solid var(--border); font-size:13.5px;"><strong>${a.date.slice(5).replace('-','/')} ${routeName(a.routeId)}</strong><br><span style="color:var(--ink-soft); font-size:12.5px;">支援 ${escapeHtml(a.originalDriverName||'')} 的店點：完成 ${done}／${a.dropPoints.length}${a.supportAmount!=null?`　拆分金額 $${money(a.supportAmount)}（僅供參考）`:''}</span></div>`;
      }).join('')}</div>`;
    })()}
    ${dateKeys.map(date=>{
      const items = groups[date];
      return `<div class="date-group" data-key="${date}">
        <div class="date-head">
          <span>${date}</span>
          <span><span class="chevron">▸</span></span>
        </div>
        <div class="date-body">
          ${items.map(a=>`
            <div class="panel" style="margin-top:12px;">
              <div class="toolbar"><strong>${routeName(a.routeId)}</strong><span class="badge locked">已封存</span></div>
              <p style="font-size:12.5px; margin-bottom:4px;">任務起點：${a.origin||'—'}</p>
              <p style="margin:0 0 8px;"><strong>報酬：$${money(a.fare)}</strong></p>
              ${a.hasIssue ? `<div class="note" style="border-color:var(--danger); color:var(--danger);"><strong>回報異常：</strong>${escapeHtml(a.issueNote)}</div>` : ''}
              ${ownDropPoints(a).map(dp=>{
                const photoUrls = dpPhotoUrls(dp);
                const statusBadge = dp.status==='completed'
                  ? `<span class="badge completed"${photoUrls.length?' data-viewphoto style="cursor:pointer;"':''}>已完成${photoUrls.length?'・點擊看照片':''}</span>`
                  : `<span class="badge pending">未完成${dp.issueReason?'：'+dp.issueReason:''}</span>`;
                return `<div class="drop-point-driver" data-dpid="${dp.id}"><span class="store-name">${dpLabel(dp)}</span>（${channelName(dp.channelId)}） ${statusBadge}${!dp.photo && dp.photoCleared?'<br><span style="font-size:11.5px; color:var(--ink-soft);">照片已超過30天自動清除</span>':''}</div>`;
              }).join('')}
            </div>
          `).join('')}
        </div>
      </div>`;
    }).join('') || '<div class="empty">本月尚無已完成的歷史任務</div>'}
  `;
  c.querySelectorAll('.date-head').forEach(head=>{
    head.onclick = ()=> head.closest('.date-group').classList.toggle('open');
  });
  const dpById = {};
  list.forEach(a=> a.dropPoints.forEach(dp=> dpById[dp.id]=dp));
  c.querySelectorAll('[data-dpid]').forEach(el=>{
    const dp = dpById[el.dataset.dpid];
    const urls = dp ? dpPhotoUrls(dp) : [];
    if(urls.length) el.querySelector('[data-viewphoto]').onclick = ()=> openPhotoLightbox(urls);
  });
}
// 近6個月（含本月）供月份下拉選單共用，由新到舊排序。月結算這類表單原本
// 用 <input type="month">，手機瀏覽器原生的月份選擇器不好點、也容易選到
// 範圍外的月份；改成固定列出近6個月讓使用者直接選，體驗一致也不會選錯。
function recentMonthOptions(n){
  const [y0,m0] = todayStr().slice(0,7).split('-').map(Number);
  const months = [];
  for(let i=0;i<n;i++){
    let y=y0, m=m0-i;
    while(m<=0){ m+=12; y--; }
    months.push(`${y}-${pad(m)}`);
  }
  return months;
}
function monthOptionsHtml(selected, n=6){
  const thisMonth = todayStr().slice(0,7);
  return recentMonthOptions(n).map(m=>`<option value="${m}" ${m===selected?'selected':''}>${m}${m===thisMonth?'（本月）':''}</option>`).join('');
}

      <div class="grid3">

// 簽名圖處理成「貼在勞報單簽章欄」的樣子：只留筆跡範圍（裁掉空白、留一點邊距）、背景透明、
// 縮到適合簽章欄的大小（最寬 640、最高 220，等比例），這樣貼上去不會太小、也不會超出欄位。
// 簽名板一律是橫向的畫布（直拿手機時畫面會旋轉成橫向，座標已經轉正），所以這裡不用再旋轉。
function buildSignatureForSlip(canvas){
  const ctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  let minX=w, minY=h, maxX=0, maxY=0, found=false;
  const data = ctx.getImageData(0,0,w,h).data;
  const step = 2; // 抽樣掃描加快速度，簽名筆畫夠粗不會因此漏掉範圍
  for(let y=0; y<h; y+=step){
    for(let x=0; x<w; x+=step){
      if(data[(y*w+x)*4+3] > 10){
        found = true;
        if(x<minX) minX=x; if(x>maxX) maxX=x;
        if(y<minY) minY=y; if(y>maxY) maxY=y;
      }
    }
  }
  if(!found) return canvas.toDataURL('image/png');
  const pad = 14;
  minX = Math.max(0, minX-pad); minY = Math.max(0, minY-pad);
  maxX = Math.min(w, maxX+pad); maxY = Math.min(h, maxY+pad);
  const cropW = maxX-minX, cropH = maxY-minY;
  const scale = Math.min(1, 640/cropW, 220/cropH);
  const out = document.createElement('canvas');
  out.width = Math.max(1, Math.round(cropW*scale));
  out.height = Math.max(1, Math.round(cropH*scale));
  out.getContext('2d').drawImage(canvas, minX, minY, cropW, cropH, 0, 0, out.width, out.height);
  return out.toDataURL('image/png');
}
// 滿版橫式簽名視窗：點「已確認報酬並簽名」才開，蓋滿整個螢幕、鎖住背景捲動。
// 手機如果是直的，簽名板會旋轉 90 度（請把手機橫過來握著簽；握反了按「翻轉」），手機本身已經是橫向就直接用；
// 筆跡座標一律換算回橫向畫布，所以存出來的簽名一定是正的橫式。簽完先預覽貼在勞報單簽章欄的樣子，再按「確認送出」。
function openSignatureModal(record){
  const host = document.getElementById('sigModalHost');
  const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent);
  let flip = false, drawing = false, hasSignature = false;
  const prevOverflow = document.body.style.overflow;
  document.body.style.overflow = 'hidden';
  host.innerHTML = `
    <div class="sig-full" id="sigFull">
      <div id="sigStage">
        <canvas id="sigPad"></canvas>
        <div class="sig-watermark">請簽名</div>
        <div id="sigHint" class="sig-hint"></div>
        <div class="sig-bar">
          <div class="sig-side">
            <button class="sig-clear-link" id="sigClear">清除重簽</button>
            <button class="sig-clear-link" id="sigFlip" style="display:none;">翻轉方向</button>
          </div>
          <div class="sig-side">
            <button class="sig-icon-btn cancel" id="sigCancel" title="取消">❌</button>
            <button class="sig-icon-btn confirm" id="sigConfirm" title="完成簽名">☑️</button>
          </div>
        </div>
      </div>
    </div>`;
  const full = document.getElementById('sigFull');
  const stage = document.getElementById('sigStage');
  const canvas = document.getElementById('sigPad');
  const ctx = canvas.getContext('2d');
  const hint = document.getElementById('sigHint');
  const flipBtn = document.getElementById('sigFlip');
  const DPR = 2;
  full.addEventListener('touchmove', e=>e.preventDefault(), { passive:false });
  // Android 可以真的全螢幕＋鎖橫向（iPhone 不支援，靠旋轉簽名板）；失敗就算了，不影響簽名。
  if(!isIOS){
    try{ const r = document.documentElement.requestFullscreen && document.documentElement.requestFullscreen(); if(r && r.then) r.then(()=>{ try{ screen.orientation.lock('landscape').catch(()=>{}); }catch(e){} }).catch(()=>{}); }catch(e){}
  }
  function layout(){
    const W = window.innerWidth, H = window.innerHeight;
    const rotated = H > W;
    const lw = rotated ? H : W, lh = rotated ? W : H; // 簽名板自己的（橫向）寬高
    stage.style.width = lw+'px'; stage.style.height = lh+'px';
    if(!rotated){ stage.style.left = '0px'; stage.style.top = '0px'; stage.style.transform = 'none'; }
    else if(!flip){ stage.style.left = W+'px'; stage.style.top = '0px'; stage.style.transform = 'rotate(90deg)'; }
    else { stage.style.left = '0px'; stage.style.top = H+'px'; stage.style.transform = 'rotate(-90deg)'; }
    flipBtn.style.display = rotated ? '' : 'none';
    hint.textContent = rotated ? '請把手機橫過來握著簽名（字是倒的就按「翻轉方向」）' : '';
    const prev = (canvas.width && hasSignature) ? canvas.toDataURL('image/png') : null;
    canvas.width = lw*DPR; canvas.height = lh*DPR;
    ctx.lineWidth = 5; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#1B2129';
    if(prev){ const img = new Image(); img.onload = ()=> ctx.drawImage(img,0,0,canvas.width,canvas.height); img.src = prev; }
  }
  // 螢幕座標 → 簽名板（橫向）座標
  function pos(e){
    const W = window.innerWidth, H = window.innerHeight;
    let lx, ly;
    if(H <= W){ lx = e.clientX; ly = e.clientY; }
    else if(!flip){ lx = e.clientY; ly = W - e.clientX; }
    else { lx = H - e.clientY; ly = e.clientX; }
    return { x: lx*DPR, y: ly*DPR };
  }
  layout();
  window.addEventListener('resize', layout);
  window.addEventListener('orientationchange', layout);
  canvas.addEventListener('pointerdown', e=>{ drawing=true; hasSignature=true; const p=pos(e); ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(p.x+0.01,p.y); ctx.stroke(); });
  canvas.addEventListener('pointermove', e=>{ if(!drawing) return; const p=pos(e); ctx.lineTo(p.x,p.y); ctx.stroke(); });
  window.addEventListener('pointerup', onUp);
  function onUp(){ drawing=false; }
  function close(){
    window.removeEventListener('resize', layout); window.removeEventListener('orientationchange', layout); window.removeEventListener('pointerup', onUp);
    document.body.style.overflow = prevOverflow;
    try{ if(document.fullscreenElement) document.exitFullscreen(); screen.orientation.unlock(); }catch(e){}
    host.innerHTML = '';
  }
  document.getElementById('sigClear').onclick = ()=>{ ctx.clearRect(0,0,canvas.width,canvas.height); hasSignature=false; };
  flipBtn.onclick = ()=>{ flip = !flip; layout(); };
  document.getElementById('sigCancel').onclick = close;
  document.getElementById('sigConfirm').onclick = ()=>{
    if(!hasSignature){ alert('請先簽名再送出'); return; }
    const sigUrl = buildSignatureForSlip(canvas);
    close();
    showSignaturePreview(record, sigUrl);
  };
}
// 簽完先預覽「貼在勞報單簽章欄」的樣子（跟勞報單用同樣的欄位與圖片大小限制），確認才送出，不滿意回去重簽。
function showSignaturePreview(record, sigUrl){
  const host = document.getElementById('sigModalHost');
  const payDate = record.payDate || (()=>{ const [y,m] = record.month.split('-').map(Number); const d = new Date(y, m, 1); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-15`; })();
  const prevOverflow = document.body.style.overflow;
  document.body.style.overflow = 'hidden';

// 「加入主畫面」的網頁App在不少手機上會被系統背景凍結、放很久都沒有
// 真正重新載入過（不是瀏覽器分頁那種無痕快取問題，是整個JS執行環境
// 一直沒有重啟），導致上線的新功能、跟即時性的資料（今日尚未完成
// 等）長時間卡住不動、看起來「無法同步」。這裡用兩個機制補救：
// 1. 切回前景/每隔幾分鐘，比對目前執行中的頁面內容跟伺服器上最新的
//    是否不同，不同就跳出一條提示，讓使用者自己決定要不要點擊重新
//    整理（不強制自動reload，避免打斷正在填寫的表單）。
// 2. 切回前景時，如果人在「首頁」（這個分頁沒有任何表單欄位，不會有
//    填到一半被清掉的風險），就悄悄重新抓一次資料並重繪，讓「今日
//    尚未配送完成」這類即時面板自動跟上最新狀態；其他分頁刻意不自動
//    重繪，使用者切換分頁時自然就會拿到最新資料。
let __bootPageSignature = null;
async function computePageSignature(){
  try{
    const res = await fetch(location.pathname || '/', { cache: 'no-store' });
    if(!res.ok) return null;
    const text = await res.text();
    let hash = 0;
    for(let i=0;i<text.length;i++){ hash = (hash*31 + text.charCodeAt(i)) | 0; }
    return hash;
  }catch(e){ return null; }
}
function showUpdateBanner(){

  bar.onclick = ()=> location.reload();
  document.body.appendChild(bar);
}
async function checkForUpdate(){
  const sig = await computePageSignature();
  if(sig===null) return;
  if(__bootPageSignature===null){ __bootPageSignature = sig; return; }
  if(sig !== __bootPageSignature) showUpdateBanner();
}
// 首頁即時更新主要靠 Realtime 推播（見 startRealtimeSync，任務/店點一有
// 異動，debounce一下就會呼叫這支函式刷新），不用再每25秒硬去問一次資料庫。
// 這裡的定時輪詢改成保險用的備援（例如WebSocket連線中途斷掉、或Realtime
// 訂閱失敗退回純輪詢的情況），間隔放寬到3分鐘即可，平常都是Realtime先
// 觸發。分頁切到背景時暫停，不做沒人看的無意義請求；另外記錄「上次更新
// 時間」讓畫面上看得到資料新鮮度，面板也保留手動「重新整理」按鈕。
let lastHomeRefreshAt = null;
// ---------- 即時同步 ----------
// 資料庫一有異動（任務、店點、勞報單簽名、調整項、代墊申報），Realtime 就推播過來：
// 只抓「有變的那幾筆」合併進記憶體，然後讓「目前這一頁」立刻跟著更新（不再只有首頁會更新）。
// 使用者正在輸入、或開著明細／簽名視窗時，不硬重畫（以免打到一半的字被洗掉），改成稍後安全時再更新。
const LIVE_TABS = {
  assignments: ['home','schedule','today','history','my-earnings'],
  statements: ['home','slips','my-statement'],
  adjustments: ['home','payroll','my-earnings'],
  fuel_claims: ['home','payroll','my-earnings']
};
let liveQ = { assignments:new Set(), assignmentsDel:new Set(), statements:new Set(), statementsDel:new Set(), adjustments:new Set(), adjustmentsDel:new Set(), fuel_claims:new Set(), fuel_claimsDel:new Set() };
let liveTimer = null, livePendingTabs = null;
function handleLiveEvent(ev){
  const id = ev.new.id || ev.old.id;
  const del = ev.eventType==='DELETE';
  if(ev.table==='assignment_drop_points'){
    const aid = ev.new.assignment_id;
    if(aid) liveQ.assignments.add(aid);
  } else if(liveQ[ev.table]){
    if(del && id) liveQ[ev.table+'Del'].add(id); else if(id) liveQ[ev.table].add(id);
  }
  clearTimeout(liveTimer);
  liveTimer = setTimeout(flushLive, 350);
}
async function flushLive(){
  const q = liveQ;
  liveQ = { assignments:new Set(), assignmentsDel:new Set(), statements:new Set(), statementsDel:new Set(), adjustments:new Set(), adjustmentsDel:new Set(), fuel_claims:new Set(), fuel_claimsDel:new Set() };
  if(!state.data) return;
  const touched = new Set();
  const upsert = (arr, item)=>{ const i = arr.findIndex(x=>x.id===item.id); if(i>=0) arr[i]=item; else arr.push(item); };
  try{
    const supabase = getSupabase();
    // 任務（含店點明細與照片連結）：一筆一筆抓，抓不到（刪除、或已不在權限範圍，例如被取消發佈）就從記憶體移除。
    await Promise.all([...q.assignments].map(async id=>{
      try{ const a = await fetchAssignment(id); upsert(state.data.assignments, a); }
      catch(e){ if(/0 rows|no rows/i.test(e.message)) state.data.assignments = state.data.assignments.filter(x=>x.id!==id); else throw e; }
    }));
    if(q.assignments.size) state.data.assignments.sort((a,b)=>a.date.localeCompare(b.date));
    if(q.assignmentsDel.size){ state.data.assignments = state.data.assignments.filter(x=>!q.assignmentsDel.has(x.id)); }
    if(state.role==='driver' && !state.adminViewDriver && q.assignments.size) await syncSupportStops();
    if(q.assignments.size || q.assignmentsDel.size) touched.add('assignments');
    if(q.statements.size){
      const { data } = await supabase.from('statements').select('*').in('id', [...q.statements]);
      const rows = (data||[]).map(mapStatement);
      await resolveSignatureUrls(rows);
      rows.forEach(r=> upsert(state.data.statements, r));
      touched.add('statements');
    }
    if(q.statementsDel.size){ state.data.statements = state.data.statements.filter(x=>!q.statementsDel.has(x.id)); touched.add('statements'); }
    if(q.adjustments.size){
      const { data } = await supabase.from('adjustments').select('*').in('id', [...q.adjustments]);
      (data||[]).map(mapAdjustment).forEach(r=> upsert(state.data.adjustments, r));
      touched.add('adjustments');
    }
    if(q.adjustmentsDel.size){ state.data.adjustments = state.data.adjustments.filter(x=>!q.adjustmentsDel.has(x.id)); touched.add('adjustments'); }
    if(q.fuel_claims.size){
      const { data } = await supabase.from('fuel_claims').select('*').in('id', [...q.fuel_claims]);
      state.data.fuelClaims = state.data.fuelClaims || [];
      (data||[]).map(mapFuelClaim).forEach(r=> upsert(state.data.fuelClaims, r));
      touched.add('fuel_claims');
    }
    if(q.fuel_claimsDel.size){ state.data.fuelClaims = (state.data.fuelClaims||[]).filter(x=>!q.fuel_claimsDel.has(x.id)); touched.add('fuel_claims'); }
  }catch(e){ console.error('即時同步失敗，改用備援刷新', e); refreshHomeDataIfIdle(); return; }
  if(!touched.size) return;
  lastHomeRefreshAt = new Date();
  const need = [...touched].some(t=> (LIVE_TABS[t]||[]).includes(state.tab));
  if(!need) return;
  tryLiveRender();
}
// 使用者正在輸入、或開著會被重畫洗掉的視窗／明細時，不重畫，稍後再試。
function liveRenderBlocked(){
  if(document.hidden) return true;
  const ae = document.activeElement;
  if(ae && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)) return true;
  if(document.querySelector('.modal-backdrop, .sig-full')) return true;
  if(document.querySelector('.assign-detail-row')) return true;
  const sheet = document.getElementById('assignDetail'); if(sheet && sheet.innerHTML.trim()) return true;
  const weekModal = document.getElementById('weekTripModal'); if(weekModal && weekModal.innerHTML.trim()) return true;
  return false;
}
function tryLiveRender(){
  if(liveRenderBlocked()){ livePendingTabs = true; return; }
  livePendingTabs = null;
  try{ renderNav(); renderContent(); }catch(e){ console.error('即時更新畫面失敗', e); }
}
setInterval(()=>{ if(livePendingTabs && !liveRenderBlocked()) tryLiveRender(); }, 2500);

async function refreshHomeDataIfIdle(){
  if(!state.data || state.tab!=='home' || document.hidden) return;
  try{
    // 只重抓首頁真的需要跟上即時狀態的任務資料，不呼叫整支 loadAllData()——
    // 夥伴/通路/路線這些目錄資料幾乎不會變動，100人同時在線時每25秒讓每個人
    // 都重抓一次是不必要的資料庫負擔（見 refreshAssignmentsRange 說明）。
    // 主控要看到「本月至今」的即時利潤，夥伴首頁只需要「今天」的行程數字。
    const today = todayStr();
    if(state.role==='admin'){ await refreshAssignmentsRange(today.slice(0,7)+'-01', today); await refreshFuelClaims(); }
    else { await refreshAssignmentsRange(today, today); await syncSupportStops(); }
    // 夥伴首頁的「同任務起點今日出發狀況」是另外呼叫loadDepotOverview()
    // 查的（夥伴身份是走RPC，不在loadAllData()裡），有自己的一層快取
    // （depotOverviewCache），這裡一起清掉，讓renderContent()重新渲染時
    // 順便重新抓一次，不然這個面板不會跟著這裡的25秒一起變新。
    depotOverviewCache = { key:null, rows:null };
    lastHomeRefreshAt = new Date();
    renderNav();
    renderContent();
  }catch(e){ console.error('背景重新整理資料失敗', e); }
}
document.addEventListener('visibilitychange', ()=>{
  if(!document.hidden){ checkForUpdate(); refreshHomeDataIfIdle(); }
});
window.addEventListener('focus', ()=>{ checkForUpdate(); refreshHomeDataIfIdle(); });
// 手機把分頁丟到背景一陣子後，WebSocket 可能已經休眠、錯過中間的推播：回到前景時（離開超過 30 秒）
// 主動補抓一次目前會看到的任務範圍，補完再更新畫面。
let hiddenAtTs = null;
document.addEventListener('visibilitychange', ()=>{
  if(document.hidden){ hiddenAtTs = Date.now(); return; }
  if(hiddenAtTs && Date.now()-hiddenAtTs > 30000){ hiddenAtTs = null; catchUpAfterResume(); }
});
async function catchUpAfterResume(){
  if(!state.data || !state.role) return;
  try{
    const today = todayStr();
    if(state.role==='admin'){ await refreshAssignmentsRange(getWeekDates(0)[0], getWeekDates(1)[6]); await refreshFuelClaims(); }
    else { await refreshAssignmentsRange(today, ymd(addDays(today, 14))); await syncSupportStops(); }
    tryLiveRender();
  }catch(e){ console.error('回到前景補抓資料失敗', e); }
}
setInterval(checkForUpdate, 5*60*1000);
setInterval(refreshHomeDataIfIdle, 180*1000);

async function bootApp(){
  const auth = getStoredAuth();
  if(!auth){ renderLoginGate(); return; }
  state.role = auth.role;
  if(auth.role==='driver') state.activeDriverId = auth.driver.id;
  try{
    state.data = await loadAllData();
  }catch(e){
    // 登入憑證過期（主控12小時、夥伴30天）是正常的工作流程，不是系統壞掉，
    // 跳出一堆技術性錯誤訊息（JWT expired之類）只會讓人誤以為系統出問題。
    // 只有這個情況顯示單純的「請重新登入」；其他真的意料之外的錯誤（網路、
    // 伺服器異常等）還是把完整錯誤訊息顯示出來，方便回報問題時能看出到底
    // 是哪裡壞了。
    const isExpired = /jwt expired/i.test(e.message || '');
    alert(isExpired ? '登入已過期，請重新登入。' : ('讀取資料失敗，請重新登入：' + e.message));
    clearAuth(); renderLoginGate();
    return;
  }
  if(auth.role==='driver'){
    const me = state.data.drivers.find(d=>d.id===auth.driver.id);
    if(!me || me.status!=='active'){ clearAuth(); renderLoginGate('此帳號已停用，請聯絡主控。'); return; }
    if(me.forceCodeReset){ renderForceCodeResetGate(me.id, me.name); return; }
    await syncSupportStops();   // 臨時交給我支援的店點（沒有就是空的）
  }
  showApp();
}

(async function init(){
  computePageSignature().then(sig=>{ if(__bootPageSignature===null) __bootPageSignature = sig; });
  await bootApp();
})();
</script>

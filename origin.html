<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>任務起點行程查詢</title>
<link rel="shortcut icon" href="favicon.ico">
<link rel="icon" type="image/png" sizes="16x16" href="assets/icons/favicon-16.png">
<link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="assets/icons/icon-512.png">
<link rel="apple-touch-icon" sizes="152x152" href="assets/icons/apple-touch-icon-152.png">
<link rel="apple-touch-icon" sizes="167x167" href="assets/icons/apple-touch-icon-167.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon-180.png">
<link rel="manifest" href="site.webmanifest">
<meta name="theme-color" content="#F3E7CF">
<meta name="apple-mobile-web-app-title" content="信興｜碳金 Hub">
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+TC:wght@400;500;600;700&display=swap');
  :root{
    --navy:#1B2A41; --amber:#E0902E; --teal:#3F6E6C;
    --paper:#F5F5F2; --panel:#FFFFFF; --border:#D9DCE1; --ink:#1B2129; --ink-soft:#5B6472;
    --radius:6px;
  }
  *{box-sizing:border-box;}
  body{ margin:0; background:var(--paper); color:var(--ink); font-family:'IBM Plex Sans TC',-apple-system,sans-serif; font-size:14px; line-height:1.55; }
  header{ background:var(--navy); color:#fff; padding:16px 18px; display:flex; justify-content:space-between; align-items:flex-start; gap:12px; flex-wrap:wrap; }
  header .htext h1{ font-size:16px; font-weight:600; margin:0; }
  header .htext p{ font-size:12px; color:#B9C2CE; margin:4px 0 0; }
  header .hbtns{ display:flex; gap:8px; flex-wrap:wrap; }
  .hbtn{
    display:inline-flex; align-items:center; gap:6px; border:1px solid rgba(255,255,255,.35); background:rgba(255,255,255,.08);
    color:#fff; font-size:12px; font-weight:600; padding:7px 11px; border-radius:var(--radius); cursor:pointer; font-family:inherit;
  }
  .hbtn:disabled{ opacity:.6; cursor:default; }
  .hbtn svg{ flex:none; }
  main{ max-width:560px; margin:0 auto; padding:14px; }
  .state-msg{ text-align:center; color:var(--ink-soft); padding:60px 16px; font-size:13.5px; }
  .meta-row{ display:flex; flex-wrap:wrap; gap:12px; color:var(--ink-soft); font-size:12.5px; margin:0 0 14px; }
  .meta-row b{ color:var(--ink); font-weight:600; }
  .grid{ display:flex; flex-direction:column; gap:10px; }
  .card{ background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); padding:12px 14px; }
  .card .route-name{ font-size:14.5px; font-weight:700; margin:0 0 8px; }
  .route-name .name-text{ font-size:14.5px; font-weight:700; }
  .pill{ font-size:11px; font-weight:600; padding:2px 9px; border-radius:10px; margin-left:6px; white-space:nowrap; }
  .pill.am{ background:rgba(63,110,108,.12); color:var(--teal); }
  .pill.pm{ background:rgba(224,144,46,.16); color:var(--amber); }
  .stop-n{ color:var(--ink-soft); font-weight:400; font-size:12px; margin-left:6px; white-space:nowrap; }
  /* 店點清單是格子狀的表格線＋最後一欄空白備註欄（可直接打字）。 */
  .stops{ margin-top:4px; }
  .stop-row{ display:flex; border:1px solid var(--border); border-bottom:none; }
  .stop-row:last-child{ border-bottom:1px solid var(--border); }
  .stop-row>div{ border-right:1px solid var(--border); padding:5px 7px; font-size:13px; }
  .stop-row>div:last-child{ border-right:none; }
  .stops .n{ width:22px; flex:none; text-align:center; color:var(--ink-soft); font-size:11px; font-weight:700; background:var(--paper); }
  .stops .label{ flex:1; }
  .stops .note{ width:56px; flex:none; padding:0; }
  .note-input{ width:100%; height:100%; border:none; outline:none; background:transparent; font:inherit; color:var(--ink); padding:5px 7px; box-sizing:border-box; }
  .note-input:focus{ background:rgba(63,110,108,.08); }
  .stops .store{ font-weight:600; }
  .stops .channel{ color:var(--ink-soft); font-size:11.5px; }
  .footer-note{ text-align:center; color:var(--ink-soft); font-size:11.5px; padding:20px 16px 30px; }

  /* 列印：固定 A4、兩欄排版，大約一張紙四張卡片；每 4 張卡片強制換頁，卡片本身不被從中間切斷。
     只印卡片本身（#shots），不含上面的導覽列與統計列，頁首頁尾不會佔掉版面。 */
  @page{ size:A4; margin:14mm 12mm; }
  @media print{
    /* CSS Grid 在 Chrome 列印分頁時支援不好，「卡片不能被切斷」常常失效、整張卡被腰斬，
       所以列印時改用區塊自然換行（inline-block）排兩欄，不用 Grid——這是瀏覽器分頁
       真正可靠支援的排法。畫面上看到的還是 Grid，只有列印這裡換掉。備註欄的輸入框瀏覽器
       原生列印就會印出目前打的值，不用額外處理。 */
    body *{ visibility:hidden; }
    #shots, #shots *{ visibility:visible; }
    #shots{ position:absolute; left:0; top:0; width:100%; margin:0; padding:0; }
    .grid{ display:block; font-size:0; }
    .card{
      display:inline-block; vertical-align:top; width:48%; font-size:13px;
      margin:0 1% 10mm 1%; break-inside:avoid; page-break-inside:avoid;
    }
    .card:nth-child(4n+1){ break-before:page; page-break-before:always; }
    .card:first-child{ break-before:auto; page-break-before:auto; }
  }
</style>
</head>
<body>
<header>
  <div class="htext">
    <h1 id="originTitle">任務起點行程查詢</h1>
    <p id="originSub">載入中...</p>
  </div>
  <div class="hbtns" id="hbtns" style="display:none;">
    <button class="hbtn" id="printBtn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
      列印
    </button>
  </div>
</header>
<main>
  <div id="content"><div class="state-msg">載入中...</div></div>
</main>
<script>
function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
// noteValues：備註欄位的內容，key 是「車次序號-站序」。使用者直接在網頁上打字（例如代收金額、
// 簽收狀態），打字當下就同步進這個物件；重新整理/背景刷新重畫卡片時會從這裡讀回來，不會洗掉。
// 列印用的就是當下畫面的真實輸入框，瀏覽器原生列印本來就會印出輸入框目前的值，不需要額外處理。
let noteValues = {};
function cardHtml(route, routeIdx){
  const rows = route.stops.map((s,i)=>{
    const key = routeIdx + '-' + i;
    const val = noteValues[key] || '';
    return `
    <div class="stop-row">
      <div class="n">${i+1}</div>
      <div class="label"><span class="store">${escapeHtml(s.store)}</span>${s.channel?` <span class="channel">${escapeHtml(s.channel)}</span>`:''}</div>
      <div class="note"><input type="text" class="note-input" data-key="${key}" value="${escapeHtml(val)}" autocomplete="off"></div>
    </div>`;
  }).join('') || `<div class="stop-row"><div class="label" style="color:var(--ink-soft);">尚未設定店點</div></div>`;
  const shiftClass = route.shift==='PM' ? 'pm' : 'am', shiftLabel = route.shift==='PM' ? '下午' : '上午';
  return `
    <div class="card">
      <div class="route-name"><span class="name-text">${escapeHtml(route.name)}</span> <span class="pill ${shiftClass}">${shiftLabel}</span> <span class="stop-n">共 ${route.stops.length} 站</span></div>
      <div class="stops">${rows}</div>
    </div>`;
}
document.addEventListener('input', (e)=>{
  if(e.target && e.target.classList && e.target.classList.contains('note-input')){
    noteValues[e.target.dataset.key] = e.target.value;
  }
});

let currentOriginLabel = '', currentData = null;
function renderRoutes(data){
  currentData = data;
  const content = document.getElementById('content');
  if(!data.routes.length){ content.innerHTML = '<div class="state-msg">目前沒有車次資料。</div>'; return; }
  const totalStops = data.routes.reduce((s,r)=>s+r.stops.length, 0);
  content.innerHTML = `
    <div class="meta-row">
      <span>共 <b>${data.routes.length}</b> 車次</span>
      <span>合計 <b>${totalStops}</b> 站</span>
      <span>查詢日期：<b>${escapeHtml(data.today)}</b></span>
    </div>
    <div id="shots"><div class="grid">${data.routes.map((r,idx)=>cardHtml(r, idx)).join('')}</div></div>
    <div class="footer-note">只顯示車次與店點順序，異動後重新整理即為最新版本。</div>
  `;
}

async function main(){
  const params = new URLSearchParams(location.search);
  const token = params.get('token');
  const sub = document.getElementById('originSub');
  if(!token){
    document.getElementById('content').innerHTML = '<div class="state-msg">這個連結少了存取金鑰，請跟主控確認最新連結。</div>';
    sub.textContent = ''; return;
  }
  let data;
  try{
    const res = await fetch('/api/origin-data?token=' + encodeURIComponent(token));
    data = await res.json();
    if(!res.ok) throw new Error(data.error || '載入失敗');
  }catch(e){
    document.getElementById('content').innerHTML = `<div class="state-msg">${escapeHtml(e.message || '連結無效或已停用，請跟主控確認最新連結。')}</div>`;
    sub.textContent = ''; return;
  }
  currentOriginLabel = data.originLabel || '';
  document.getElementById('originTitle').textContent = data.originLabel + ' 行程查詢';
  document.title = data.originLabel + ' 行程查詢';
  sub.textContent = data.originAddress || '';
  document.getElementById('hbtns').style.display = 'flex';
  renderRoutes(data);
  document.getElementById('printBtn').onclick = ()=> window.print();
}

// 這個頁面常被起點「加入主畫面」使用，跟主系統一樣會被手機背景凍結、放很久沒有真正重新整理過，
// 看起來像行程無法同步。切回前景/每隔幾分鐘悄悄重新抓一次資料，並比對頁面內容有沒有更新過，
// 有的話跳提示讓使用者自己決定要不要重新整理。
async function refreshData(){
  const token = new URLSearchParams(location.search).get('token');
  if(!token) return;
  // 如果使用者正在備註欄打字，這次背景刷新先跳過（不要重畫整個清單打斷輸入），
  // 下一個週期再試一次就好，打字途中資料本來就不會差這 3 分鐘。
  if(document.activeElement && document.activeElement.classList && document.activeElement.classList.contains('note-input')) return;
  try{
    const res = await fetch('/api/origin-data?token=' + encodeURIComponent(token));
    const data = await res.json();
    if(!res.ok) return;
    renderRoutes(data);
  }catch(e){ /* 背景刷新失敗就靜默維持原本畫面 */ }
}
let __bootPageSignature = null;
async function computePageSignature(){
  try{
    const res = await fetch(location.pathname, { method:'HEAD', cache:'no-store' });
    if(!res.ok) return null;
    return res.headers.get('etag') || null;
  }catch(e){ return null; }
}
function showUpdateBanner(){
  if(document.getElementById('updateBanner')) return;
  const bar = document.createElement('div');
  bar.id = 'updateBanner';
  bar.style.cssText = 'position:fixed; top:0; left:0; right:0; background:var(--amber); color:#fff; padding:10px 14px; text-align:center; font-size:13px; z-index:99999; cursor:pointer;';
  bar.textContent = '📢 頁面已更新，點此重新整理 ↻';
  bar.onclick = ()=> location.reload();
  document.body.appendChild(bar);
}
async function checkForUpdate(){
  const sig = await computePageSignature();
  if(sig===null) return;
  if(__bootPageSignature===null){ __bootPageSignature = sig; return; }
  if(sig !== __bootPageSignature) showUpdateBanner();
}
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden){ checkForUpdate(); refreshData(); } });
window.addEventListener('focus', ()=>{ checkForUpdate(); refreshData(); });
setInterval(checkForUpdate, 5*60*1000);
setInterval(refreshData, 3*60*1000);
computePageSignature().then(sig=>{ if(__bootPageSignature===null) __bootPageSignature = sig; });
main();
</script>
</body>
</html>

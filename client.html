<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>配送紀錄查詢</title>
<link rel="shortcut icon" href="favicon.ico">
<link rel="icon" type="image/png" sizes="512x512" href="assets/icons/icon-512.png">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon-180.png">
<meta name="apple-mobile-web-app-title" content="信興｜碳金車隊">
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+TC:wght@400;500;600;700&display=swap');
  :root{
    --navy:#1B2A41; --amber:#E0902E; --teal:#3F6E6C;
    --paper:#F5F5F2; --panel:#FFFFFF; --border:#D9DCE1; --ink:#1B2129; --ink-soft:#5B6472;
    --radius:6px;
  }
  *{box-sizing:border-box;}
  body{ margin:0; background:var(--paper); color:var(--ink); font-family:'IBM Plex Sans TC',-apple-system,sans-serif; font-size:14px; line-height:1.55; }
  header{ background:var(--navy); color:#fff; padding:16px 18px; }
  header h1{ font-size:16px; font-weight:600; margin:0; }
  header p{ font-size:12px; color:#B9C2CE; margin:4px 0 0; }
  main{ max-width:560px; margin:0 auto; padding:14px; }
  .state-msg{ text-align:center; color:var(--ink-soft); padding:60px 16px; font-size:13.5px; }
  .date-group{ margin-bottom:12px; background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; }
  .date-head{ display:flex; justify-content:space-between; align-items:center; padding:12px 14px; cursor:pointer; font-weight:600; font-size:14px; background:#FAF7F1; }
  .date-head .count{ font-weight:400; font-size:12px; color:var(--ink-soft); }
  .date-head .chevron{ transition:transform .15s; color:var(--ink-soft); }
  .date-group.open .chevron{ transform:rotate(90deg); }
  .date-body{ display:none; }
  .date-group.open .date-body{ display:block; }
  .delivery-row{ display:flex; gap:10px; padding:10px 14px; border-top:1px solid var(--border); align-items:center; }
  .delivery-row img{ width:52px; height:52px; object-fit:cover; border-radius:4px; border:1px solid var(--border); flex-shrink:0; cursor:pointer; }
  .delivery-info{ flex:1; min-width:0; }
  .delivery-name{ font-weight:600; font-size:13.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .delivery-time{ font-size:12px; color:var(--ink-soft); margin-top:2px; }
  .lightbox{ position:fixed; inset:0; background:rgba(0,0,0,.85); display:none; align-items:center; justify-content:center; z-index:200; padding:20px; }
  .lightbox.open{ display:flex; }
  .lightbox img{ max-width:100%; max-height:100%; border-radius:4px; }
  .footer-note{ text-align:center; color:var(--ink-soft); font-size:11.5px; padding:20px 16px 30px; }
  .upcoming-badge{ font-size:11px; color:var(--teal); background:rgba(63,110,108,.12); border-radius:10px; padding:2px 9px; flex-shrink:0; }
  .shift-group{ border-top:1px solid var(--border); }
  .shift-group:first-child{ border-top:none; }
  .shift-head{ display:flex; justify-content:space-between; align-items:center; padding:9px 14px; cursor:pointer; font-size:12px; font-weight:600; color:var(--ink-soft); }
  .shift-head .chevron{ transition:transform .15s; font-size:11px; }
  .shift-group.open .shift-head .chevron{ transform:rotate(90deg); }
  .shift-body{ display:none; }
  .shift-group.open .shift-body{ display:block; }
  .search-wrap{ margin-bottom:14px; }
  .search-wrap input{ width:100%; padding:10px 12px; border:1px solid var(--border); border-radius:var(--radius); font-family:inherit; font-size:13.5px; background:var(--panel); color:var(--ink); }
  .search-wrap input:focus{ outline:2px solid var(--teal); outline-offset:-1px; }
</style>
</head>
<body>
<header>
  <h1 id="channelTitle">配送紀錄查詢</h1>
  <p id="channelSub">載入中...</p>
</header>
<main>
  <div class="search-wrap" id="searchWrap" style="display:none;"><input id="storeSearch" placeholder="搜尋門市名稱或代號"></div>
  <div id="content"></div>
</main>
<div class="lightbox" id="lightbox"><img id="lightboxImg" src=""></div>

<script>
function pad(n){ return String(n).padStart(2,'0'); }
function formatTime(d){ return `${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function weekdayZh(d){ return ['日','一','二','三','四','五','六'][d.getDay()]; }
function todayKeyTaipei(){
  const parts = new Intl.DateTimeFormat('en-CA', { timeZone:'Asia/Taipei', year:'numeric', month:'2-digit', day:'2-digit' }).formatToParts(new Date());
  const get = t => parts.find(p=>p.type===t).value;
  return `${get('year')}-${get('month')}-${get('day')}`;
}
function dateKeyCompare(a, b, todayKey){
  if(a === b) return 0;
  if(a === todayKey) return -1;
  if(b === todayKey) return 1;
  const aFuture = a > todayKey, bFuture = b > todayKey;
  if(aFuture && !bFuture) return -1;
  if(!aFuture && bFuture) return 1;
  return aFuture ? a.localeCompare(b) : b.localeCompare(a);
}

function rowHtml(it){
  return it.delivered ? `<div class="delivery-row">
    ${it.photoUrl ? `<img src="${it.photoUrl}" data-full="${it.photoUrl}">` : '<div style="width:52px;height:52px;background:#EFEEE9;border-radius:4px;flex-shrink:0;"></div>'}
    <div class="delivery-info">
      <div class="delivery-name">${it.name}</div>
      <div class="delivery-time">送達時間 ${formatTime(new Date(it.completedAt))}</div>
    </div>
  </div>` : `<div class="delivery-row">
    <div class="delivery-info">
      <div class="delivery-name">${it.name}</div>
    </div>
    <span class="upcoming-badge">尚未送達</span>
  </div>`;
}
function shiftGroupHtml(label, rows, forceOpen){
  if(!rows.length) return '';
  return `<div class="shift-group ${forceOpen?'open':''}">
    <div class="shift-head"><span>${label}（${rows.length}）</span><span class="chevron">▸</span></div>
    <div class="shift-body">${rows.map(rowHtml).join('')}</div>
  </div>`;
}
let allItems = [];
function renderList(filterText){
  const content = document.getElementById('content');
  const kw = (filterText||'').trim().toLowerCase();
  const items = kw ? allItems.filter(it=> it.name.toLowerCase().includes(kw)) : allItems;
  if(!items.length){
    content.innerHTML = `<div class="state-msg">${kw ? '找不到符合的門店。' : '目前沒有可顯示的配送記錄。'}</div>`;
    return;
  }
  const groups = {};
  items.forEach(it=>{ if(!groups[it.date]) groups[it.date] = []; groups[it.date].push(it); });
  const todayKey = todayKeyTaipei();
  const dateKeys = Object.keys(groups).sort((a,b)=> dateKeyCompare(a, b, todayKey));
  content.innerHTML = dateKeys.map((key)=>{
    const rows = groups[key];
    const sample = new Date(key + 'T00:00:00');
    const amRows = rows.filter(it=>it.shift==='AM');
    const pmRows = rows.filter(it=>it.shift==='PM');
    const otherRows = rows.filter(it=>it.shift!=='AM' && it.shift!=='PM');
    return `<div class="date-group ${kw?'open':''}" data-key="${key}">
      <div class="date-head">
        <span>${key}（星期${weekdayZh(sample)}）</span>
        <span><span class="count">${rows.length} 筆</span> <span class="chevron">▸</span></span>
      </div>
      <div class="date-body">
        ${shiftGroupHtml('上午', amRows, !!kw)}
        ${shiftGroupHtml('下午', pmRows, !!kw)}
        ${otherRows.map(rowHtml).join('')}
      </div>
    </div>`;
  }).join('') + '<div class="footer-note">照片與送達時間僅供核對配送紀錄使用。</div>';

  content.querySelectorAll('.date-head').forEach(head=>{
    head.onclick = ()=> head.closest('.date-group').classList.toggle('open');
  });
  content.querySelectorAll('.shift-head').forEach(head=>{
    head.onclick = (e)=>{ e.stopPropagation(); head.closest('.shift-group').classList.toggle('open'); };
  });
  content.querySelectorAll('img[data-full]').forEach(img=>{
    img.onclick = ()=>{
      document.getElementById('lightboxImg').src = img.dataset.full;
      document.getElementById('lightbox').classList.add('open');
    };
  });
  document.getElementById('lightbox').onclick = ()=> document.getElementById('lightbox').classList.remove('open');
}
async function main(){
  const params = new URLSearchParams(location.search);
  const token = params.get('token');
  const content = document.getElementById('content');
  const sub = document.getElementById('channelSub');
  if(!token){
    content.innerHTML = '<div class="state-msg">網址缺少查詢代碼，請確認完整連結是否正確貼上。</div>';
    sub.textContent = '';
    return;
  }
  try{
    const res = await fetch('/api/client-data?token=' + encodeURIComponent(token));
    const body = await res.json();
    if(!res.ok){
      content.innerHTML = `<div class="state-msg">${body.error || '讀取失敗，請稍後再試。'}</div>`;
      sub.textContent = '';
      return;
    }
    document.getElementById('channelTitle').textContent = body.channelName + '配送紀錄查詢';
    document.title = body.channelName + '配送紀錄查詢';
    const items = body.items || [];
    const deliveredCount = items.filter(it=>it.delivered).length;
    sub.textContent = `最近60天，共 ${deliveredCount} 筆送達紀錄`;

    allItems = items;
    if(items.length){
      document.getElementById('searchWrap').style.display = 'block';
      document.getElementById('storeSearch').oninput = (e)=> renderList(e.target.value);
    }
    renderList('');
  }catch(e){
    content.innerHTML = '<div class="state-msg">網路連線發生問題，請稍後再試。</div>';
    sub.textContent = '';
  }
}
main();
</script>
</body>
</html>
